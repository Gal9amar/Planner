                            <div style={{ width:36, height:36, borderRadius:10, background: a.iconBg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, boxShadow:`0 0 0 4px ${a.bar}18` }}>
                                {icon}
                            </div>
                            <div>
                                <div style={{ fontWeight:700, fontSize:15, color:'#1e293b', letterSpacing:'-0.01em' }}>{title}</div>
                                {desc && <div style={{ fontSize:12, color:'#94a3b8', marginTop:2, lineHeight:1.5 }}>{desc}</div>}
                            </div>
                            <div style={{ marginRight:'auto', width:3, height:32, borderRadius:4, background: a.bar, flexShrink:0 }} />
                        </div>
                    </div>
                    <div style={{ padding:'20px 24px' }}>
                        {children}
                    </div>
                </div>
            );
        }

        // ========== SETTINGS SCREEN ==========
        function SettingsScreen({ data, dispatch, onDirtyChange }) {
            const taskTypes = data.taskTypes || DEFAULT_TASK_TYPES;
            const [title, setTitle] = useState(data.meta.title);
            const [year, setYear] = useState(data.meta.year);
            const [hpd, setHpd] = useState(data.manpower.hours_per_day);
            const [localDefaultType, setLocalDefaultType] = useState(data.defaultTaskType || taskTypes[0] || 'פרויקט');
            const [localRoles, setLocalRoles] = useState(data.roles);
            const [localTypes, setLocalTypes] = useState(taskTypes);
            const [newRole, setNewRole] = useState('');
            const [newType, setNewType] = useState('');

            const rolesChanged = JSON.stringify(localRoles) !== JSON.stringify(data.roles);
            const typesChanged = JSON.stringify(localTypes) !== JSON.stringify(taskTypes);

            const isDirty = title !== data.meta.title
                || Number(year) !== data.meta.year
                || Number(hpd) !== data.manpower.hours_per_day
                || localDefaultType !== (data.defaultTaskType || taskTypes[0] || 'פרויקט')
                || rolesChanged || typesChanged;

            useEffect(() => { if (onDirtyChange) onDirtyChange(isDirty); }, [isDirty]);

            function saveAll() {
                if (title !== data.meta.title) dispatch({ type: 'SET_META_FIELD', field: 'title', value: title });
                if (Number(hpd) !== data.manpower.hours_per_day) dispatch({ type: 'SET_HOURS_PER_DAY', value: Number(hpd) });
                if (Number(year) !== data.meta.year) {
                    dispatch({ type: 'SET_META_FIELD', field: 'year', value: Number(year) });
                    const auto = calcWorkdaysPerMonth(Number(year));
                    auto.forEach((v, i) => dispatch({ type: 'SET_WORKDAY_BASE', idx: i, value: v }));
                }
                const origType = data.defaultTaskType || taskTypes[0] || 'פרויקט';
                if (localDefaultType !== origType) dispatch({ type: 'SET_DEFAULT_TASK', taskType: localDefaultType });
                if (rolesChanged) dispatch({ type:'SET_ROLES', roles: localRoles });
                if (typesChanged) dispatch({ type:'SET_TASK_TYPES', taskTypes: localTypes });
                if (onDirtyChange) onDirtyChange(false);
                Swal.fire({ toast:true, position:'top-end', icon:'success', title:'ההגדרות נשמרו', showConfirmButton:false, timer:1800, timerProgressBar:true });
            }

            function addRole(name) {
                if (!name) return;
                setLocalRoles(prev => prev.includes(name) ? prev : [...prev, name]);
                setNewRole('');
            }

            function addType(name) {
                if (!name) return;
                setLocalTypes(prev => prev.includes(name) ? prev : [...prev, name]);
                setNewType('');
            }

            const inp = "w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-400/40 focus:border-violet-400 transition shadow-sm";
            const inpSm = "px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-center font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-violet-400/40 focus:border-violet-400 transition shadow-sm";
            const sel = "w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400/40 focus:border-sky-400 transition shadow-sm appearance-none cursor-pointer";
            const fieldHint = "text-xs text-slate-400 mt-1.5 leading-relaxed";

            return (
                <div style={{background:'#f4f6fb', minHeight:'100%'}} className="p-6 space-y-5">

                    {/* ── SAVE BAR ── */}
                    <div style={{
                        display:'flex', alignItems:'center', justifyContent:'space-between',
                        padding:'14px 22px',
                        borderRadius:16,
                        background: isDirty ? 'linear-gradient(135deg,#faf5ff,#ede9fe)' : 'linear-gradient(135deg,#f8fafc,#f1f5f9)',
                        border: isDirty ? '1.5px solid #c4b5fd' : '1.5px solid #e2e8f0',
                        boxShadow: isDirty ? '0 4px 20px rgba(139,92,246,0.15)' : '0 2px 8px rgba(0,0,0,0.04)',
                        transition:'all 0.25s',
                    }}>
                        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                            <div style={{ width:8, height:8, borderRadius:'50%', background: isDirty ? '#8b5cf6' : '#94a3b8', boxShadow: isDirty ? '0 0 0 4px #c4b5fd55' : 'none', transition:'all 0.25s' }} />
                            <span style={{ fontSize:13, fontWeight:600, color: isDirty ? '#4c1d95' : '#94a3b8' }}>
                                {isDirty ? 'יש שינויים שלא נשמרו' : 'כל השינויים מעודכנים'}
                            </span>
                        </div>
                        <div style={{ display:'flex', gap:10 }}>
                            <button onClick={() => window.parent._wgsb?.deleteGantt(data.gantt?.id, data.gantt?.name)} style={{
                                padding:'9px 18px', borderRadius:10, fontSize:13, fontWeight:700, border:'1.5px solid #fecaca', cursor:'pointer',
                                background:'rgba(239,68,68,0.06)', color:'#ef4444', transition:'all 0.2s',
                            }}
                            onMouseEnter={e=>{e.currentTarget.style.background='rgba(239,68,68,0.14)';e.currentTarget.style.borderColor='#ef4444'}}
                            onMouseLeave={e=>{e.currentTarget.style.background='rgba(239,68,68,0.06)';e.currentTarget.style.borderColor='#fecaca'}}>
                                🗑 מחק גאנט
                            </button>
                            <button onClick={saveAll} disabled={!isDirty} style={{
                                padding:'9px 26px', borderRadius:10, fontSize:13, fontWeight:700, border:'none', cursor: isDirty ? 'pointer' : 'not-allowed',
                                background: isDirty ? 'linear-gradient(135deg,#8b5cf6,#7c3aed)' : '#e2e8f0',
                                color: isDirty ? '#fff' : '#94a3b8',
                                boxShadow: isDirty ? '0 4px 14px rgba(139,92,246,0.4)' : 'none',
                                transition:'all 0.2s',
                            }}>
                                שמור הגדרות
                            </button>
                        </div>
                    </div>

                    {/* ── ROW 1: כללי + ברירת מחדל ── */}
                    <div className="flex gap-5 flex-wrap">
                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="violet" icon="⚙️" title="כללי" desc="הגדרות בסיסיות של הגאנט השנתי">
                            <div className="space-y-4">
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>שם התוכנית</label>
                                    <input value={title} onChange={e => setTitle(e.target.value)} className={inp} placeholder="שם הגאנט..." />
                                    <p className={fieldHint}>מוצג בכותרת הגאנט ובסיידבר.</p>
                                </div>
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>שנה</label>
                                    <input type="number" value={year} onChange={e => setYear(e.target.value)} className={inpSm} style={{width:130}} />
                                    <p className={fieldHint}>שינוי שנה יחשב מחדש את ימי העבודה לפי לוח השנה.</p>
                                </div>
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>שעות ביום עבודה</label>
                                    <input type="number" step="0.5" min="1" max="24" value={hpd} onChange={e => setHpd(e.target.value)} className={inpSm} style={{width:120}} />
                                    <p className={fieldHint}>בסיס חישוב שעות זמינות לכל עובד.</p>
                                </div>
                            </div>
                        </SectionCard>
                        </div>

                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="sky" icon="✦" title="ברירת מחדל למשימה חדשה" desc="ערך שיוגדר אוטומטית בהוספת משימה">
                            <div>
                                <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>סוג משימה</label>
                                <div style={{position:'relative'}}>
                                    <select value={localDefaultType} onChange={e => setLocalDefaultType(e.target.value)} className={sel}>
                                        {localTypes.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                    <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94a3b8',fontSize:11}}>▾</span>
                                </div>
                                <p className={fieldHint}>הסוג שייבחר בעמודת "סוג משימה" אוטומטית.</p>
                            </div>
                        </SectionCard>
                        </div>
                    </div>

                    {/* ── ROW 2: תפקידים + סוגי משימות ── */}
                    <div className="flex gap-5 flex-wrap">
                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="emerald" icon="👤" title="תפקידים" desc="לסיווג עובדים ומעקב ניצול משאבים לפי תפקיד">
                            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14,minHeight:36}}>
                                {localRoles.map(r => (
                                    <span key={r} style={{ display:'inline-flex',alignItems:'center',gap:4,padding:'5px 12px',borderRadius:10,background:'#f1f5f9',color:'#475569',fontSize:13,fontWeight:500,boxShadow:'0 1px 3px rgba(0,0,0,0.07)' }}>
                                        {r}
                                        <button onClick={async () => {
                                            const res = await Swal.fire({ title:`למחוק תפקיד?`, text:`"${r}" יימחק`, icon:'warning', showCancelButton:true, confirmButtonText:'מחק', cancelButtonText:'ביטול', reverseButtons:true });
                                            if (res.isConfirmed) setLocalRoles(prev => prev.filter(x => x !== r));
                                        }} style={{color:'#94a3b8',background:'none',border:'none',cursor:'pointer',padding:'0 0 0 2px',fontSize:15,lineHeight:1}} onMouseEnter={e=>e.target.style.color='#ef4444'} onMouseLeave={e=>e.target.style.color='#94a3b8'}>×</button>
                                    </span>
                                ))}
                                {localRoles.length === 0 && <span style={{fontSize:12,color:'#cbd5e1',alignSelf:'center'}}>הוסף תפקיד ראשון...</span>}
                            </div>
                            <div style={{display:'flex',gap:8}}>
                                <input value={newRole} onChange={e => setNewRole(e.target.value)}
                                    onKeyDown={e => { if (e.key==='Enter') addRole(newRole.trim()); }}
                                    placeholder="שם תפקיד חדש..." className={inp} style={{flex:1}} />
                                <button onClick={() => addRole(newRole.trim())}
                                    style={{padding:'10px 18px',borderRadius:10,background:'linear-gradient(135deg,#10b981,#059669)',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,boxShadow:'0 2px 8px rgba(16,185,129,0.3)',whiteSpace:'nowrap'}}>
                                    + הוסף
                                </button>
                            </div>
                        </SectionCard>
                        </div>

                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="amber" icon="🏷️" title="סוגי משימות" desc="קיטלוג משימות לפי אופי — מוצג בצבע בגאנט">
                            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14,minHeight:36}}>
                                {localTypes.map(t => (
                                    <span key={t} style={{ display:'inline-flex',alignItems:'center',gap:4,padding:'5px 12px',borderRadius:10,background:getTypeColor(t,localTypes)+'18',color:getTypeColor(t,localTypes),fontSize:13,fontWeight:600,boxShadow:'inset 0 0 0 1.5px '+getTypeColor(t,localTypes)+'33' }}>
                                        {t}
                                        <button onClick={async () => {
                                            const inUse = data.tasks.some(task => task.type === t);
                                            if (inUse) { await Swal.fire({ title:'לא ניתן למחוק', text:`הסוג "${t}" בשימוש`, icon:'warning', confirmButtonText:'סגור' }); return; }
                                            const res = await Swal.fire({ title:`למחוק סוג?`, text:`"${t}" יימחק`, icon:'warning', showCancelButton:true, confirmButtonText:'מחק', cancelButtonText:'ביטול', reverseButtons:true });
                                            if (res.isConfirmed) setLocalTypes(prev => prev.filter(x => x !== t));
                                        }} style={{background:'none',border:'none',cursor:'pointer',padding:'0 0 0 2px',fontSize:15,lineHeight:1,color:getTypeColor(t,localTypes)+'99'}} onMouseEnter={e=>e.target.style.color='#ef4444'} onMouseLeave={e=>e.target.style.color=getTypeColor(t,localTypes)+'99'}>×</button>
                                    </span>
                                ))}
                                {localTypes.length === 0 && <span style={{fontSize:12,color:'#cbd5e1',alignSelf:'center'}}>הוסף סוג ראשון...</span>}
                            </div>
                            <div style={{display:'flex',gap:8}}>
                                <input value={newType} onChange={e => setNewType(e.target.value)}
                                    onKeyDown={e => { if (e.key==='Enter') addType(newType.trim()); }}
                                    placeholder="סוג חדש..." className={inp} style={{flex:1}} />
                                <button onClick={() => addType(newType.trim())}
                                    style={{padding:'10px 18px',borderRadius:10,background:'linear-gradient(135deg,#f59e0b,#d97706)',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,boxShadow:'0 2px 8px rgba(245,158,11,0.3)',whiteSpace:'nowrap'}}>
                                    + הוסף
                                </button>
                            </div>
                        </SectionCard>
                        </div>
                    </div>

                </div>
            );
        }

        // ========== EXPORT / IMPORT ==========
        function exportToExcel(data) {
            const wb = XLSX.utils.book_new();
            const hpd = data.manpower.hours_per_day;
            const roleHours = roleHoursByMonth(data.manpower.employees, hpd, data.roles);
            const settings = data.settings || { dev_role: 'פיתוח', qa_role: 'בודק' };
            const totals = tasksMonthlyTotal(data.tasks);
            const devAvail = roleHours[settings.dev_role] || new Array(12).fill(0);
            const qaAvail = roleHours[settings.qa_role] || new Array(12).fill(0);

            // ── Style helpers ──────────────────────────────────────────────
            const border = { top:{style:'thin',color:{rgb:'E2E8F0'}}, bottom:{style:'thin',color:{rgb:'E2E8F0'}}, left:{style:'thin',color:{rgb:'E2E8F0'}}, right:{style:'thin',color:{rgb:'E2E8F0'}} };
            const rtl = { horizontal:'right', vertical:'center', wrapText:true, readingOrder:2 };
            const center = { horizontal:'center', vertical:'center', wrapText:true, readingOrder:2 };

            function sTitle(rgb='1E3A5F') {
                return { font:{name:'Arial',sz:14,bold:true,color:{rgb:'FFFFFF'}}, fill:{patternType:'solid',fgColor:{rgb}}, alignment:center, border };
            }
            function sHeader(rgb='2563EB') {
                return { font:{name:'Arial',sz:10,bold:true,color:{rgb:'FFFFFF'}}, fill:{patternType:'solid',fgColor:{rgb}}, alignment:center, border };
            }
            function sCell(rgb=null, bold=false, color='000000', align=null) {
                return { font:{name:'Arial',sz:10,bold,color:{rgb:color}}, fill: rgb ? {patternType:'solid',fgColor:{rgb}} : {patternType:'none'}, alignment: align||rtl, border };
            }
            function sCellCenter(rgb=null, bold=false, color='000000') {
                return sCell(rgb, bold, color, center);
            }

            function setCell(ws, addr, value, style) {
                if (!ws[addr]) ws[addr] = {};
                ws[addr].v = value;
                ws[addr].t = (typeof value === 'number') ? 'n' : 's';
                ws[addr].s = style;
            }

            function colName(c) {
                let s = '';
                c++;
                while (c > 0) { s = String.fromCharCode(65 + (c-1)%26) + s; c = Math.floor((c-1)/26); }
                return s;
            }

            function addr(r, c) { return colName(c) + (r+1); }

            function setRange(ws, ref) {
                try { XLSX.utils.decode_range(ref); } catch(e) { return; } // guard: skip invalid ranges
                if (!ws['!ref']) { ws['!ref'] = ref; return; }
                const cur = XLSX.utils.decode_range(ws['!ref']);
                const nw  = XLSX.utils.decode_range(ref);
                cur.e.r = Math.max(cur.e.r, nw.e.r);
                cur.e.c = Math.max(cur.e.c, nw.e.c);
                ws['!ref'] = XLSX.utils.encode_range(cur);
            }

            // ══════════════════════════════════════════════════════════════
            // Sheet 1 — תוכנית עבודה
            // cols: name(0) owner(1) type(2) planned(3) qa_planned(4) [m0..m11](5..16) rowTotal(17) notes(18)
            // ══════════════════════════════════════════════════════════════
            const ws1 = {};
            const FIXED_COLS = 5;
            const MONTH_COLS = 12;
            const TOTAL_COLS = FIXED_COLS + MONTH_COLS + 2; // 19: fixed(5) + months(12) + rowTotal + notes

            // Row 0 — title
            for (let c = 0; c < TOTAL_COLS; c++) setCell(ws1, addr(0,c), c===0 ? (data.meta.title+' '+data.meta.year) : '', sTitle());
            ws1['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:TOTAL_COLS-1} }];

            // Row 1 — quarter spans
            for (let c = 0; c < TOTAL_COLS; c++) setCell(ws1, addr(1,c), '', sHeader('1E3A5F'));
            ['Q1','Q2','Q3','Q4'].forEach((q,qi) => { setCell(ws1, addr(1, FIXED_COLS+qi*3), q, sHeader('2563EB')); });
            ws1['!merges'].push({ s:{r:1,c:0}, e:{r:1,c:FIXED_COLS-1} });
            [0,1,2,3].forEach(qi => {
                ws1['!merges'].push({ s:{r:1,c:FIXED_COLS+qi*3}, e:{r:1,c:FIXED_COLS+qi*3+2} });
            });
            ws1['!merges'].push({ s:{r:1,c:FIXED_COLS+MONTH_COLS}, e:{r:1,c:TOTAL_COLS-1} });

            // Row 2 — column headers
            const fixedHdrs = ['משימה','מוביל','סוג','זמן פיתוח','זמן בדיקות'];
            fixedHdrs.forEach((h,c) => setCell(ws1, addr(2,c), h, sHeader()));
            MONTHS.forEach((mo, mi) => setCell(ws1, addr(2, FIXED_COLS+mi), mo, sHeader('2563EB')));
            setCell(ws1, addr(2, FIXED_COLS+MONTH_COLS),   'סה"כ פיתוח', sHeader('0369A1'));
            setCell(ws1, addr(2, FIXED_COLS+MONTH_COLS+1), 'הערות',      sHeader());

            // Data rows (start at row 3)
            let r = 3;
            data.tasks.forEach((t, ti) => {
                const rowSum = taskRowSum(t);
                const bg = ti%2===0 ? null : 'F8FAFC';
                setCell(ws1, addr(r,0), t.name,          sCell(bg, true));
                setCell(ws1, addr(r,1), t.owner||'',     sCell(bg));
                setCell(ws1, addr(r,2), t.type||'',      sCellCenter(bg));
                setCell(ws1, addr(r,3), t.planned||'',   sCellCenter(bg));
                setCell(ws1, addr(r,4), t.qa_planned||0, sCellCenter('F3E8FF'));
                for (let mi = 0; mi < 12; mi++) {
                    setCell(ws1, addr(r, FIXED_COLS+mi), t.months[mi]||0, sCellCenter(bg));
                }
                setCell(ws1, addr(r, FIXED_COLS+MONTH_COLS),   rowSum,      sCellCenter('E0F2FE', true));
                setCell(ws1, addr(r, FIXED_COLS+MONTH_COLS+1), t.notes||'', sCell(bg));
                r++;
            });

            // Summary rows
            const devDiff = devAvail.map((a,i) => a - totals[i]);
            const summaryDefs = [
                { label:'סה"כ פיתוח',                          vals: totals,   bg:'FEF3C7', color:'000000', bold:true },
                { label:`זמינות פיתוח (${settings.dev_role})`,  vals: devAvail, bg:'065F46', color:'FFFFFF', bold:true, diffVals: devDiff, diffLabel:'הפרש פיתוח' },
            ];

            summaryDefs.forEach(def => {
                for (let c = 0; c < TOTAL_COLS; c++) {
                    let val = '';
                    if (c === 0) val = def.label;
                    else if (c >= FIXED_COLS && c < FIXED_COLS+MONTH_COLS) val = def.vals ? (def.vals[c-FIXED_COLS]||0) : '';
                    setCell(ws1, addr(r,c), val, sCellCenter(def.bg, def.bold, def.color));
                }
                r++;
                if (def.diffVals) {
                    for (let c = 0; c < TOTAL_COLS; c++) {
                        let val = c===0 ? def.diffLabel : '';
                        if (c >= FIXED_COLS && c < FIXED_COLS+MONTH_COLS) {
                            val = def.diffVals[c-FIXED_COLS];
                            const diffBg = typeof val === 'number' ? (val>=0?'D1FAE5':'FEE2E2') : null;
                            const diffColor = typeof val === 'number' ? (val>=0?'065F46':'991B1B') : '000000';
                            setCell(ws1, addr(r,c), val, sCellCenter(diffBg, true, diffColor));
                            continue;
                        }
                        setCell(ws1, addr(r,c), val, sCellCenter(null, true, '000000'));
                    }
                    r++;
                }
            });

            if (r > 0) setRange(ws1, addr(0,0)+':'+addr(r-1,TOTAL_COLS-1));
            ws1['!cols'] = [
                {wch:30},{wch:12},{wch:10},{wch:12},{wch:10},
                ...MONTHS.map(()=>({wch:7})),
                {wch:12},{wch:30}
            ];
            ws1['!freeze'] = { xSplit:2, ySplit:3 };
            ws1['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws1, 'תוכנית עבודה');

            // ══════════════════════════════════════════════════════════════
            // Sheet 2 — כוח אדם
            // ══════════════════════════════════════════════════════════════
            const ws2 = {};
            let r2 = 0;

            // Section: ימי עבודה
            const wdHdrs = ['ימי עבודה','', ...MONTHS];
            wdHdrs.forEach((h,c) => setCell(ws2, addr(r2,c), h, sHeader()));
            r2++;
            setCell(ws2, addr(r2,0), '', sCell(null));
            setCell(ws2, addr(r2,1), 'ימי בסיס', sCell('EFF6FF',true));
            data.manpower.workdays_base.forEach((d,mi) => setCell(ws2, addr(r2,2+mi), d, sCellCenter('EFF6FF')));
            r2++;

            r2++; // blank

            // Section: עובדים
            const empHdrs = ['שם','תפקיד',...MONTHS,'סה"כ ימי חופש'];
            empHdrs.forEach((h,c) => setCell(ws2, addr(r2,c), h, sHeader()));
            r2++;
            data.manpower.employees.forEach((e,ei) => {
                const bg = ei%2===0 ? null : 'F8FAFC';
                setCell(ws2, addr(r2,0), e.name, sCell(bg,true));
                setCell(ws2, addr(r2,1), e.team, sCell(bg));
                let totalVac = 0;
                e.vacation.forEach((v,mi) => {
                    totalVac += v||0;
                    setCell(ws2, addr(r2,2+mi), v||0, sCellCenter(v>0?'FED7AA':bg));
                });
                setCell(ws2, addr(r2,14), totalVac, sCellCenter(bg,true));
                r2++;
            });

            r2++; // blank

            // Section: שעות זמינות
            const hrHdrs = ['שם','תפקיד',...MONTHS,'סה"כ שעות'];
            hrHdrs.forEach((h,c) => setCell(ws2, addr(r2,c), h, sHeader()));
            r2++;
            data.manpower.employees.forEach((e,ei) => {
                const bg = ei%2===0 ? null : 'F8FAFC';
                const hrs = personHours(e, hpd);
                const total = hrs.reduce((a,b)=>a+b,0);
                setCell(ws2, addr(r2,0), e.name, sCell(bg,true));
                setCell(ws2, addr(r2,1), e.team, sCell(bg));
                hrs.forEach((h,mi) => setCell(ws2, addr(r2,2+mi), h, sCellCenter(bg)));
                setCell(ws2, addr(r2,14), total, sCellCenter(bg,true));
                r2++;
            });

            if (r2 > 0) setRange(ws2, addr(0,0)+':'+addr(r2-1,14));
            ws2['!cols'] = [{wch:20},{wch:12},...MONTHS.map(()=>({wch:8})),{wch:14}];
            ws2['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws2, 'כוח אדם');

            // ══════════════════════════════════════════════════════════════
            // Sheet 3 — חלוקת משאבים
            // ══════════════════════════════════════════════════════════════
            const ws3 = {};
            let r3 = 0;

            const resHdrs = ['תפקיד','עובדים',...MONTHS,'סה"כ'];
            resHdrs.forEach((h,c) => setCell(ws3, addr(r3,c), h, sHeader()));
            r3++;

            const counts = {};
            data.manpower.employees.forEach(e => { counts[e.team] = (counts[e.team]||0)+1; });
            data.roles.forEach((role, ri) => {
                const hrs = roleHours[role] || new Array(12).fill(0);
                const total = hrs.reduce((a,b)=>a+b,0);
                const bg = ri%2===0 ? null : 'F8FAFC';
                setCell(ws3, addr(r3,0), role, sCell(bg,true));
                setCell(ws3, addr(r3,1), counts[role]||0, sCellCenter(bg));
                hrs.forEach((h,mi) => setCell(ws3, addr(r3,2+mi), h, sCellCenter(bg)));
                setCell(ws3, addr(r3,14), total, sCellCenter(bg,true));
                r3++;
            });

            if (r3 > 0) setRange(ws3, addr(0,0)+':'+addr(r3-1,14));
            ws3['!cols'] = [{wch:16},{wch:10},...MONTHS.map(()=>({wch:8})),{wch:10}];
            ws3['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws3, 'חלוקת משאבים');

            // ══════════════════════════════════════════════════════════════
            // Sheet 4 — ספרינטים
            // ══════════════════════════════════════════════════════════════
            const ws4 = {};
            let r4 = 0;

            data.sprints.forEach(sp => {
                // Sprint name header (merged A:E)
                for (let c=0;c<5;c++) setCell(ws4, addr(r4,c), c===0?sp.name+(sp.dates?' – '+sp.dates:''):'', sHeader());
                if (!ws4['!merges']) ws4['!merges'] = [];
                ws4['!merges'].push({ s:{r:r4,c:0}, e:{r:r4,c:4} });
                r4++;

                // Column headers
                ['משימה','סוג','תכנון','ביצוע','חריגה'].forEach((h,c) => setCell(ws4, addr(r4,c), h, sHeader('3B82F6')));
                r4++;

                sp.items.forEach((it, ii) => {
                    const bg = ii%2===0 ? null : 'F8FAFC';
                    const diff = n(it.done)-n(it.plan);
                    const diffBg = diff>=0?'D1FAE5':'FEE2E2';
                    const diffColor = diff>=0?'065F46':'991B1B';
                    setCell(ws4, addr(r4,0), it.task_name||it.task||'', sCell(bg));
                    setCell(ws4, addr(r4,1), it.type||'', sCellCenter(bg));
                    setCell(ws4, addr(r4,2), n(it.plan), sCellCenter(bg));
                    setCell(ws4, addr(r4,3), n(it.done), sCellCenter(bg));
                    setCell(ws4, addr(r4,4), diff, sCellCenter(diffBg, true, diffColor));
                    r4++;
                });
                r4++; // blank between sprints
            });

            if (r4 > 0) setRange(ws4, addr(0,0)+':'+addr(r4-1,4));
            ws4['!cols'] = [{wch:30},{wch:10},{wch:10},{wch:10},{wch:10}];
            ws4['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws4, 'ספרינטים');

            // ══════════════════════════════════════════════════════════════
            // Sheet 5 — סיכום + Pivot
            // ══════════════════════════════════════════════════════════════
            const ws5 = {};
            let r5 = 0;

            // Title row
            const pivotTotalCols = 1 + 12 + 1; // type + 12 months + total = 14 cols (0..13)
            for (let c=0;c<pivotTotalCols;c++) setCell(ws5, addr(r5,c), c===0?'סיכום שנתי – '+data.meta.year:'', sTitle());
            if (!ws5['!merges']) ws5['!merges'] = [];
            ws5['!merges'].push({ s:{r:r5,c:0}, e:{r:r5,c:pivotTotalCols-1} });
            r5++;

            // KPI Section
            const totalTasksPlanned = data.tasks.reduce((s,t) => s + (t.planned==='?'||t.planned==='' ? 0 : n(t.planned)), 0);
            const totalQaPlanned    = data.tasks.reduce((s,t) => s + (n(t.qa_planned)||0), 0);
            const totalDevAvail = devAvail.reduce((a,b)=>a+b,0);
            const totalPlanned  = totals.reduce((a,b)=>a+b,0);
            const totalDevDiff  = totalDevAvail - totalPlanned;

            const totalRoleHours = {};
            data.roles.forEach(role => {
                totalRoleHours[role] = (roleHours[role]||new Array(12).fill(0)).reduce((a,b)=>a+b,0);
            });

            const kpis = [
                ['שנה', data.meta.year],
                ['סה"כ משימות', data.tasks.length],
                ['סה"כ שעות פיתוח מתוכנן', totalTasksPlanned],
                ['סה"כ שעות בדיקות מתוכנן', totalQaPlanned],
                ...data.roles.map(role => [`זמינות ${role}`, totalRoleHours[role]||0]),
                ['הפרש פיתוח', totalDevDiff],
            ];

            kpis.forEach((kpi, ki) => {
                const bg = ki%2===0 ? 'F8FAFC' : null;
                setCell(ws5, addr(r5,0), kpi[0], sCell(bg,true));
                setCell(ws5, addr(r5,1), kpi[1], sCellCenter(bg));
                for (let c=2;c<pivotTotalCols;c++) setCell(ws5, addr(r5,c), '', sCell(bg));
                r5++;
            });

            r5++; // blank

            // Pivot table
            const types = [...new Set(data.tasks.map(t=>t.type||'אחר'))];

            // Pivot header
            const pivHdrs = ['סוג משימה',...MONTHS,'סה"כ'];
            pivHdrs.forEach((h,c) => setCell(ws5, addr(r5,c), h, sHeader()));
            r5++;

            // Pivot data rows
            types.forEach((type,ti) => {
                const bg = ti%2===0 ? null : 'F8FAFC';
                const tasksOfType = data.tasks.filter(t=>(t.type||'אחר')===type);
                const monthSums = MONTHS.map((_,mi) => tasksOfType.reduce((s,t)=>s+(t.months[mi]||0),0));
                const rowTotal = monthSums.reduce((a,b)=>a+b,0);
                setCell(ws5, addr(r5,0), type, sCell(bg,true));
                monthSums.forEach((v,mi) => setCell(ws5, addr(r5,1+mi), v, sCellCenter(bg)));
                setCell(ws5, addr(r5,13), rowTotal, sCellCenter(bg,true));
                r5++;
            });

            // Pivot totals row
            const pivMonthTotals = MONTHS.map((_,mi) => data.tasks.reduce((s,t)=>s+(t.months[mi]||0),0));
            const pivGrandTotal  = pivMonthTotals.reduce((a,b)=>a+b,0);
            setCell(ws5, addr(r5,0), 'סה"כ', sCellCenter('FEF3C7',true));
            pivMonthTotals.forEach((v,mi) => setCell(ws5, addr(r5,1+mi), v, sCellCenter('FEF3C7',true)));
            setCell(ws5, addr(r5,13), pivGrandTotal, sCellCenter('FEF3C7',true));
            r5++;

            if (r5 > 0) setRange(ws5, addr(0,0)+':'+addr(r5-1,pivotTotalCols-1));
            ws5['!cols'] = [{wch:22},...MONTHS.map(()=>({wch:8})),{wch:10}];
            ws5['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws5, 'סיכום + Pivot');

            XLSX.writeFile(wb, `${data.meta.title} ${data.meta.year} - ${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        async function importFromExcel(file, dispatch, currentData) {
            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type: 'array' });
            const tasks = [];
            let workdays_base = null;

            const tasksSheet = wb.SheetNames.find(n => n.includes('תוכנית') || n.includes('ת"ע'));
            if (tasksSheet) {
                const s = wb.Sheets[tasksSheet];
                const rows = XLSX.utils.sheet_to_json(s, { header: 1, defval: '' });
                // cols: name(0) owner(1) type(2) planned(3) qa_planned(4) [m0..m11](5..16) rowTotal(17) notes(18)
                for (let i = 3; i < rows.length; i++) {
                    const r = rows[i];
                    if (!r[0] || String(r[0]).startsWith('סה') || String(r[0]).startsWith('משאבי') || String(r[0]).startsWith('הפרש') || String(r[0]).startsWith('זמינות') || String(r[0]).startsWith('זמני') || String(r[0]).startsWith('עודף')) continue;
                    const months = [];
                    for (let mi = 0; mi < 12; mi++) months.push(n(r[5 + mi]));
                    tasks.push({ name: r[0]||'', owner: r[1]||'', type: r[2]||'', planned: r[3]==='?'?'?':(r[3]===''?'':n(r[3])), qa_planned: n(r[4])||0, months, notes: r[18]||'' });
                }
            }

            const manSheet = wb.SheetNames.find(n => n.includes('כוח אדם'));
            if (manSheet) {
                const s = wb.Sheets[manSheet];
                const rows = XLSX.utils.sheet_to_json(s, { header: 1, defval: '' });
                for (const r of rows) {
                    if (r[1] === 'ימי בסיס' && typeof r[2] === 'number') {
                        workdays_base = r.slice(2, 14).map(n); break;
                    }
                }
            }

            if (tasks.length || workdays_base) {
                const patch = { ...currentData };
                if (tasks.length) patch.tasks = tasks;
                if (workdays_base) patch.manpower = { ...patch.manpower, workdays_base };
                dispatch({ type: 'LOAD_ALL', payload: patch });
                Swal.fire({ title: 'ייבוא הצליח', text: `יובאו ${tasks.length} משימות`, icon: 'success', confirmButtonText: 'סגור' });
            } else {
                Swal.fire({ title: 'לא נמצאו נתונים', text: 'ודא שמבנה הקובץ תואם', icon: 'error', confirmButtonText: 'סגור' });
            }
        }

        // ========== API helpers ==========
        function stateToPayload(data) {
            return {
                gantt: {
                    name: data.meta?.title,
                    year: data.meta?.year || null,
                    month: null,
                    hours_per_day: data.manpower?.hours_per_day || 8.5,
                    workdays_base: data.manpower?.workdays_base || null,
                },
                roles: [
                    ...(data.roles || []).map((name, i) => ({ name, sort_order: i })),
                    ...(data.taskTypes || DEFAULT_TASK_TYPES).map((name, i) => ({ name: '__type__:' + name, sort_order: 1000 + i })),
                    ...Object.entries(data.settings || {}).map(([k, v], i) => ({ name: `__setting__:${k}=${v}`, sort_order: 2000 + i })),
                ],
                employees: (data.manpower?.employees || []).map((e, i) => ({
                    name: e.name, team: e.team,
                    vacation_json: e.vacation || null,
                    hours_override_json: e.hours_override || null,
                    workdays_json: e.workdays || null,
                    day_off_json: null,
                    hours_per_day_override: e.hours_per_day_override || 0,
                    sort_order: i,
                })),
                tasks: (data.tasks || []).map((t, i) => ({
                    name: t.name, owner: t.owner || '', type: t.type || '',
                    planned: String(t.planned ?? '0'),
                    qa_planned: Number(t.qa_planned) || 0,
                    months_json: t.months || null,
                    qa_months_json: t.qa_months || null,
                    days_json: null,
                    notes: t.notes || '', sort_order: i,
                    priority: t.priority != null && t.priority !== '' ? Number(t.priority) : null,
                    task_number: t.task_number || '',
                })),
                sprints: (data.sprints || []).map((s, i) => ({
                    name: s.name, dates: s.dates || '', sort_order: i,
                    items: (s.items || []).map((it, j) => ({
                        task_name: it.task || it.task_name || '', type: it.type || '',
                        plan: Number(it.plan || 0), done: Number(it.done || 0), sort_order: j,
                    })),
                })),
            };
        }

        function apiStateToAppState(api) {
            return {
                meta: { title: api.name || 'תוכנית שנתית', year: api.year || new Date().getFullYear() },
                manpower: {
                    workdays_base: api.workdays_base || calcWorkdaysPerMonth(api.year || new Date().getFullYear()),
                    hours_per_day: api.hours_per_day || 8.5,
                    employees: (api.employees || []).map(e => ({
                        name: e.name, team: e.team,
                        vacation: e.vacation_json || new Array(12).fill(0),
                        hours_override: e.hours_override_json || new Array(12).fill(0),
                        workdays: e.workdays_json || (api.workdays_base || new Array(12).fill(21)),
                        hours_per_day_override: e.hours_per_day_override || 0,
                    })),
                },
                tasks: (api.tasks || []).map(t => ({
                    name: t.name, owner: t.owner || '', type: t.type || '',
                    planned: t.planned || '0',
                    qa_planned: Number(t.qa_planned) || 0,
                    months: t.months_json || new Array(12).fill(0),
                    qa_months: t.qa_months_json || new Array(12).fill(0),
                    notes: t.notes || '',
                    priority: t.priority != null ? t.priority : null,
                    task_number: t.task_number || '',
                    _uid: t.id ? String(t.id) : Math.random().toString(36).slice(2),
                })),
                roles: (() => { const r = (api.roles || []).filter(r => !r.name.startsWith('__type__:') && !r.name.startsWith('__setting__:')).map(r => r.name === 'QA' ? 'בודק' : r.name); return r.length ? r : DEFAULT_ROLES; })(),
                taskTypes: (() => {
                    const tt = (api.roles || []).filter(r => r.name.startsWith('__type__:')).map(r => r.name.slice(9));
                    return tt.length ? tt : DEFAULT_TASK_TYPES;
                })(),
                settings: (() => {
                    const defaults = { dev_role: 'פיתוח', qa_role: 'בודק' };
                    (api.roles || []).filter(r => r.name.startsWith('__setting__:')).forEach(r => {
                        const pair = r.name.slice(12);
                        const eq = pair.indexOf('=');
                        if (eq > -1) {
                            const k = pair.slice(0, eq), v = pair.slice(eq + 1);
                            if (k !== 'qa_pct') defaults[k] = isNaN(Number(v)) ? v : Number(v);
                        }
                    });
                    if (defaults.qa_role === 'QA') defaults.qa_role = 'בודק';
                    return defaults;
                })(),
                sprints: (api.sprints || []).map(s => ({
                    name: s.name, dates: s.dates || '',
                    items: (s.items || []).map(it => ({
                        task: it.task_name || it.task || '', type: it.type || '',
                        plan: it.plan || 0, done: it.done || 0,
                    })),
                })),
            };
        }

        // ========== APP ==========
        function App() {
            const [data, dispatch] = useReducer(reducer, EMPTY_STATE);
            const [loaded, setLoaded] = useState(false);
            const isNewGantt = new URLSearchParams(location.search).get('new') === '1';
            const [screen, setScreen] = useState(() => isNewGantt ? 'settings' : (localStorage.getItem('wg_annual_screen') || 'dashboard'));
            const settingsDirtyRef = useRef(false);
            useEffect(() => { localStorage.setItem('wg_annual_screen', screen); }, [screen]);

            async function navigateTo(target) {
                if (screen === 'settings' && settingsDirtyRef.current) {
                    const res = await Swal.fire({ title:'יש שינויים שלא נשמרו', text:'האם לצאת מההגדרות מבלי לשמור?', icon:'warning', showCancelButton:true, confirmButtonText:'צא ללא שמירה', cancelButtonText:'הישאר', reverseButtons:true });
                    if (!res.isConfirmed) return;
                }
                setScreen(target);
            }
            const saveTimer = useRef(null);
            const isViewer = (() => { try { const a = getAuth(); const u = a && a.getUser(); return u?.role === 'viewer'; } catch { return false; } })();

            // Load from server on mount
            function loadGantt() {
                if (!ganttId) { setLoaded(true); return; }
                apiFetch(`${API_BASE}/gantts/${ganttId}`)
                    .then(r => r.json())
                    .then(api => {
                        if (api && api.id) {
                            dispatch({ type: 'LOAD_ALL', payload: apiStateToAppState(api) });
                            setLoaded(true);
                        }
                    })
                    .catch(() => {});
            }

            useEffect(() => {
                window.__wgOnLogin = () => { setLoaded(false); loadGantt(); };
                if (localStorage.getItem('wg_access_token')) loadGantt();
                else setLoaded(true);
                return () => { window.__wgOnLogin = null; };
            }, []);

            // Debounced save to server (skip for viewers)
            useEffect(() => {
                if (!loaded || !ganttId || isViewer) return;
                if (saveTimer.current) clearTimeout(saveTimer.current);
                saveTimer.current = setTimeout(() => {
                    apiFetch(`${API_BASE}/gantts/${ganttId}/state`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(stateToPayload(data)),
                    }).catch(console.error);
                }, 800);
            }, [data, loaded]);

            if (!loaded) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:16,color:'#64748b'}}>טוען...</div>;

            const titles = {
                dashboard: { title: 'דשבורד', sub: 'סקירה כללית של התוכנית השנתית.' },
                tasks: { title: 'תוכנית עבודה – רבעונית', sub: 'ניהול משימות וחלוקת שעות לחודשים.' },
                manpower: { title: 'כוח אדם', sub: 'עובדים, ימי עבודה וחופשות.' },
                resources: { title: 'חלוקת משאבים', sub: 'שעות זמינות לפי תפקיד (מחושב).' },
                sprints: { title: 'ספרינטים', sub: 'מעקב תכנון מול ביצוע.' },
                settings: { title: 'הגדרות גאנט', sub: 'שם, שנה, שעות ביום, תפקידים וסוגי משימות.' },
                help: { title: 'עזרה', sub: 'מפת נתונים ונוסחאות.' },
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    <Sidebar current={screen} onSelect={navigateTo} meta={data.meta} />
                    <main className={`flex-1 min-w-0 overflow-y-auto${isViewer ? ' wg-readonly' : ''}`}>
                        {isViewer && <div style={{background:'linear-gradient(90deg,#f59e0b,#f97316)',color:'#fff',padding:'6px 20px',fontSize:13,fontWeight:700,textAlign:'center',letterSpacing:'.02em'}}>מצב צפייה בלבד — אין לך הרשאות עריכה</div>}
                        <Header
                            title={titles[screen]?.title || ''}
                            subtitle={titles[screen]?.sub || ''}
                            onExport={() => exportToExcel(data)}
                            onImport={isViewer ? null : (f) => importFromExcel(f, dispatch, data)}
                            onReset={isViewer ? null : async () => { const r = await Swal.fire({ title: 'לאפס את כל הנתונים?', text: 'הפעולה תמחק את כל המשימות, העובדים והספרינטים', icon: 'warning', showCancelButton: true, confirmButtonText: 'אפס', cancelButtonText: 'ביטול', reverseButtons: true }); if (r.isConfirmed) dispatch({ type: 'LOAD_ALL', payload: EMPTY_STATE }); }}
                        />
                        {screen === 'dashboard' && <Dashboard data={data} />}
                        {screen === 'tasks' && <TasksScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} />}
                        {screen === 'manpower' && <ManpowerScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} />}
                        {screen === 'resources' && <ResourcesScreen data={data} />}
                        {screen === 'sprints' && <SprintsScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} />}
                        {screen === 'settings' && <SettingsScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} onDirtyChange={v => { settingsDirtyRef.current = v; }} />}
                        {screen === 'help' && <HelpScreen />}
                    </main>
                </div>
            );
        }

        const bootEl = document.getElementById('boot-screen');
        if (bootEl && bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
        if (window.__bootStatus) window.__bootStatus('מרנדר...');
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
<script src="/version-check.js"></script>
</body>
</html>
