    <style>
        .swal2-popup {

<body>
    <div id="root">
        <div id="boot-screen"
            style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#e0f2fe,#f1f5f9);color:#0f172a;font-family:'Heebo',system-ui,sans-serif;">
            <div style="width:52px;height:52px;border:5px solid #cbd5e1;border-top-color:#0ea5e9;border-radius:50%;animation:spin 1s linear infinite;"></div>
            <div style="font-size:18px;font-weight:600;">טוען תוכנית עבודה שנתית...</div>
            <div id="boot-status" style="font-size:13px;color:#475569;">טוען ספריות מהרשת</div>
            <div id="boot-error" style="max-width:640px;margin-top:8px;padding:14px 16px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;font-size:13px;display:none;white-space:pre-wrap;text-align:right;direction:rtl;"></div>
        </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    <script>
        (function () {
            var boot = document.getElementById('boot-status');
            var bootErr = document.getElementById('boot-error');
            function showErr(msg) {
                if (!bootErr) return;
                bootErr.style.display = 'block';
                bootErr.textContent = (bootErr.textContent ? bootErr.textContent + '\n' : '') + msg;
            }
            window.__bootStatus = function (msg) { if (boot) boot.textContent = msg; };
            window.__bootError = showErr;
            window.addEventListener('error', function (e) {
                if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                    showErr('נכשלה טעינה: ' + (e.target.src || e.target.href)); return;
                }
                showErr('שגיאה: ' + (e.message || e));
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                showErr('שגיאה אסינכרונית: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
            });
            setTimeout(function () {
                if (document.getElementById('boot-screen'))
                    showErr('הטעינה איטית – ודא חיבור לאינטרנט או בדוק Console (F12).');
            }, 15000);
        })();
    </script>

    <script>
        if (window.__bootStatus) window.__bootStatus('מקמפל את האפליקציה...');
    </script>
    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef, useReducer, useCallback } = React;

        // ========== CONSTANTS ==========
        const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
        const QUARTERS = [
            { name: 'Q1', months: [0,1,2], color: '#3b82f6' },
            { name: 'Q2', months: [3,4,5], color: '#10b981' },
            { name: 'Q3', months: [6,7,8], color: '#f59e0b' },
            { name: 'Q4', months: [9,10,11], color: '#8b5cf6' },
        ];
        const DEFAULT_TASK_TYPES = ['תשתית','שוטף','באגים','פרויקט'];
        const TASK_TYPES = DEFAULT_TASK_TYPES; // fallback
        const TASK_TYPE_COLORS_BASE = { 'תשתית':'#0ea5e9','שוטף':'#10b981','באגים':'#ef4444','פרויקט':'#8b5cf6','':'#94a3b8' };
        const COLOR_PALETTE = ['#0ea5e9','#10b981','#ef4444','#8b5cf6','#f59e0b','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
        function getTypeColor(name, taskTypes=[]) {
            if (!name) return '#94a3b8';
            if (TASK_TYPE_COLORS_BASE[name]) return TASK_TYPE_COLORS_BASE[name];
            const idx = taskTypes.indexOf(name);
            return COLOR_PALETTE[(idx >= 0 ? idx : 0) % COLOR_PALETTE.length];
        }
        const TASK_TYPE_COLORS = new Proxy(TASK_TYPE_COLORS_BASE, { get: (t,k) => t[k] || '#94a3b8' });
        const DEFAULT_ROLES = ['פיתוח','בודק','P&P','תשתיות','ניהול','אוטומציה','Devops','אחר'];

        const JIRA_STATUS_MAP = {
            'open': 'pending',
            'in dev': 'in-dev',
            'ready for dev': 'pending',
            'ready for qa': 'rfq',
            'testing': 'testing',
            'qa': 'testing',
            'po review': 'done',
        };

        function calcWorkdaysPerMonth(year) {
            return Array.from({ length: 12 }, (_, m) => {
                const days = new Date(year, m + 1, 0).getDate();
                let count = 0;
                for (let d = 1; d <= days; d++) {
                    const dow = new Date(year, m, d).getDay();
                    if (dow !== 5 && dow !== 6) count++;
                }
                return count;
            });
        }

        const API_BASE = '/api';
        const ganttId = new URLSearchParams(location.search).get('ganttId');
        function getAuth() {
            return window.wgAuth || (window.parent !== window && window.parent.wgAuth) || null;
        }
        function apiFetch(url, opts) {
            const auth = getAuth();
            if (auth) return auth.authFetch(url, opts);
            return new Promise((resolve, reject) => {
                const deadline = Date.now() + 3000;
                const t = setInterval(() => {
                    const a = getAuth();
                    if (a) { clearInterval(t); a.authFetch(url, opts).then(resolve).catch(reject); }
                    else if (Date.now() > deadline) { clearInterval(t); reject(new Error('wgAuth not ready')); }
                }, 20);
            });
        }

        const EMPTY_STATE = {
            meta: { title: 'תוכנית עבודה שנתית', year: new Date().getFullYear() },
            manpower: {
                workdays_base: calcWorkdaysPerMonth(new Date().getFullYear()),
                hours_per_day: 8.5,
                employees: [],
            },
            tasks: [],
            roles: DEFAULT_ROLES,
            taskTypes: DEFAULT_TASK_TYPES,
            sprints: [],
            settings: {
                dev_role: 'פיתוח',
                qa_role: 'בודק',
            },
        };

        // ========== HELPERS ==========
        const n = (x) => { const v = Number(x); return isNaN(v) ? 0 : v; };
        const fmt = (x) => {
            if (x === '?' || x === '' || x === null || x === undefined) return x;
            const v = Number(x);
            if (isNaN(v)) return x;
            return v % 1 === 0 ? v.toString() : v.toFixed(1);
        };
        const cls = (...c) => c.filter(Boolean).join(' ');

        // ========== CALCULATIONS ==========
        function personHours(emp, hoursPerDay) {
            return emp.workdays.map((wd, i) => {
                const days = n(wd) - n(emp.vacation[i]);
                const override = (emp.hours_override && n(emp.hours_override[i]) > 0) ? n(emp.hours_override[i]) : hoursPerDay;
                return Math.max(0, days * override);
            });
        }

        function roleHoursByMonth(employees, hoursPerDay, roles) {
            const result = {};
            roles.forEach(r => { result[r] = new Array(12).fill(0); });
            employees.forEach(e => {
                const hrs = personHours(e, hoursPerDay);
                if (!result[e.team]) result[e.team] = new Array(12).fill(0);
                for (let i = 0; i < 12; i++) result[e.team][i] += hrs[i];
            });
            return result;
        }

        function tasksMonthlyTotal(tasks) {
            const total = new Array(12).fill(0);
            tasks.forEach(t => { for (let i = 0; i < 12; i++) total[i] += n(t.months[i]); });
            return total;
        }

        // QA hours land in the last month that has dev hours (= when dev finishes).
        // If no dev hours distributed yet, QA hours are excluded — month is unknown.
        function tasksQaMonthlyTotal(tasks) {
            const total = new Array(12).fill(0);
            tasks.forEach(t => {
                const qp = n(t.qa_planned);
                if (!qp) return;
                // QA hours only placed when ALL dev hours are fully distributed
                const planned = n(t.planned);
                if (!planned) return;
                const distributed = taskRowSum(t);
                if (Math.round(distributed * 10) !== Math.round(planned * 10)) return; // dev not fully allocated
                let lastDevMonth = -1;
                for (let i = 11; i >= 0; i--) { if (n(t.months[i]) > 0) { lastDevMonth = i; break; } }
                if (lastDevMonth === -1) return;
                total[lastDevMonth] += qp;
            });
            return total;
        }

        function taskRowSum(task) { return task.months.reduce((a, b) => a + n(b), 0); }
        function taskQaRowSum(task) { return (task.qa_months || []).reduce((a, b) => a + n(b), 0); }

        // Returns { effective: number[12], spillover: { fromMonth, toMonth, hours }[] }
        // effective[m] = hours actually done in month m after spilling overload forward
        // spillover = list of spill events for warning display
        function computeQaSpillover(qaNeeded, qaAvail) {
            const effective = [...qaNeeded];
            const spillover = [];
            for (let m = 0; m < 12; m++) {
                const avail = qaAvail[m] || 0;
                if (effective[m] > avail + 0.001) {
                    const overflow = Math.round((effective[m] - avail) * 10) / 10;
                    effective[m] = avail;
                    if (m + 1 < 12) {
                        effective[m + 1] = Math.round((effective[m + 1] + overflow) * 10) / 10;
                        spillover.push({ fromMonth: m, toMonth: m + 1, hours: overflow });
                    } else {
                        spillover.push({ fromMonth: m, toMonth: null, hours: overflow }); // no room — year ends
                    }
                }
            }
            return { effective, spillover };
        }
        function qSum(arr, q) { return QUARTERS[q].months.reduce((s, m) => s + n(arr[m]), 0); }

        // primary role = first role that has employees assigned to tasks
        function getPrimaryRole(data) {
            const assignedTeams = new Set(data.manpower.employees.map(e => e.team));
            return data.roles.find(r => assignedTeams.has(r)) || data.roles[0] || 'פיתוח';
        }

        // ========== REDUCER ==========
        function reducer(state, action) {
            switch (action.type) {
                case 'LOAD_ALL': return action.payload;
                case 'SET_META_FIELD':
                    return { ...state, meta: { ...state.meta, [action.field]: action.value } };
                case 'SET_WORKDAY_BASE': {
                    const w = [...state.manpower.workdays_base]; w[action.idx] = action.value;
                    const emps = state.manpower.employees.map(e => { const nw = [...e.workdays]; nw[action.idx] = action.value; return { ...e, workdays: nw }; });
                    return { ...state, manpower: { ...state.manpower, workdays_base: w, employees: emps } };
                }
                case 'SET_EMP_VACATION': {
                    const emps = state.manpower.employees.map((e, i) => {
                        if (i !== action.empIdx) return e;
                        const v = [...e.vacation]; v[action.monthIdx] = action.value; return { ...e, vacation: v };
                    });
                    return { ...state, manpower: { ...state.manpower, employees: emps } };
                }
                case 'SET_EMP_HOURS_OVERRIDE': {
                    const emps = state.manpower.employees.map((e, i) => {
                        if (i !== action.empIdx) return e;
                        const o = [...(e.hours_override || new Array(12).fill(0))]; o[action.monthIdx] = action.value;
                        return { ...e, hours_override: o };
                    });
                    return { ...state, manpower: { ...state.manpower, employees: emps } };
                }
                case 'SET_EMP_FIELD': {
                    const emps = state.manpower.employees.map((e, i) => i === action.empIdx ? { ...e, [action.field]: action.value } : e);
                    return { ...state, manpower: { ...state.manpower, employees: emps } };
                }
                case 'ADD_EMPLOYEE': {
                    const base = state.manpower.workdays_base;
                    const newEmp = { name: 'עובד חדש', team: state.roles[0] || 'פיתוח', workdays: [...base], vacation: new Array(12).fill(0), hours_override: new Array(12).fill(0) };
                    return { ...state, manpower: { ...state.manpower, employees: [...state.manpower.employees, newEmp] } };
                }
                case 'DELETE_EMPLOYEE':
                    return { ...state, manpower: { ...state.manpower, employees: state.manpower.employees.filter((_, i) => i !== action.empIdx) } };
                case 'ADD_EMPLOYEE_FROM_TEAM': {
                    const { member, base } = action;
                    const exists = state.manpower.employees.some(e => e.name === member.name && e.team === member.role);
                    if (exists) return state;
                    const newEmp = { name: member.name, team: member.role || state.roles[0] || '', workdays: [...(base || state.manpower.workdays_base)], vacation: new Array(12).fill(0), hours_override: new Array(12).fill(0) };
                    return { ...state, manpower: { ...state.manpower, employees: [...state.manpower.employees, newEmp] } };
                }
                case 'SET_HOURS_PER_DAY':
                    return { ...state, manpower: { ...state.manpower, hours_per_day: action.value } };
                case 'IMPORT_JIRA_TASK': {
                    const newTask = { name: action.name || '', owner: '', type: state.defaultTaskType || 'פרויקט', planned: action.planned ?? 0, qa_planned: 0, months: new Array(12).fill(0), qa_months: new Array(12).fill(0), notes: '', priority: null, _uid: Math.random().toString(36).slice(2), _newlyAdded: false, task_number: action.key || '' };
                    const withP = state.tasks.filter(t => t.priority !== null && t.priority !== undefined && t.priority !== '');
                    const withoutP = state.tasks.filter(t => t.priority === null || t.priority === undefined || t.priority === '');
                    return { ...state, tasks: [...withP, newTask, ...withoutP] };
                }
                case 'REPLACE_TASK_BY_KEY': {
                    const tasks = state.tasks.map(t =>
                        t.task_number?.trim().toUpperCase() === action.key.trim().toUpperCase()
                            ? { ...t, name: action.name, task_number: action.key, ...(action.planned != null ? { planned: action.planned } : {}) }
                            : t
                    );
                    return { ...state, tasks };
                }
                case 'REPLACE_TASK_BY_NAME': {
                    const tasks = state.tasks.map(t =>
                        t.name?.trim().toLowerCase() === action.name.trim().toLowerCase()
                            ? { ...t, task_number: action.key || t.task_number, ...(action.planned != null ? { planned: action.planned } : {}) }
                            : t
                    );
                    return { ...state, tasks };
                }
                case 'SET_TASK_FIELD': {
                    const tasks = state.tasks.map((t, i) => i === action.idx ? { ...t, [action.field]: action.value, _newlyAdded: false } : t);
                    return { ...state, tasks };
                }
                case 'SET_TASK_MONTH': {
                    const tasks = state.tasks.map((t, i) => {
                        if (i !== action.idx) return t;
                        const months = [...t.months]; months[action.monthIdx] = action.value; return { ...t, months };
                    });
                    return { ...state, tasks };
                }
                case 'SET_TASK_QA_MONTH': {
                    const tasks = state.tasks.map((t, i) => {
                        if (i !== action.idx) return t;
                        const qa_months = [...(t.qa_months || new Array(12).fill(0))]; qa_months[action.monthIdx] = action.value; return { ...t, qa_months };
                    });
                    return { ...state, tasks };
                }
                case 'SET_DEFAULT_TASK':
                    return { ...state, defaultTaskType: action.taskType ?? state.defaultTaskType };
                case 'ADD_TASK': {
                    const newTask = { name: '', owner: '', type: state.defaultTaskType || 'פרויקט', planned: 0, qa_planned: 0, months: new Array(12).fill(0), qa_months: new Array(12).fill(0), notes: '', priority: null, _uid: Math.random().toString(36).slice(2), _newlyAdded: true };
                    const withP = state.tasks.filter(t => t.priority !== null && t.priority !== undefined && t.priority !== '');
                    const withoutP = state.tasks.filter(t => t.priority === null || t.priority === undefined || t.priority === '');
                    return { ...state, tasks: [...withP, newTask, ...withoutP] };
                }
                case 'SET_TASK_PRIORITY': {
                    const tasks = state.tasks.map((t, i) => i === action.idx ? { ...t, priority: action.value } : t);
                    const withP = tasks.filter(t => t.priority !== null && t.priority !== undefined && t.priority !== '').sort((a, b) => Number(a.priority) - Number(b.priority));
                    const withoutP = tasks.filter(t => t.priority === null || t.priority === undefined || t.priority === '');
                    return { ...state, tasks: [...withP, ...withoutP] };
                }
                case 'AUTO_DISTRIBUTE': {
                    return { ...state, tasks: action.tasks };
                }
                case 'DELETE_TASK':
                    return { ...state, tasks: state.tasks.filter((_, i) => i !== action.idx) };
                case 'DELETE_TASKS_BULK':
                    return { ...state, tasks: state.tasks.filter((_, i) => !action.indices.includes(i)) };
                case 'REORDER_TASKS': {
                    const { fromIdx, toIdx } = action;
                    const tasks = [...state.tasks];
                    const [moved] = tasks.splice(fromIdx, 1);
                    tasks.splice(toIdx, 0, moved);
                    return { ...state, tasks };
                }
                case 'SET_SPRINT_FIELD': {
                    const sprints = state.sprints.map((s, i) => i === action.idx ? { ...s, [action.field]: action.value } : s);
                    return { ...state, sprints };
                }
                case 'SET_SPRINT_ITEM': {
                    const sprints = state.sprints.map((s, i) => {
                        if (i !== action.sIdx) return s;
                        const items = s.items.map((it, j) => j === action.iIdx ? { ...it, [action.field]: action.value } : it);
                        return { ...s, items };
                    });
                    return { ...state, sprints };
                }
                case 'ADD_SPRINT':
                    return { ...state, sprints: [...state.sprints, { name: 'ספרינט חדש', dates: '', items: [] }] };
                case 'DELETE_SPRINT':
                    return { ...state, sprints: state.sprints.filter((_, i) => i !== action.idx) };
                case 'ADD_SPRINT_ITEM': {
                    const sprints = state.sprints.map((s, i) => i === action.sIdx ? { ...s, items: [...s.items, { task: '', type: 'שוטף', plan: 0, done: 0 }] } : s);
                    return { ...state, sprints };

                case 'DELETE_SPRINT_ITEM': {

                    return { ...state, sprints };
                }
                case 'ADD_ROLE': {
                    const name = (action.name || '').trim();
                    if (!name || state.roles.includes(name)) return state;
                    return { ...state, roles: [...state.roles, name] };
                }
                case 'DELETE_ROLE': {
                    return { ...state, roles: state.roles.filter(r => r !== action.name) };
                }
                case 'ADD_TASK_TYPE': {
                    const name = (action.name || '').trim();
                    if (!name || (state.taskTypes || []).includes(name)) return state;
                    return { ...state, taskTypes: [...(state.taskTypes || DEFAULT_TASK_TYPES), name] };

                case 'DELETE_TASK_TYPE':
                    return { ...state, taskTypes: (state.taskTypes || DEFAULT_TASK_TYPES).filter(t => t !== action.name) };
                case 'SET_SETTING':
                    return { ...state, settings: { ...(state.settings || {}), [action.key]: action.value } };

            const ref = useRef(null);

                const portal = getOrCreateTtPortal();
                if (!ref.current) return;
                const r = ref.current.getBoundingClientRect();
                portal.textContent = text;
                portal.classList.add('visible');
                requestAnimationFrame(() => {
                    const pw = portal.offsetWidth || 240;
                    const ph = portal.offsetHeight || 40;
                    let left = r.left + r.width / 2 - pw / 2;
                    let top  = r.top - ph - 10;
                    // clamp within viewport
                    const margin = 8;
                    left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
                    top  = top < margin ? r.bottom + 10 : top;
                    portal.style.left = left + 'px';
                    portal.style.top  = top + 'px';
                });
            }
            function hide() {
                const portal = document.getElementById('tt-portal');
                if (portal) portal.classList.remove('visible');
            }
            return <span ref={ref} className="tt" tabIndex={0} onMouseEnter={show} onMouseLeave={hide} onFocus={show} onBlur={hide}>{children}</span>;

            const [local, setLocal] = useState(value ?? '');

            const [invalid, setInvalid] = useState(false);
            const inputRef = useRef(null);
            useEffect(() => { setLocal(value ?? ''); }, [value]);
            function commit(v) {
                if (required && !v.trim()) {
                    setInvalid(true);
                    setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 0);
                    return;

                setInvalid(false);

            useEffect(() => {

                        if (inputRef.current) {

                        } else if (attempts > 0) {
                            setTimeout(() => tryFocus(attempts - 1), 50);

                    return () => clearTimeout(t);

        function ResizableTh({ colKey, widths, setWidth, className='', style={}, children }) {
            const thRef = React.useRef(null);
            const dragging = React.useRef(false);
            const startX = React.useRef(0);
            const startW = React.useRef(0);
            const [isDragging, setIsDragging] = React.useState(false);
            function onMouseDown(e) {
                e.preventDefault();
                dragging.current = true;
                startX.current = e.clientX;
                startW.current = widths[colKey];
                setIsDragging(true);
                function onMove(ev) {
                    if (!dragging.current) return;
                    const delta = startX.current - ev.clientX;
                    setWidth(colKey, startW.current + delta);
                }
                function onUp() {
                    dragging.current = false;
                    setIsDragging(false);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                }
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            }
            return (
                <th ref={thRef} className={className} style={{ ...style, width: widths[colKey], minWidth: widths[colKey], maxWidth: widths[colKey], position: style.position || 'relative', overflow: 'hidden' }}>

            const taskMonthly = useMemo(() => tasksMonthlyTotal(data.tasks), [data.tasks]);

            const { effective: qaNeeded, spillover: qaSpillover } = useMemo(() => computeQaSpillover(qaNeededRaw, qaAvail), [qaNeededRaw, qaAvail]);
            const diff = primaryAvailable.map((a, i) => a - taskMonthly[i]);
            const qaDiff = qaAvail.map((a, i) => a - qaNeeded[i]);

            const totalAssigned = taskMonthly.reduce((a, b) => a + b, 0);
            const totalPrimaryAvail = primaryAvailable.reduce((a, b) => a + b, 0);
            const utilizationPct = totalPrimaryAvail ? (totalAssigned / totalPrimaryAvail * 100) : 0;
            const overload = diff.filter(d => d < 0).length;
            const missingEstimates = data.tasks.filter(t => t.planned === '?' || t.planned === '').length;
            const mismatched = data.tasks.filter(t => t.planned !== '?' && t.planned !== '' && n(taskRowSum(t)) !== n(t.planned)).length;

            const totalQaAvail = qaAvail.reduce((a, b) => a + b, 0);
            const totalQaNeeded = qaNeededRaw.reduce((a, b) => a + b, 0);
            const qaUtilizationPct = totalQaAvail ? (totalQaNeeded / totalQaAvail * 100) : 0;
            const qaGap = totalQaAvail - totalQaNeeded;
            const qaOverload = qaSpillover.length; // months where QA spilled over

            const capacityChartRef = useChart(() => ({
                type: 'bar',
                data: { labels: MONTHS, datasets: [
                    { label: `שעות ${primaryRole} זמינות`, data: primaryAvailable, backgroundColor: 'rgba(14,165,233,.7)', borderRadius: 6 },

            }), [data]);

            const diffChartRef = useChart(() => ({
                type: 'line',
                data: { labels: MONTHS, datasets: [{ label: 'הפרש שעות (זמין - משובץ)', data: diff, tension: .3, fill: true, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,.15)', pointBackgroundColor: diff.map(d => d < 0 ? '#ef4444' : '#10b981'), pointRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', rtl: true, labels: { font: { family: 'Heebo' } } } }, scales: { x: { ticks: { font: { family: 'Heebo' } } }, y: { ticks: { font: { family: 'Heebo' } } } } }
            }), [data]);

            const qaChartRef = useChart(() => ({
                type: 'bar',
                data: { labels: MONTHS, datasets: [
                    { label: `שעות ${settings.qa_role} זמינות`, data: qaAvail, backgroundColor: 'rgba(139,92,246,.7)', borderRadius: 6 },
                    { label: 'שעות בדיקות נדרשות', data: qaNeeded, backgroundColor: 'rgba(236,72,153,.7)', borderRadius: 6 },
                ]},
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', rtl: true, labels: { font: { family: 'Heebo' } } } }, scales: { x: { ticks: { font: { family: 'Heebo' } } }, y: { ticks: { font: { family: 'Heebo' } } } } }
            }), [data]);

            const typeAggregate = useMemo(() => { const agg = {}; data.tasks.forEach(t => { const key = t.type || 'לא מוגדר'; agg[key] = (agg[key] || 0) + taskRowSum(t); }); return agg; }, [data.tasks]);
            const typeChartRef = useChart(() => ({
                type: 'doughnut',
                data: { labels: Object.keys(typeAggregate), datasets: [{ data: Object.values(typeAggregate), backgroundColor: Object.keys(typeAggregate).map(k => TASK_TYPE_COLORS[k] || '#94a3b8'), borderWidth: 2, borderColor: '#fff' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', rtl: true, labels: { font: { family: 'Heebo' } } } } }
            }), [data]);

            const roleChartRef = useChart(() => {
                const totals = Object.keys(roleHours).map(r => ({ r, total: roleHours[r].reduce((a, b) => a + b, 0) })).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
                return { type: 'bar', data: { labels: totals.map(t => t.r), datasets: [{ label: 'שעות זמינות שנתיות', data: totals.map(t => t.total), backgroundColor: '#8b5cf6', borderRadius: 6 }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { family: 'Heebo' } } }, y: { ticks: { font: { family: 'Heebo' } } } } } };
            }, [data]);

            const [exportModalOpen, setExportModalOpen] = useState(false);

            const CSS_EXPORT = `
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#f1f5f9; color:#0f172a; direction:rtl; padding:32px; }
  .page { max-width:1000px; margin:0 auto; }
  .header { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border-radius:20px; padding:28px 36px; margin-bottom:28px; }
  .header h1 { font-size:26px; font-weight:800; margin-bottom:6px; }
  .header p { font-size:14px; opacity:.85; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  .kpi { background:#fff; border-radius:14px; padding:18px 20px; box-shadow:0 1px 6px rgba(0,0,0,.07); }
  .kpi .lbl { font-size:11px; color:#64748b; font-weight:600; margin-bottom:6px; }
  .kpi .val { font-size:30px; font-weight:800; line-height:1; }
  .kpi .gap { font-size:18px; font-weight:800; margin-top:4px; }
  .kpi .sub { font-size:12px; color:#94a3b8; margin-top:5px; }
  .section { background:#fff; border-radius:16px; padding:24px 28px; margin-bottom:20px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
  .section h2 { font-size:16px; font-weight:700; color:#1e293b; margin-bottom:16px; padding-bottom:10px; border-bottom:1.5px solid #f1f5f9; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:#f8fafc; color:#64748b; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:10px 12px; text-align:right; border-bottom:1.5px solid #e2e8f0; }
  td { padding:10px 12px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#f8fafc; }
  .footer { text-align:center; color:#94a3b8; font-size:12px; margin-top:32px; }
  @media print { body { background:#fff; padding:0; } .page { max-width:100%; } }`;

            function buildPeriodHTML(monthsList, periodLabel) {
                const devAvailP = monthsList.reduce((s,m) => s + (primaryAvailable[m]||0), 0);
                const qaAvailP  = monthsList.reduce((s,m) => s + (qaAvail[m]||0), 0);
                const devAssP   = monthsList.reduce((s,m) => s + (taskMonthly[m]||0), 0);
                const qaNeedP   = monthsList.reduce((s,m) => s + (qaNeeded[m]||0), 0);
                const devDiff   = devAvailP - devAssP;
                const qaDiffP   = qaAvailP - qaNeedP;

                const periodTasks = data.tasks.filter(t => monthsList.some(m => n(t.months[m]) > 0));
                const taskRows = periodTasks.map(t => {
                    const devH = fmt(monthsList.reduce((s,m) => s+n(t.months[m]),0));
                    const lastDevM = (() => { let l=-1; for(let i=11;i>=0;i--) { if(n(t.months[i])>0){l=i;break;} } return l; })();
                    const qaH = monthsList.includes(lastDevM) ? fmt(n(t.qa_planned)) : '—';
                    return `<tr><td>${t.name||'—'}</td><td>${t.owner||'—'}</td><td>${t.type||'—'}</td><td style="text-align:center">${devH}</td><td style="text-align:center">${qaH}</td><td>${t.notes||''}</td></tr>`;
                }).join('');
                const empRows = data.manpower.employees.map(e => {
                    const avail = monthsList.reduce((s,m) => s+((roleHours[e.team]||[])[m]||0), 0);
                    return `<tr><td>${e.name}</td><td>${e.team}</td><td style="text-align:center">${fmt(avail)}</td></tr>`;
                }).join('');

                return `<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"/>
<title>סיכום ${periodLabel} – ${data.meta?.title||''}</title>
<style>${CSS_EXPORT}</style></head>
<body><div class="page">
  <div class="header">
    <h1>📅 ${periodLabel} – ${data.meta?.title||'גאנט שנתי'}</h1>
    <p>הופק: ${new Date().toLocaleDateString('he-IL')}</p>
  </div>
  <div class="kpi-grid">
    <div class="kpi"><div class="lbl">שעות פיתוח זמינות</div><div class="val" style="color:#7c3aed">${fmt(devAvailP)}</div><div class="gap" style="color:${devDiff>=0?'#059669':'#dc2626'}">${devDiff>=0?'עודף':'חסר'} ${fmt(Math.abs(devDiff))} ש׳</div></div>
    <div class="kpi"><div class="lbl">שעות פיתוח משובצות</div><div class="val" style="color:#1d4ed8">${fmt(devAssP)}</div><div class="sub">${devAvailP>0?(devAssP/devAvailP*100).toFixed(0)+'% ניצול':''}</div></div>
    <div class="kpi"><div class="lbl">שעות בדיקות זמינות</div><div class="val" style="color:#7c3aed">${fmt(qaAvailP)}</div><div class="gap" style="color:${qaDiffP>=0?'#059669':'#dc2626'}">${qaDiffP>=0?'עודף':'חסר'} ${fmt(Math.abs(qaDiffP))} ש׳</div></div>
    <div class="kpi"><div class="lbl">שעות בדיקות נדרשות</div><div class="val" style="color:#9333ea">${fmt(qaNeedP)}</div><div class="sub">${qaAvailP>0?(qaNeedP/qaAvailP*100).toFixed(0)+'% ניצול':''}</div></div>
  </div>
  <div class="section">
    <h2>✅ משימות – ${periodLabel}</h2>
    ${periodTasks.length===0 ? '<p style="color:#94a3b8;font-size:13px">אין משימות עם שעות בתקופה זו</p>' : `<table><thead><tr><th>שם משימה</th><th>אחראי</th><th>סוג</th><th style="text-align:center">שעות פיתוח</th><th style="text-align:center">שעות בדיקות</th><th>הערות</th></tr></thead><tbody>${taskRows}</tbody></table>`}
  </div>
  <div class="section">
    <h2>👥 כוח אדם – ${periodLabel}</h2>
    <table><thead><tr><th>שם</th><th>תפקיד</th><th style="text-align:center">שעות זמינות</th></tr></thead><tbody>${empRows}</tbody></table>
  </div>
  <div class="footer">Planner • הופק ב-${new Date().toLocaleString('he-IL')}</div>
</div></body></html>`;
            }

            function doExport(monthsList, periodLabel, filename) {
                const html = buildPeriodHTML(monthsList, periodLabel);
                const blob = new Blob([html], { type:'text/html;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                URL.revokeObjectURL(a.href);
                setExportModalOpen(false);
            }

            return (
                <div className="p-6 space-y-6">

                    {/* ── modal סיכום חודש / רבעוני ── */}
                    {exportModalOpen && ReactDOM.createPortal(
                        <div style={{ position:'fixed', inset:0, background:'rgba(15,23,42,0.45)', zIndex:10000, display:'flex', alignItems:'center', justifyContent:'center' }}
                            onClick={e => { if (e.target===e.currentTarget) setExportModalOpen(false); }}>
                            <div style={{ background:'#fff', borderRadius:20, padding:28, width:460, maxWidth:'calc(100vw - 32px)', boxShadow:'0 24px 64px rgba(0,0,0,.22)', direction:'rtl' }}>
                                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
                                    <h3 style={{ margin:0, fontSize:17, fontWeight:800, color:'#0f172a' }}>סיכום חודש / רבעוני</h3>
                                    <button onClick={() => setExportModalOpen(false)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:20, color:'#94a3b8' }}>✕</button>
                                </div>

                                {/* רבעונים */}
                                <div style={{ fontSize:11, fontWeight:700, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:8 }}>רבעון</div>
                                <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:8, marginBottom:20 }}>
                                    {QUARTERS.map((q, qi) => {
                                        const hasData = q.months.some(m => data.tasks.some(t => n(t.months[m]) > 0));
                                        const label = `${MONTHS[q.months[0]].slice(0,3)}–${MONTHS[q.months[2]].slice(0,3)}`;
                                        return (
                                            <button key={qi} onClick={() => doExport(q.months, `${q.name} (${label})`, `${data.meta?.title||'שנתי'} – ${q.name} – סיכום.html`)}
                                                style={{ padding:'12px 8px', borderRadius:12, border:'1.5px solid #e2e8f0', background: hasData ? '#eff6ff' : '#f8fafc', color: hasData ? '#1d4ed8' : '#94a3b8', fontWeight: hasData ? 700 : 500, fontSize:13, fontFamily:'inherit', cursor:'pointer', position:'relative', textAlign:'center' }}>
                                                <div style={{ fontWeight:800, fontSize:14 }}>{q.name}</div>
                                                <div style={{ fontSize:11, opacity:.7, marginTop:2 }}>{label}</div>
                                                {hasData && <span style={{ position:'absolute', top:5, left:6, width:6, height:6, borderRadius:'50%', background:'#3b82f6' }}></span>}
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* חודשים */}
                                <div style={{ fontSize:11, fontWeight:700, color:'#94a3b8', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:8 }}>חודש</div>
                                <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:8 }}>
                                    {MONTHS.map((name, i) => {
                                        const hasData = data.tasks.some(t => n(t.months[i]) > 0);
                                        return (
                                            <button key={i} onClick={() => doExport([i], name, `${data.meta?.title||'שנתי'} – ${name} – סיכום.html`)}
                                                style={{ padding:'11px 8px', borderRadius:12, border:'1.5px solid #e2e8f0', background: hasData ? '#f5f3ff' : '#f8fafc', color: hasData ? '#4f46e5' : '#94a3b8', fontWeight: hasData ? 700 : 500, fontSize:13, fontFamily:'inherit', cursor:'pointer', position:'relative' }}>
                                                {name}
                                                {hasData && <span style={{ position:'absolute', top:5, left:6, width:6, height:6, borderRadius:'50%', background:'#6366f1' }}></span>}
                                            </button>
                                        );
                                    })}
                                </div>
                                <p style={{ fontSize:12, color:'#94a3b8', marginTop:12, textAlign:'center' }}>תקופות עם נתונים מסומנות בנקודה</p>
                            </div>
                        </div>,
                        document.body
                    )}

                    <div style={{ display:'flex', justifyContent:'flex-start' }}>
                        <button onClick={() => setExportModalOpen(true)} style={{ display:'inline-flex', alignItems:'center', gap:8, padding:'9px 20px', background:'linear-gradient(135deg,#6366f1,#8b5cf6)', color:'#fff', border:'none', borderRadius:12, fontWeight:700, fontSize:14, fontFamily:'inherit', cursor:'pointer', boxShadow:'0 2px 12px rgba(99,102,241,0.3)' }}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            סיכום חודש / רבעוני
                        </button>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-3 gap-4">
                        <StatCard label="סה״כ משימות" value={data.tasks.length} color="blue" hint="מספר השורות הפעילות בתוכנית העבודה." />
                        <StatCard label={`שעות ${primaryRole} זמינות`} value={fmt(totalPrimaryAvail)} color="green" hint={`סכום שעות זמינות שנתי של התפקיד הראשי (${primaryRole}).`} sub={`ניצול: ${utilizationPct.toFixed(1)}%`} />
                        <StatCard label="חודשים בעומס יתר (פיתוח)" value={overload} color={overload ? 'red' : 'slate'} hint="חודשים שבהם שיבוץ הפיתוח עולה על היכולת." sub={overload ? 'דורש תשומת לב' : 'הכל מאוזן'} />
                    </div>
                    <div className="grid grid-cols-2 lg:grid-cols-3 gap-4">
                        <StatCard label={`שעות ${settings.qa_role} זמינות`} value={fmt(totalQaAvail)} color="violet" hint={`סכום שעות זמינות שנתי של תפקיד הבדיקות (${settings.qa_role}).`} sub={`ניצול: ${qaUtilizationPct.toFixed(1)}%`} />
                        <StatCard label="שעות בדיקות נדרשות" value={fmt(totalQaNeeded)} color={qaGap >= 0 ? 'slate' : 'red'} hint="סכום שעות הבדיקה שנדרשות לפי תכנון המשימות." sub={qaGap >= 0 ? `עודף ${fmt(qaGap)} ש׳` : `חסר ${fmt(Math.abs(qaGap))} ש׳`} />
                        <StatCard label="חודשים בעומס יתר (QA)" value={qaOverload} color={qaOverload ? 'red' : 'slate'} hint="חודשים שבהם שעות הבדיקות הנדרשות עולות על הזמינות." sub={qaOverload ? 'דורש תשומת לב' : 'הכל מאוזן'} />
                    </div>
                    {(missingEstimates > 0 || mismatched > 0) && (
                        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start gap-3">
                            <Icon name="warn" className="w-5 h-5 text-amber-600 shrink-0 mt-0.5" />

                                <div className="font-semibold">התראות תקינות נתונים</div>

                                    {mismatched > 0 && <li>{mismatched} משימות שסכום החודשים שונה מהתכנון</li>}
                                </ul>
                            </div>
                        </div>

                    {data.tasks.length === 0 && (
                        <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-12 text-center text-slate-400">
                            <Icon name="list" className="w-10 h-10 mx-auto mb-3 opacity-40" />
                            <div className="font-semibold text-lg">אין משימות עדיין</div>
                            <div className="text-sm mt-1">עבור ל"תוכנית עבודה" והוסף משימות</div>
                        </div>
                    )}
                    {data.tasks.length > 0 && (
                        <>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <ChartBox title="יכולת מול שיבוץ - פיתוח" hint="השוואה בין שעות פיתוח זמינות לשעות משובצות.">
                                    <div className="h-72"><canvas ref={capacityChartRef}></canvas></div>
                                </ChartBox>
                                <ChartBox title="יכולת מול שיבוץ - QA" hint="השוואה בין שעות בודקים זמינות לשעות בדיקות נדרשות.">
                                    <div className="h-72"><canvas ref={qaChartRef}></canvas></div>
                                </ChartBox>
                                <ChartBox title="הפרש שעות פיתוח (עודף/חסר)" hint="חיובי = עודף. שלילי (אדום) = חסר.">
                                    <div className="h-72"><canvas ref={diffChartRef}></canvas></div>
                                </ChartBox>
                                <ChartBox title="התפלגות משימות לפי סוג">
                                    <div className="h-72"><canvas ref={typeChartRef}></canvas></div>
                                </ChartBox>
                                <ChartBox title="שעות זמינות לפי תפקיד (שנתי)">
                                    <div className="h-72"><canvas ref={roleChartRef}></canvas></div>
                                </ChartBox>
                            </div>
                            <ChartBox title="סיכום רבעוני">
                                <div className="grid grid-cols-4 gap-4">
                                    {QUARTERS.map((q, qi) => {
                                        const avail = qSum(primaryAvailable, qi);
                                        const assign = qSum(taskMonthly, qi);
                                        const d = avail - assign;
                                        const qaA = qSum(qaAvail, qi);
                                        const qaN = qSum(qaNeeded, qi);
                                        const qaD = qaA - qaN;
                                        return (
                                            <div key={q.name} className="rounded-xl p-4 border border-slate-200" style={{ background: `${q.color}10` }}>
                                                <div className="flex items-center justify-between mb-3">
                                                    <span className="font-bold text-lg" style={{ color: q.color }}>{q.name}</span>
                                                    <span className="text-xs text-slate-500">{MONTHS[q.months[0]].slice(0,3)}-{MONTHS[q.months[2]].slice(0,3)}</span>
                                                </div>
                                                <div className="text-xs font-semibold text-slate-400 uppercase mb-1">פיתוח</div>
                                                <div className="space-y-1 text-sm mb-3">
                                                    <div className="flex justify-between"><span>זמין:</span><span className="font-semibold">{fmt(avail)}</span></div>
                                                    <div className="flex justify-between"><span>משובץ:</span><span className="font-semibold">{fmt(assign)}</span></div>
                                                    <div className={cls('flex justify-between pt-1 border-t border-slate-200', d < 0 ? 'text-red-700' : 'text-emerald-700')}>
                                                        <span>הפרש:</span><span className="font-bold">{d > 0 ? '+' : ''}{fmt(d)}</span>
                                                    </div>
                                                </div>
                                                <div className="text-xs font-semibold text-purple-400 uppercase mb-1">🧪 QA</div>
                                                <div className="space-y-1 text-sm">

        // ========== AUTO DISTRIBUTE ==========
        async function handleAutoDistribute(data, dispatch, devAvail) {
            const priorityTasks = data.tasks
                .map((t, i) => ({ ...t, _origIdx: i }))
                .filter(t => t.priority !== null && t.priority !== undefined && t.priority !== '')
                .sort((a, b) => Number(a.priority) - Number(b.priority));

            if (priorityTasks.length === 0) {
                Swal.fire({ icon: 'info', title: 'אין משימות עם תיעדוף', text: 'יש להגדיר תיעדוף למשימות לפני ביצוע חלוקה אוטומטית', confirmButtonText: 'אישור' });
                return;
            }

            // Track remaining capacity per month (start from devAvail minus non-priority tasks)
            const remaining = devAvail.map((avail, m) => {
                const nonPriorityUsed = data.tasks
                    .filter(t => t.priority === null || t.priority === undefined || t.priority === '')
                    .reduce((sum, t) => sum + (Number(t.months[m]) || 0), 0);
                return Math.max(0, avail - nonPriorityUsed);
            });

            // Build new months per task (keyed by _origIdx)
            const newMonths = {}; // _origIdx -> months array

            // Check which tasks already have data and ask user
            for (const t of priorityTasks) {
                const hasData = t.months.some(v => Number(v) > 0);
                if (hasData) {
                    const result = await Swal.fire({
                        icon: 'question',
                        title: 'קיימת חלוקה קיימת',
                        html: `למשימה <strong>"${t.name}"</strong> (תיעדוף ${t.priority}) כבר קיימים נתוני חלוקה.<br>האם לדרוס אותם?`,
                        showCancelButton: true,
                        confirmButtonText: 'כן, דרוס',
                        cancelButtonText: 'לא, דלג'
                    });
                    if (!result.isConfirmed) {
                        // Keep existing — deduct from remaining
                        t.months.forEach((v, m) => { remaining[m] = Math.max(0, remaining[m] - (Number(v) || 0)); });
                        newMonths[t._origIdx] = null; // null = skip
                        continue;
                    }
                }
                // Distribute this task greedily month by month
                const planned = Number(t.planned) || 0;
                let budget = planned;
                const months = new Array(12).fill(0);
                for (let m = 0; m < 12 && budget > 0; m++) {
                    const fill = Math.min(budget, remaining[m]);
                    months[m] = fill;
                    remaining[m] -= fill;
                    budget -= fill;
                }
                newMonths[t._origIdx] = months;
            }

            const updatedTasks = data.tasks.map((t, i) => {
                if (i in newMonths && newMonths[i] !== null) {
                    return { ...t, months: newMonths[i] };
                }
                return t;
            });

            dispatch({ type: 'AUTO_DISTRIBUTE', tasks: updatedTasks });
        }

        // ========== JIRA IMPORT MODAL ==========
        function parseJiraEstimate(raw) {
            if (!raw) return null;
            // Jira exports seconds as number, or strings like "2h", "1d 4h 30m", "90m"
            if (typeof raw === 'number' || /^\d+$/.test(String(raw).trim())) {
                const secs = Number(raw);
                return secs > 0 ? Math.round(secs / 3600 * 10) / 10 : null;
            }
            const s = String(raw).toLowerCase();
            let hours = 0;
            const d = s.match(/(\d+(?:\.\d+)?)\s*d/); if (d) hours += parseFloat(d[1]) * 8;
            const h = s.match(/(\d+(?:\.\d+)?)\s*h/); if (h) hours += parseFloat(h[1]);
            const m = s.match(/(\d+(?:\.\d+)?)\s*m/); if (m) hours += parseFloat(m[1]) / 60;
            return hours > 0 ? Math.round(hours * 10) / 10 : null;
        }

                return m;
            }, [existingTasks]);

            const existingByName = useMemo(() => {
                const m = {};
                (existingTasks || []).forEach(t => { if (t.name) m[t.name.trim().toLowerCase()] = t; });
                return m;
            }, [existingTasks]);

            function hasConflict(t) {
                if (t.key && existingByKey[t.key.toUpperCase()]) return true;
                if (t.name && existingByName[t.name.trim().toLowerCase()]) return true;
                return false;
            }

            function handleFile(file) {
                setError(''); setJiraTasks([]); setSelected({});
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
                        if (rows.length < 2) { setError('הקובץ ריק'); return; }
                        const header = rows[0].map(h => String(h).trim());
                        const keyIdx = header.findIndex(h => h.toLowerCase() === 'issue key');
                        const sumIdx = header.findIndex(h => h.toLowerCase() === 'summary');
                        const estIdx = header.findIndex(h => h.toLowerCase() === 'original estimate');
                        if (keyIdx === -1 || sumIdx === -1) { setError('לא נמצאו עמודות Issue key / Summary'); return; }
                        const parsed = rows.slice(1)
                            .filter(r => r[sumIdx])
                            .map((r, i) => {
                                const rawEst = estIdx !== -1 ? r[estIdx] : '';
                                const estHours = rawEst ? parseJiraEstimate(String(rawEst)) : null;
                                return { id: i, key: String(r[keyIdx]||'').trim(), name: String(r[sumIdx]||'').trim(), planned: estHours };
                            })
                            .filter(t => t.name);
                        if (parsed.length === 0) { setError('לא נמצאו משימות בקובץ'); return; }
                        const autoSel = {};
                        parsed.forEach(t => {
                            if (!hasConflict(t)) autoSel[t.id] = { action: 'add', item: t };
                        });
                        setJiraTasks(parsed);
                        setSelected(autoSel);
                    } catch { setError('שגיאה בקריאת הקובץ'); }

                reader.readAsArrayBuffer(file);
