                    ),
                    qa_diff: (
                        <tr key="qa_diff" className="font-bold border-t border-slate-200" onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();reorderSummary('qa_diff')}}>
                            <td className="p-2 text-right sticky-col bg-white" colSpan={9}><SummaryDragHandle rowKey="qa_diff" /> עודף / גירעון שעות בדיקות</td>
                            {QUARTERS.map(q=>q.months.map((m,mi)=>{
                                const spillOut = qaSpillover.filter(s => s.fromMonth === m).reduce((a,s)=>a+s.hours,0);
                                const spillIn  = qaSpillover.filter(s => s.toMonth   === m).reduce((a,s)=>a+s.hours,0);
                                const displayed = Math.round((qaNeeded[m] + spillIn) * 10) / 10;
                                const d = Math.round((qaAvail[m] - displayed) * 10) / 10;
                                const isSpill = spillOut > 0;
                                return (
                                    <td key={m} className={cls('p-2 text-center',mi===0&&'q-divider',mi===2&&'q-divider-end')}
                                        style={{ color: isSpill ? '#b91c1c' : d < 0 ? '#b91c1c' : '#059669', background: isSpill ? '#fee2e2' : d < 0 ? '#fef2f2' : undefined }}>
                                        {isSpill
                                            ? <span className="inline-flex items-center gap-1">{fmt(-spillOut)}<span className="text-base leading-none">←</span></span>
                                            : <>{d > 0 ? '+' : ''}{fmt(d)}</>
                                        }
                                    </td>
                                );
                            }))}
                            <td className={cls('p-2 text-center bg-sky-100 q-divider-end',qaDiff.reduce((a,b)=>a+b,0)<0?'text-red-700':'text-emerald-700')}>{fmt(qaDiff.reduce((a,b)=>a+b,0))}</td><td colSpan={3}></td>
                        </tr>
                    ),
                };
                return summaryOrder.map(k => rows[k]).filter(Boolean);
            }

            function reorderSummary(targetKey) {
                const src = summaryDragSrc.current;
                if (!src || src === targetKey) return;
                const order = [...summaryOrder];
                const si = order.indexOf(src), ti = order.indexOf(targetKey);
                if (si < 0 || ti < 0) return;
                order.splice(si, 1);
                order.splice(ti, 0, src);
                setSummaryOrder(order);
                localStorage.setItem('wg_summary_order', JSON.stringify(order));
                summaryDragSrc.current = null;
            }

            const [showJiraModal, setShowJiraModal] = useState(false);
            const [filter, setFilter] = useState('');
            const [colW, setColW] = useColWidths(ANNUAL_COL_DEFAULTS, LS_KEY_ANNUAL);
            const [typeFilter, setTypeFilter] = useState('');
            const [selectedUids, setSelectedUids] = useState(new Set());

            function toggleSelectUid(uid) {
                setSelectedUids(prev => {
                    const next = new Set(prev);
                    next.has(uid) ? next.delete(uid) : next.add(uid);
                    return next;
                });
            }
            async function deleteSelected() {
                const r = await Swal.fire({ title: `למחוק ${selectedUids.size} משימות?`, icon: 'warning', showCancelButton: true, confirmButtonText: 'מחק', cancelButtonText: 'ביטול', reverseButtons: true });
                if (!r.isConfirmed) return;
                const indices = data.tasks.map((t, i) => selectedUids.has(t._uid) ? i : -1).filter(i => i !== -1);
                dispatch({ type: 'DELETE_TASKS_BULK', indices });
                setSelectedUids(new Set());
            }

            function handleImportJiraTasks(items) {
                items.forEach(entry => {
                    const { action, item } = entry;
                    if (action === 'replace') {
                        if (item.key) {
                            dispatch({ type: 'REPLACE_TASK_BY_KEY', key: item.key, name: item.name, planned: item.planned });
                        } else {
                            dispatch({ type: 'REPLACE_TASK_BY_NAME', name: item.name, planned: item.planned, key: item.key });
                        }
                    } else {
                        dispatch({ type: 'IMPORT_JIRA_TASK', name: item.name, key: item.key, planned: item.planned });
                    }
                });
                setShowJiraModal(false);
            }
            const filtered = data.tasks.map((t, idx) => ({ ...t, idx })).filter(t => {
                if (filter && !t.name.toLowerCase().includes(filter.toLowerCase())) return false;
                if (typeFilter && t.type !== typeFilter) return false;
                return true;
            });
            const taskDragSrc = useRef(null);
            const [taskDragOver, setTaskDragOver] = useState(null);
            function isTaskDraggable(t) { return t.priority === null || t.priority === undefined || t.priority === ''; }
            function onTaskDragStart(e, realIdx) { taskDragSrc.current = realIdx; e.dataTransfer.effectAllowed = 'move'; }
            function onTaskDragOver(e, realIdx) { e.preventDefault(); setTaskDragOver(realIdx); }
            function onTaskDrop(e, realIdx) {
                e.preventDefault();
                const src = taskDragSrc.current;
                if (src === null || src === realIdx) { taskDragSrc.current = null; setTaskDragOver(null); return; }
                const target = data.tasks[realIdx];
                if (target && !isTaskDraggable(target)) { taskDragSrc.current = null; setTaskDragOver(null); return; }
                dispatch({ type: 'REORDER_TASKS', fromIdx: src, toIdx: realIdx });
                taskDragSrc.current = null;
                setTaskDragOver(null);
            }
            function onTaskDragEnd() { taskDragSrc.current = null; setTaskDragOver(null); }
            const totals = tasksMonthlyTotal(filtered);
            const qaNeeded = tasksQaMonthlyTotal(filtered);
            const { effective: qaEffective, spillover: qaSpillover } = computeQaSpillover(qaNeeded, qaAvail);
            const totalNeeded = totals.map((t, i) => Math.round((t + qaEffective[i]) * 10) / 10);
            const diff = devAvail.map((a, i) => a - totals[i]);
            const qaDiff = qaAvail.map((a, i) => a - qaEffective[i]);
            // set of task _uid → month index where its QA is counted (for badge on task row)
            const taskQaMonth = new Map();
            filtered.forEach(t => {
                const qp = n(t.qa_planned);
                if (!qp) return;
                const planned = n(t.planned);
                if (!planned) return;
                if (Math.round(taskRowSum(t) * 10) !== Math.round(planned * 10)) return; // dev not fully allocated
                let last = -1;
                for (let i = 11; i >= 0; i--) { if (n(t.months[i]) > 0) { last = i; break; } }
                if (last !== -1) taskQaMonth.set(t._uid, last);
            });
            // Warnings always based on ALL tasks regardless of active filter
            const allTotals = tasksMonthlyTotal(data.tasks);
            const allQaNeeded = tasksQaMonthlyTotal(data.tasks);
            const { effective: allQaEffective, spillover: allQaSpillover } = computeQaSpillover(allQaNeeded, qaAvail);
            const allDiff = devAvail.map((a, i) => a - allTotals[i]);
            const allQaDiff = qaAvail.map((a, i) => a - allQaEffective[i]);
            return (
                <div className="p-6 space-y-4">
                    <Toast />
                    {showJiraModal && <ImportJiraModal existingTasks={data.tasks} onImport={handleImportJiraTasks} onClose={() => setShowJiraModal(false)} />}
                    <div className="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap gap-3 items-center">
                        <button onClick={() => {
                            if (data.tasks.some(t => !t.name || t.name.trim() === '')) {
                                showToast('יש למלא שם למשימה הפתוחה לפני הוספת משימה חדשה');
                                return;
                            }
                            dispatch({ type: 'ADD_TASK' });
                        }} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">
                            <Icon name="plus" className="w-4 h-4" /> משימה חדשה
                        </button>
                        <button onClick={() => setShowJiraModal(true)} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium">
                            <Icon name="download" className="w-4 h-4" /> ייבא משימות Jira
                        </button>
                        {selectedUids.size > 0 && (
                            <button onClick={deleteSelected} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-medium">
                                <Icon name="trash" className="w-4 h-4" /> מחק {selectedUids.size} משימות
                            </button>
                        )}
                        <div className="relative">
                            <button onClick={() => handleAutoDistribute(data, dispatch, devAvail)} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium">
                                ⚡ חלוקה אוטומטית
                            </button>
                            <span className="absolute top-full right-0 mt-0.5 text-xs text-slate-400 whitespace-nowrap">מחלקת שעות למשימות מתועדפות לפי זמינות עובדים</span>
                        </div>
                        <input placeholder="חיפוש משימה..." value={filter} onChange={e => setFilter(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-lg text-sm min-w-60" />
                        <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-lg text-sm">
                            <option value="">כל הסוגים</option>
                            {taskTypes.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                    </div>
                    <div className="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap gap-4 items-center text-sm">
                        <span className="font-semibold text-slate-600">הגדרות זמינות:</span>
                        {['dev_role','qa_role'].map(key => {
                            const label = key === 'dev_role' ? 'תפקיד מפתחים' : 'תפקיד בודקים';
                            const current = settings[key];
                            const hasEmployees = role => data.manpower.employees.some(e => e.team === role);
                            const warn = !hasEmployees(current);
                            function handleChange(e) {
                                const val = e.target.value;
                                if (!hasEmployees(val)) {
                                    showToast(`לתפקיד "${val}" אין עובדים מוגדרים — יש להוסיף בטאב כוח אדם`);
                                    return;
                                }
                                dispatch({ type: 'SET_SETTING', key, value: val });
                            }
                            return (
                                <label key={key} className="flex items-center gap-2">
                                    <span className="text-slate-500">{label}</span>
                                    <select value={current} onChange={handleChange} className={cls('px-2 py-1 border rounded-lg', warn ? 'border-amber-400 bg-amber-50 text-amber-700' : 'border-slate-200')}>
                                        {data.roles.map(r => <option key={r} value={r}>{r}</option>)}
                                    </select>
                                    {warn && <span className="text-amber-500 text-xs">⚠️ אין עובדים</span>}
                                </label>
                            );
                        })}
                    </div>
                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div className="scroll-x">
                            <table className="text-sm w-full">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-600 border-b border-slate-200">
                                        <th style={{width:20,minWidth:20,maxWidth:20}}></th>
                                        <th style={{width:32,minWidth:32,maxWidth:32,textAlign:'center',padding:'0 4px'}}>
                                            <input type="checkbox"
                                                checked={filtered.length > 0 && filtered.every(t => selectedUids.has(t._uid))}
                                                ref={el => { if (el) el.indeterminate = selectedUids.size > 0 && !filtered.every(t => selectedUids.has(t._uid)); }}
                                                onChange={e => {
                                                    if (e.target.checked) setSelectedUids(new Set(filtered.map(t => t._uid)));
                                                    else setSelectedUids(new Set());
                                                }}
                                                style={{accentColor:'#ef4444', cursor:'pointer'}} title="בחר הכל" />
                                        </th>
                                        <ResizableTh colKey="priority" widths={colW} setWidth={setColW} className="p-2 text-center sticky-col bg-slate-50" style={{position:'sticky',right:0,zIndex:3}}>תיעדוף <InfoIcon text="מספר תיעדוף (1, 2, 3...). ייחודי בלבד. משימות עם תיעדוף מסודרות ראשונות." /></ResizableTh>
                                        <ResizableTh colKey="task"     widths={colW} setWidth={setColW} className="p-2 text-right sticky-col bg-slate-50" style={{position:'sticky',right:colW.priority,zIndex:3}}>משימה</ResizableTh>
                                        <ResizableTh colKey="taskNum"  widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">מ׳ משימה</ResizableTh>
                                        <ResizableTh colKey="owner"    widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">מוביל</ResizableTh>
                                        <ResizableTh colKey="type"     widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">סוג משימה</ResizableTh>
                                        <ResizableTh colKey="planned"    widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">זמן פיתוח <InfoIcon text='אומדן שעות פיתוח שנתי. "?" = חסר.' /></ResizableTh>
                                        <ResizableTh colKey="qa_planned" widths={colW} setWidth={setColW} className="p-2 text-center bg-purple-50">זמן בדיקות <InfoIcon text="אומדן שעות בדיקות שנתי." /></ResizableTh>
                                        {QUARTERS.map((q) => q.months.map((m, mi) => (
                                            <th key={m} className={cls('p-2 text-center', mi === 0 && 'q-divider', mi === 2 && 'q-divider-end')} style={{ minWidth: 52, width: 52, color: q.color, whiteSpace: 'nowrap' }}>
                                                <div className="text-[10px] opacity-80">{q.name}</div>
                                                {MONTHS[m]}
                                            </th>
                                        )))}
                                        <ResizableTh colKey="rowTotal"    widths={colW} setWidth={setColW} className="p-2 text-center bg-sky-50 q-divider-end">סה״כ פיתוח</ResizableTh>
                                        <ResizableTh colKey="notes"       widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">הערות</ResizableTh>
                                        <ResizableTh colKey="del"         widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50"></ResizableTh>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.map((t) => {
                                        const rowSum = taskRowSum(t);
                                        const planned = t.planned;
                                        const isMatching = planned !== '?' && planned !== '' && n(rowSum) === n(planned);
                                        const missingEst = planned === '?' || planned === '';
                                        const draggable = isTaskDraggable(t);
                                        const isChecked = selectedUids.has(t._uid);
                                        return (
                                            <tr key={t._uid || t.idx}
                                                onDragOver={draggable ? e => onTaskDragOver(e, t.idx) : undefined}
                                                onDrop={draggable ? e => onTaskDrop(e, t.idx) : undefined}
                                                onDragEnd={draggable ? onTaskDragEnd : undefined}
                                                className={cls('border-b border-slate-100', isChecked ? 'bg-red-50' : 'hover:bg-slate-50', taskDragOver === t.idx && 'outline outline-2 outline-indigo-400')}>
                                                <td draggable={draggable}
                                                    onDragStart={draggable ? e => { e.stopPropagation(); onTaskDragStart(e, t.idx); } : undefined}
                                                    style={{width:20,minWidth:20,maxWidth:20,textAlign:'center',verticalAlign:'middle',color: draggable ? '#94a3b8' : 'transparent', fontSize:14, userSelect:'none', cursor: draggable ? 'grab' : 'default'}} title={draggable ? 'גרור להזזה' : ''}>⠿</td>
                                                <td style={{width:32,minWidth:32,maxWidth:32,textAlign:'center',padding:'0 4px'}}>
                                                    <input type="checkbox" checked={isChecked} onChange={() => toggleSelectUid(t._uid)} style={{accentColor:'#ef4444', cursor:'pointer'}} />
                                                </td>
                                                <td className="p-1 text-center sticky-col bg-white" style={{width:colW.priority,minWidth:colW.priority,maxWidth:colW.priority,overflow:'hidden',position:'sticky',right:0,zIndex:2}}>
                                                    <PriorityCell value={t.priority} taskName={t.name} allTasks={data.tasks} dispatch={dispatch} />
                                                </td>
                                                <td className="p-1 sticky-col bg-white" style={{width:colW.task,minWidth:colW.task,maxWidth:colW.task,overflow:'hidden',position:'sticky',right:colW.priority,zIndex:2}}>
                                                    <TextCell value={t.name} onChange={v => dispatch({ type: 'SET_TASK_FIELD', idx: t.idx, field: 'name', value: v })} className="font-medium text-slate-800" required autoFocusOnMount={!!t._newlyAdded} />
                                                </td>
                                                <td className="p-1 text-center" style={{width:colW.taskNum,minWidth:colW.taskNum}}>
                                                    <input type="text" value={t.task_number||''} onChange={e => dispatch({ type:'SET_TASK_FIELD', idx:t.idx, field:'task_number', value:e.target.value })} className="cell-input text-xs text-center w-full" />
                                                </td>
                                                <td className="p-1" style={{width:colW.owner,minWidth:colW.owner,maxWidth:colW.owner,overflow:'hidden'}}><TextCell value={t.owner} onChange={v => dispatch({ type: 'SET_TASK_FIELD', idx: t.idx, field: 'owner', value: v })} /></td>
                                                <td className="p-1" style={{width:colW.type,minWidth:colW.type,maxWidth:colW.type,overflow:'hidden'}}><TypeSelectCell value={t.type} taskTypes={taskTypes} dispatch={dispatch} onChange={v => dispatch({ type: 'SET_TASK_FIELD', idx: t.idx, field: 'type', value: v })} /></td>
                                                <td className="p-1" style={{width:colW.planned,minWidth:colW.planned,maxWidth:colW.planned,overflow:'hidden'}}><NumberCell value={t.planned} allowQuestion onChange={v => dispatch({ type: 'SET_TASK_FIELD', idx: t.idx, field: 'planned', value: v })} /></td>
                                                <td className="p-1 bg-purple-50" style={{width:colW.qa_planned,minWidth:colW.qa_planned,maxWidth:colW.qa_planned,overflow:'hidden'}}><NumberCell value={t.qa_planned ?? 0} onChange={v => dispatch({ type: 'SET_TASK_FIELD', idx: t.idx, field: 'qa_planned', value: v })} /></td>
                                                {QUARTERS.map((q) => q.months.map((m, mi) => {
                                                    const planned = t.planned;
                                                    const isBlocked = planned !== '?' && planned !== '' && n(planned) > 0 && (() => {
                                                        let sumBefore = 0;
                                                        for (let mi2 = 0; mi2 < 12; mi2++) {
                                                            if (mi2 === m) break;
                                                            sumBefore += n(t.months[mi2]);
                                                        }
                                                        return sumBefore >= n(planned);
                                                    })();
                                                    const isQaMonth = taskQaMonth.get(t._uid) === m;
                                                    return (
                                                        <td key={m} className={cls('p-1 text-center', mi === 0 && 'q-divider', mi === 2 && 'q-divider-end', isBlocked ? 'bg-slate-100' : isQaMonth && 'bg-purple-50')}>
                                                            {isBlocked
                                                                ? <span className="text-slate-300 text-xs select-none" title="תקציב השעות מוצה">—</span>
                                                                : <span className="inline-flex items-center justify-center gap-0.5 w-full">
                                                                    <NumberCell value={t.months[m]} onChange={v => {
                                                                        const planned = t.planned;
                                                                        if (planned !== '?' && planned !== '' && n(planned) > 0) {
                                                                            let sumOther = 0;
                                                                            for (let mi2 = 0; mi2 < 12; mi2++) {
                                                                                if (mi2 !== m) sumOther += n(t.months[mi2]);
                                                                            }
                                                                            const max = Math.max(0, n(planned) - sumOther);
                                                                            if (n(v) > max) {
                                                                                Swal.fire({ icon: 'error', title: 'חריגה מתקציב', text: `סך השעות החודשיות (${n(sumOther) + n(v)}) חורג מתכנון המשימה (${n(planned)} שעות).`, confirmButtonText: 'אישור' });
                                                                                return false;
                                                                            }
                                                                        }
                                                                        dispatch({ type: 'SET_TASK_MONTH', idx: t.idx, monthIdx: m, value: v });
                                                                    }} />
                                                                    {isQaMonth && <span className="text-purple-400 text-[11px] leading-none select-none flex-shrink-0" title={`בדיקות: ${fmt(n(t.qa_planned))} שע'`}>🧪</span>}
                                                                  </span>
                                                            }
                                                        </td>
                                                    );
                                                }))}
                                                <td className="p-1 text-center bg-sky-50 font-semibold q-divider-end" style={{width:colW.rowTotal,minWidth:colW.rowTotal,maxWidth:colW.rowTotal,overflow:'hidden'}}>
                                                    {missingEst
                                                        ? <span className="text-slate-600">{fmt(rowSum)}</span>
                                                        : <span className={cls(isMatching ? 'text-emerald-700' : n(rowSum) > n(planned) ? 'text-red-700' : 'text-amber-600')}>{fmt(rowSum)}<span className="text-slate-400 font-normal">/{fmt(n(planned))}</span></span>
                                                    }
                                                </td>
                                                <td className="p-1" style={{width:colW.notes,minWidth:colW.notes,maxWidth:colW.notes,overflow:'hidden'}}><TextCell value={t.notes} onChange={v => dispatch({ type: 'SET_TASK_FIELD', idx: t.idx, field: 'notes', value: v })} /></td>
                                                <td className="p-1 text-center" style={{width:colW.del,minWidth:colW.del,maxWidth:colW.del,overflow:'hidden'}}>
                                                    <button onClick={async () => { const r = await Swal.fire({ title: 'למחוק משימה?', icon: 'warning', showCancelButton: true, confirmButtonText: 'מחק', cancelButtonText: 'ביטול', reverseButtons: true }); if (r.isConfirmed) dispatch({ type: 'DELETE_TASK', idx: t.idx }); }} className="text-red-400 hover:text-red-600 p-1 rounded hover:bg-red-50">
                                                        <Icon name="trash" className="w-4 h-4" />
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                                <tfoot>
                                    {summaryRows()}
                                </tfoot>
                            </table>
                        </div>
                    </div>
                    {(() => {
                        const devOver = allDiff.map((d, i) => d < 0 ? i : -1).filter(i => i >= 0);
                        if (!devOver.length && !allQaSpillover.length) return null;
                        return (
                            <div className="mt-3 flex flex-col gap-2">
                                {devOver.map(i => (
                                    <div key={`dev-${i}`} className="flex items-start gap-2 px-4 py-2 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
                                        <span className="text-base leading-none mt-0.5">⚠️</span>
                                        <span>שים לב: שעות הפיתוח המחולקות לחודש <strong>{MONTHS[i]}</strong> ({fmt(allTotals[i])}) עולות על שעות המפתחים הזמינות ({fmt(devAvail[i])})</span>
                                    </div>
                                ))}
                                {allQaSpillover.map((s, idx) => (
                                    <div key={`qa-spill-${idx}`} className="flex items-start gap-2 px-4 py-2 rounded-xl bg-amber-50 border border-amber-300 text-amber-800 text-sm">
                                        <span className="text-base leading-none mt-0.5">⚠️</span>
                                        <span>
                                            גלישת בדיקות: חודש <strong>{MONTHS[s.fromMonth]}</strong> עמוס — <strong>{fmt(s.hours)} שע׳ בדיקות</strong> {s.toMonth !== null ? <>הועברו לחודש <strong>{MONTHS[s.toMonth]}</strong></> : <>לא ניתן להעביר — אין חודש נוסף בשנה</>}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        );
                    })()}
                </div>
            );
        }

        // ========== TEAMS PANEL ==========
        function TeamsPanel({ data, dispatch }) {
            const [teams, setTeams] = useState([]);
            const [expanded, setExpanded] = useState({});
            const [editingTeam, setEditingTeam] = useState(null);
            const [editingTeamName, setEditingTeamName] = useState('');
            const [editingMember, setEditingMember] = useState(null);
            const [newMember, setNewMember] = useState({});
            const [toast, setToast] = useState(null);
            const [createModal, setCreateModal] = useState(null); // null | { name, members:[{name,role}] }

            useEffect(() => {
                apiFetch(`${API_BASE}/teams`).then(r => r.json()).then(d => Array.isArray(d) && setTeams(d)).catch(() => {});
            }, []);

            function showToast(msg) {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            }

            function loadMember(member) {
                const base = data.manpower.workdays_base;
                const exists = data.manpower.employees.some(e => e.name === member.name && e.team === member.role);
                if (exists) { showToast(`"${member.name}" כבר נמצא ברשימת העובדים`); return; }
                dispatch({ type: 'ADD_EMPLOYEE_FROM_TEAM', member, base });
            }

            function loadTeam(team) {
                team.members.forEach(m => loadMember(m));
            }

            function openCreateModal() {
                setCreateModal({ name: '', members: [{ _id: Date.now(), name: '', role: data.roles[0] || '' }] });
            }

            async function submitCreateModal() {
                const teamName = (createModal.name || '').trim();
                if (!teamName) return;
                const res = await apiFetch(`${API_BASE}/teams`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: teamName }) });
                const t = await res.json();
                const validMembers = createModal.members.filter(m => m.name.trim() && m.role.trim());
                for (const m of validMembers) {
                    const mr = await apiFetch(`${API_BASE}/teams/${t.id}/members`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: m.name.trim(), role: m.role.trim() }) });
                    const saved = await mr.json();
                    t.members = [...(t.members || []), saved];
                }
                setTeams(prev => [...prev, t]);
                setExpanded(prev => ({ ...prev, [t.id]: true }));
                setCreateModal(null);
            }

            async function renameTeam(team, name) {
                name = name.trim();
                if (!name || name === team.name) return;
                await apiFetch(`${API_BASE}/teams/${team.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
                setTeams(prev => prev.map(t => t.id === team.id ? { ...t, name } : t));
            }

            function enterEditMode(team) {
                setEditingTeam(team.id);
                setEditingTeamName(team.name);
                setEditingMember(null);
            }

            async function exitEditMode(team) {
                const name = editingTeamName.trim();
                if (name && name !== team.name) await renameTeam(team, name);
                setEditingTeam(null);
                setEditingTeamName('');
            }

            async function deleteTeam(team) {
                const role = window.wgAuth?.getUser()?.role;
                if (role !== 'superadmin' && role !== 'admin') {
                    await Swal.fire({ title: 'פעולה מוגבלת', text: 'מחיקת צוות מותרת למנהל מערכת בלבד', icon: 'info', confirmButtonText: 'הבנתי' });
                    return;
                }
                const result = await Swal.fire({ title: `למחוק צוות?`, text: `"${team.name}" וכל חברי הצוות יימחקו`, icon: 'warning', showCancelButton: true, confirmButtonText: 'מחק', cancelButtonText: 'ביטול', reverseButtons: true });
                if (!result.isConfirmed) return;
                await apiFetch(`${API_BASE}/teams/${team.id}`, { method: 'DELETE' });
                setTeams(prev => prev.filter(t => t.id !== team.id));
            }

            async function addMember(teamId) {
                const nm = newMember[teamId] || {};
                const name = (nm.name || '').trim();
                const role = (nm.role || '').trim();
                if (!name || !role) {
                    setNewMember(prev => ({ ...prev, [teamId]: { ...prev[teamId], _err: true } }));
                    return;
                }
                setNewMember(prev => ({ ...prev, [teamId]: { ...prev[teamId], _err: false } }));
                const res = await apiFetch(`${API_BASE}/teams/${teamId}/members`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, role }) });
                const m = await res.json();
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, members: [...t.members, m] } : t));
                setNewMember(prev => ({ ...prev, [teamId]: { name: '', role: '', _err: false } }));
            }

            async function saveMember() {
                if (!editingMember) return;
                const { teamId, memberId, name, role } = editingMember;
                await apiFetch(`${API_BASE}/teams/${teamId}/members/${memberId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name.trim(), role: role.trim() }) });
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, members: t.members.map(m => m.id === memberId ? { ...m, name: name.trim(), role: role.trim() } : m) } : t));
                setEditingMember(null);
            }

            async function deleteMember(teamId, memberId, memberName) {
                const result = await Swal.fire({ title: `למחוק עובד?`, text: `"${memberName}" יוסר מהצוות`, icon: 'warning', showCancelButton: true, confirmButtonText: 'מחק', cancelButtonText: 'ביטול', reverseButtons: true });
                if (!result.isConfirmed) return;
                await apiFetch(`${API_BASE}/teams/${teamId}/members/${memberId}`, { method: 'DELETE' });
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, members: t.members.filter(m => m.id !== memberId) } : t));
            }

            return (
                <div className="bg-white rounded-2xl border border-slate-200 p-5" style={{ position: 'relative' }}>
                    {toast && (
                        <div style={{ position: 'fixed', bottom: 28, left: '50%', transform: 'translateX(-50%)', background: '#1e293b', color: '#fff', padding: '10px 22px', borderRadius: 10, fontSize: 13, fontWeight: 500, zIndex: 9999, boxShadow: '0 4px 16px rgba(0,0,0,.18)', pointerEvents: 'none' }}>
                            {toast}
                        </div>
                    )}

                    {/* ── מודל יצירת צוות חדש ── */}
                    {createModal && ReactDOM.createPortal(
                        <div style={{ position:'fixed', inset:0, background:'rgba(15,23,42,0.45)', zIndex:10000, display:'flex', alignItems:'center', justifyContent:'center' }}
                            onClick={e => { if (e.target === e.currentTarget) setCreateModal(null); }}>
                            <div style={{ background:'#fff', borderRadius:20, padding:28, width:420, maxWidth:'calc(100vw - 32px)', boxShadow:'0 24px 64px rgba(0,0,0,.22)', direction:'rtl' }}>
                                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
                                    <h3 style={{ margin:0, fontSize:17, fontWeight:800, color:'#0f172a' }}>צוות חדש</h3>
                                    <button onClick={() => setCreateModal(null)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:20, color:'#94a3b8', lineHeight:1 }}>✕</button>
                                </div>

                                {/* שם צוות */}
                                <div style={{ marginBottom:20 }}>
                                    <label style={{ fontSize:12, fontWeight:700, color:'#64748b', display:'block', marginBottom:6 }}>שם הצוות</label>
                                    <input autoFocus value={createModal.name}
                                        onChange={e => setCreateModal(m => ({ ...m, name: e.target.value }))}
                                        onKeyDown={e => { if (e.key === 'Enter') submitCreateModal(); }}
                                        placeholder="לדוגמה: צוות פיתוח"
                                        style={{ width:'100%', padding:'8px 12px', border:'1.5px solid #e2e8f0', borderRadius:10, fontSize:14, fontFamily:'inherit', outline:'none', boxSizing:'border-box' }}
                                        onFocus={e => e.target.style.borderColor='#6366f1'}
                                        onBlur={e => e.target.style.borderColor='#e2e8f0'} />
                                </div>

                                {/* חברי צוות */}
                                <div style={{ marginBottom:16 }}>
                                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                                        <label style={{ fontSize:12, fontWeight:700, color:'#64748b' }}>חברי הצוות</label>
                                        <button onClick={() => setCreateModal(m => ({ ...m, members: [{ _id: Date.now(), name:'', role: data.roles[0] || '', _focus: true }, ...m.members] }))}
                                            style={{ display:'inline-flex', alignItems:'center', gap:4, fontSize:12, fontWeight:600, color:'#6366f1', background:'rgba(99,102,241,0.08)', border:'none', borderRadius:8, padding:'4px 10px', cursor:'pointer' }}>
                                            + הוסף חבר
                                        </button>
                                    </div>
                                    <div style={{ display:'flex', flexDirection:'column', gap:8, maxHeight:220, overflowY:'auto' }}>
                                        {createModal.members.map((m, i) => (
                                            <div key={m._id || i} style={{ display:'flex', gap:8, alignItems:'center' }}>
                                                <input autoFocus={!!m._focus} value={m.name}
                                                    onChange={e => setCreateModal(cm => ({ ...cm, members: cm.members.map((x,j) => j===i ? { ...x, name:e.target.value, _focus: false } : x) }))}
                                                    placeholder="שם עובד"
                                                    style={{ flex:1, padding:'7px 10px', border:'1.5px solid #e2e8f0', borderRadius:9, fontSize:13, fontFamily:'inherit', outline:'none' }}
                                                    onFocus={e => e.target.style.borderColor='#6366f1'}
                                                    onBlur={e => e.target.style.borderColor='#e2e8f0'} />
                                                <select value={m.role}
                                                    onChange={e => setCreateModal(cm => ({ ...cm, members: cm.members.map((x,j) => j===i ? { ...x, role:e.target.value } : x) }))}
                                                    style={{ flex:1, padding:'7px 10px', border:'1.5px solid #e2e8f0', borderRadius:9, fontSize:13, fontFamily:'inherit', outline:'none', background:'#fff' }}
                                                    onFocus={e => e.target.style.borderColor='#6366f1'}
                                                    onBlur={e => e.target.style.borderColor='#e2e8f0'}>
                                                    {data.roles.map(r => <option key={r} value={r}>{r}</option>)}
                                                </select>
                                                {createModal.members.length > 1 &&
                                                    <button onClick={() => setCreateModal(cm => ({ ...cm, members: cm.members.filter((_,j) => j!==i) }))}
                                                        style={{ background:'none', border:'none', cursor:'pointer', color:'#ef4444', fontSize:16, padding:'2px 4px', lineHeight:1 }}>✕</button>
                                                }
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* כפתורים */}
                                <div style={{ display:'flex', gap:10, justifyContent:'flex-start' }}>
                                    <button onClick={submitCreateModal}
                                        disabled={!createModal.name.trim()}
                                        style={{ padding:'9px 22px', background: createModal.name.trim() ? 'linear-gradient(135deg,#6366f1,#8b5cf6)' : '#e2e8f0', color: createModal.name.trim() ? '#fff' : '#94a3b8', border:'none', borderRadius:10, fontWeight:700, fontSize:14, fontFamily:'inherit', cursor: createModal.name.trim() ? 'pointer' : 'default', boxShadow: createModal.name.trim() ? '0 2px 12px rgba(99,102,241,0.3)' : 'none', transition:'all .15s' }}>
                                        שמור
                                    </button>
                                    <button onClick={() => setCreateModal(null)}
                                        style={{ padding:'9px 18px', background:'rgba(100,116,139,0.1)', color:'#475569', border:'1px solid rgba(100,116,139,0.2)', borderRadius:10, fontWeight:600, fontSize:14, fontFamily:'inherit', cursor:'pointer' }}>
                                        ביטול
                                    </button>
                                </div>
                            </div>
                        </div>,
                        document.body
                    )}

                    <div className="flex items-center justify-between mb-4">
                        <div>
                            <h2 className="font-bold text-slate-900">צוותים</h2>
                            <p className="text-sm text-slate-500">הגדר צוותים ועובדים וטען אותם לגנט</p>
                        </div>
                        <button onClick={openCreateModal} className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium whitespace-nowrap inline-flex items-center gap-1">
                            <Icon name="plus" className="w-4 h-4" /> הוסף צוות
                        </button>
                    </div>

                    {teams.length === 0 && <div className="text-sm text-slate-400 text-center py-6">אין צוותים עדיין — צור צוות חדש</div>}

                    <div className="flex flex-wrap gap-3">
                        {teams.map((team, tIdx) => {
                            const tagColors = [
                                { bg: '#eff6ff', border: '#bfdbfe', text: '#1d4ed8', dot: '#3b82f6' },
                                { bg: '#f0fdf4', border: '#bbf7d0', text: '#15803d', dot: '#22c55e' },
                                { bg: '#fdf4ff', border: '#e9d5ff', text: '#7e22ce', dot: '#a855f7' },
                                { bg: '#fff7ed', border: '#fed7aa', text: '#c2410c', dot: '#f97316' },
                                { bg: '#f0f9ff', border: '#bae6fd', text: '#0369a1', dot: '#0ea5e9' },
                                { bg: '#fff1f2', border: '#fecdd3', text: '#be123c', dot: '#f43f5e' },
                            ];
                            const tc = tagColors[tIdx % tagColors.length];
                            const isEditing = editingTeam === team.id;
                            return (
                            <div key={team.id} style={{ minWidth: 220, maxWidth: 360, flexShrink: 0, border: `1.5px solid ${isEditing ? tc.border : '#e2e8f0'}`, borderRadius: 14, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: '#fff', boxShadow: isEditing ? `0 0 0 3px ${tc.bg}` : '0 1px 4px rgba(0,0,0,.06)', transition: 'box-shadow .15s, border-color .15s' }}>
                                {/* Header */}
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', borderBottom: `1.5px solid ${isEditing ? tc.border : '#f1f5f9'}`, background: isEditing ? tc.bg : '#fff' }}>
                                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, flexShrink: 0, flex: 1, minWidth: 0 }}>
                                        <span style={{ width: 7, height: 7, borderRadius: '50%', background: tc.dot, flexShrink: 0 }}></span>
                                        {isEditing ? (
                                            <input autoFocus value={editingTeamName} onChange={e => setEditingTeamName(e.target.value)}
                                                style={{ border: 'none', background: 'transparent', outline: 'none', fontSize: 13, fontWeight: 700, color: tc.text, minWidth: 0, flex: 1 }}
                                                onKeyDown={e => { if (e.key === 'Enter') exitEditMode(team); if (e.key === 'Escape') { setEditingTeam(null); setEditingTeamName(''); } }} />
                                        ) : (
                                            <span style={{ fontSize: 13, fontWeight: 700, color: '#1e293b', whiteSpace: 'nowrap' }}>{team.name}</span>
                                        )}
                                    </span>
                                    {!isEditing && <span style={{ fontSize: 11, color: '#94a3b8', flexShrink: 0 }}>{team.members.length} חברים</span>}
                                    {isEditing ? (
                                        <button onClick={() => exitEditMode(team)}
                                            style={{ padding: '3px 10px', borderRadius: 7, background: tc.text, color: '#fff', border: 'none', cursor: 'pointer', fontSize: 11, fontWeight: 700, flexShrink: 0 }}
                                            onMouseOver={e => e.currentTarget.style.opacity='0.8'}
                                            onMouseOut={e => e.currentTarget.style.opacity='1'}>סיום</button>
                                    ) : (
                                        <button onClick={() => enterEditMode(team)}
                                            style={{ padding: '3px 10px', borderRadius: 7, background: '#f1f5f9', color: '#475569', border: '1px solid #e2e8f0', cursor: 'pointer', fontSize: 11, fontWeight: 600, flexShrink: 0 }}
                                            onMouseOver={e => { e.currentTarget.style.background=tc.bg; e.currentTarget.style.color=tc.text; e.currentTarget.style.borderColor=tc.border; }}
                                            onMouseOut={e => { e.currentTarget.style.background='#f1f5f9'; e.currentTarget.style.color='#475569'; e.currentTarget.style.borderColor='#e2e8f0'; }}>ערוך צוות</button>
                                    )}
                                    {isEditing && (
                                        <button onClick={() => deleteTeam(team)} title="מחק צוות"
                                            style={{ color: '#94a3b8', background: 'none', border: 'none', cursor: 'pointer', padding: '2px 5px', fontSize: 15, borderRadius: 6, lineHeight: 1, flexShrink: 0 }}
                                            onMouseOver={e => { e.currentTarget.style.background='#fef2f2'; e.currentTarget.style.color='#ef4444'; }}
                                            onMouseOut={e => { e.currentTarget.style.background='none'; e.currentTarget.style.color='#94a3b8'; }}>×</button>
                                    )}
                                </div>
                                {/* Members list */}
                                <div style={{ flex: 1, maxHeight: 220, overflowY: 'auto', padding: '6px 8px', display: 'flex', flexDirection: 'column', gap: 3 }}>
                                    {team.members.length === 0 && (
                                        <div style={{ textAlign: 'center', color: '#cbd5e1', fontSize: 12, padding: '18px 0' }}>אין חברים עדיין</div>
                                    )}
                                    {team.members.map(m => (
                                        <div key={m.id} style={{ borderRadius: 8, background: '#f8fafc', border: '1px solid transparent', transition: 'all .13s' }}
                                            onMouseOver={e => { e.currentTarget.style.background='#f1f5f9'; e.currentTarget.style.borderColor='#e2e8f0'; }}
                                            onMouseOut={e => { e.currentTarget.style.background='#f8fafc'; e.currentTarget.style.borderColor='transparent'; }}>
                                            {editingMember?.memberId === m.id ? (
                                                <div style={{ padding: '7px 8px', display: 'flex', flexDirection: 'column', gap: 5 }}>
                                                    <input autoFocus value={editingMember.name} onChange={e => setEditingMember(p => ({ ...p, name: e.target.value }))}
                                                        style={{ padding: '4px 8px', border: '1.5px solid #7dd3fc', borderRadius: 7, fontSize: 12, width: '100%', outline: 'none', boxSizing: 'border-box' }} placeholder="שם" />
                                                    <div style={{ display: 'flex', gap: 5 }}>
                                                        <select value={editingMember.role} onChange={e => setEditingMember(p => ({ ...p, role: e.target.value }))}
                                                            style={{ padding: '4px 6px', border: '1.5px solid #7dd3fc', borderRadius: 7, fontSize: 12, flex: 1 }}>
                                                            <option value="">תפקיד...</option>
                                                            {data.roles.map(r => <option key={r} value={r}>{r}</option>)}
                                                        </select>
                                                        <button onClick={saveMember} style={{ padding: '4px 10px', borderRadius: 7, background: '#2563eb', color: '#fff', border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>שמור</button>
                                                        <button onClick={() => setEditingMember(null)} style={{ padding: '4px 8px', borderRadius: 7, background: '#f1f5f9', color: '#64748b', border: 'none', cursor: 'pointer', fontSize: 12 }}>ביטול</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div style={{ padding: '4px 8px', display: 'grid', gridTemplateColumns: '1fr 60px auto', alignItems: 'center', gap: 6 }}>
                                                    <span style={{ fontSize: 12, fontWeight: 600, color: '#1e293b', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textAlign: 'right' }}>{m.name}</span>
                                                    <span style={{ fontSize: 10, fontWeight: 600, color: m.role ? tc.text : 'transparent', background: m.role ? tc.bg : 'transparent', border: `1.5px solid ${m.role ? tc.border : 'transparent'}`, borderRadius: 10, padding: '2px 7px', whiteSpace: 'nowrap', textAlign: 'center', display: 'block', margin: '0 auto' }}>{m.role || ' '}</span>
                                                    <div style={{ display: 'flex', gap: 3 }}>
                                                        {isEditing ? (
                                                            <>
                                                                <button onClick={() => setEditingMember({ teamId: team.id, memberId: m.id, name: m.name, role: m.role })}
                                                                    style={{ padding: '2px 8px', borderRadius: 7, background: '#f1f5f9', color: '#475569', border: '1px solid #e2e8f0', cursor: 'pointer', fontSize: 11, fontWeight: 600 }}
                                                                    onMouseOver={e => { e.currentTarget.style.background='#e2e8f0'; }}
                                                                    onMouseOut={e => { e.currentTarget.style.background='#f1f5f9'; }}>עריכה</button>
                                                                <button onClick={() => deleteMember(team.id, m.id, m.name)}
                                                                    style={{ padding: '2px 8px', borderRadius: 7, background: '#fef2f2', color: '#ef4444', border: '1px solid #fecaca', cursor: 'pointer', fontSize: 11, fontWeight: 600 }}
                                                                    onMouseOver={e => { e.currentTarget.style.background='#fee2e2'; }}
                                                                    onMouseOut={e => { e.currentTarget.style.background='#fef2f2'; }}>מחיקה</button>
                                                            </>
                                                        ) : (
                                                            <button onClick={() => loadMember(m)} title="טען לגנט"
                                                                style={{ flexShrink: 0, fontSize: 10, fontWeight: 600, color: tc.text, background: tc.bg, border: `1.5px solid ${tc.border}`, borderRadius: 10, padding: '2px 7px', whiteSpace: 'nowrap', cursor: 'pointer' }}
                                                                onMouseOver={e => e.currentTarget.style.opacity='0.75'}
                                                                onMouseOut={e => e.currentTarget.style.opacity='1'}>+ טען</button>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                {/* Load all / Add member */}
                                {isEditing ? (
                                    <div style={{ background: '#f8fafc', borderTop: '1.5px solid #e2e8f0', padding: '10px 8px' }}>
                                        <div style={{ fontSize: 10, fontWeight: 700, color: '#94a3b8', marginBottom: 5, textTransform: 'uppercase', letterSpacing: '.06em' }}>הוסף חבר</div>
                                        <input value={newMember[team.id]?.name || ''} onChange={e => setNewMember(p => ({ ...p, [team.id]: { ...p[team.id], name: e.target.value, _err: false } }))}
                                            onKeyDown={e => e.key === 'Enter' && addMember(team.id)}
                                            placeholder="שם מלא..."
                                            style={{ padding: '6px 8px', border: `1.5px solid ${newMember[team.id]?._err && !(newMember[team.id]?.name||'').trim() ? '#ef4444' : '#e2e8f0'}`, borderRadius: 8, fontSize: 12, width: '100%', outline: 'none', boxSizing: 'border-box', marginBottom: 5, background: '#fff' }} />
                                        <div style={{ display: 'flex', gap: 5 }}>
                                            <select value={newMember[team.id]?.role || ''} onChange={e => setNewMember(p => ({ ...p, [team.id]: { ...p[team.id], role: e.target.value, _err: false } }))}
                                                style={{ padding: '6px 6px', border: `1.5px solid ${newMember[team.id]?._err && !(newMember[team.id]?.role||'').trim() ? '#ef4444' : '#e2e8f0'}`, borderRadius: 8, fontSize: 12, flex: 1, minWidth: 0, background: '#fff' }}>
                                                <option value="">בחר תפקיד...</option>
                                                {data.roles.map(r => <option key={r} value={r}>{r}</option>)}
                                            </select>
                                            <button onClick={() => addMember(team.id)}
                                                style={{ padding: '6px 12px', borderRadius: 8, background: tc.bg, color: tc.text, border: `1.5px solid ${tc.border}`, fontSize: 12, fontWeight: 700, cursor: 'pointer', flexShrink: 0 }}
                                                onMouseOver={e => e.currentTarget.style.opacity='0.75'}
                                                onMouseOut={e => e.currentTarget.style.opacity='1'}>+ הוסף</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div style={{ padding: '6px 8px', borderTop: '1px solid #f1f5f9' }}>
                                        <button onClick={() => loadTeam(team)}
                                            style={{ width: '100%', padding: '6px 0', borderRadius: 8, background: tc.bg, color: tc.text, border: `1.5px solid ${tc.border}`, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}
