                    </div>
                </div>
            );
        }

        // ========== SECTION CARD ==========
        function SectionCard({ accent, icon, title, desc, children }) {
            const accents = {
                emerald:{ bar:'#10b981', bg:'#f0fdf4', iconBg:'#d1fae5', iconColor:'#059669' },
                sky:    { bar:'#0ea5e9', bg:'#f0f9ff', iconBg:'#e0f2fe', iconColor:'#0284c7' },
                teal:   { bar:'#14b8a6', bg:'#f0fdfa', iconBg:'#ccfbf1', iconColor:'#0d9488' },
                violet: { bar:'#8b5cf6', bg:'#faf5ff', iconBg:'#ede9fe', iconColor:'#7c3aed' },
                rose:   { bar:'#f43f5e', bg:'#fff1f2', iconBg:'#ffe4e6', iconColor:'#e11d48' },
            };
            const a = accents[accent] || accents.emerald;
            return (
                <div style={{ background:'#fff', borderRadius:20, boxShadow:'0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04)', border:'1px solid #e8edf3', overflow:'hidden' }}>
                    <div style={{ background: `linear-gradient(135deg, ${a.bg} 0%, #fff 100%)`, borderBottom:'1px solid #e8edf3', padding:'18px 24px 16px' }}>
                        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                            <div style={{ width:36, height:36, borderRadius:10, background: a.iconBg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, boxShadow:`0 0 0 4px ${a.bar}18` }}>
                                {icon}
                            </div>
                            <div>
                                <div style={{ fontWeight:700, fontSize:15, color:'#1e293b', letterSpacing:'-0.01em' }}>{title}</div>
                                {desc && <div style={{ fontSize:12, color:'#94a3b8', marginTop:2, lineHeight:1.5 }}>{desc}</div>}
                            </div>
                            <div style={{ marginRight:'auto', width:3, height:32, borderRadius:4, background: a.bar, flexShrink:0 }} />
                        </div>
                    </div>
                    <div style={{ padding:'20px 24px' }}>
                        {children}
                    </div>
                </div>
            );
        }

        // ========== SETTINGS SCREEN ==========
        function SettingsScreen({ data, dispatch, onDirtyChange }) {
            const { meta, manpower, roles, taskTypes=DEFAULT_TASK_TYPES, taskStatuses=TASK_STATUSES } = data;
            const [title, setTitle] = useState(meta.title);
            const [hpd, setHpd] = useState(manpower.hours_per_day);
            const [localDefaultType, setLocalDefaultType] = useState(data.defaultTaskType || taskTypes[0] || 'פרויקט');
            const [localDefaultStatus, setLocalDefaultStatus] = useState(data.defaultTaskStatus || (taskStatuses[0] && taskStatuses[0].value) || 'pending');
            const [localRoles, setLocalRoles] = useState(roles);
            const [localTypes, setLocalTypes] = useState(taskTypes);
            const [localStatuses, setLocalStatuses] = useState(taskStatuses);
            const [newRole, setNewRole] = useState('');
            const [newType, setNewType] = useState('');
            const [newStatusLabel, setNewStatusLabel] = useState('');
            const [newStatusBg, setNewStatusBg] = useState('#6366f1');
            const [newStatusText, setNewStatusText] = useState('#ffffff');

            const rolesChanged = JSON.stringify(localRoles) !== JSON.stringify(roles);
            const typesChanged = JSON.stringify(localTypes) !== JSON.stringify(taskTypes);
            const statusesChanged = JSON.stringify(localStatuses) !== JSON.stringify(taskStatuses);

            const isDirty = title !== meta.title
                || Number(hpd) !== manpower.hours_per_day
                || localDefaultType !== (data.defaultTaskType || taskTypes[0] || 'פרויקט')
                || localDefaultStatus !== (data.defaultTaskStatus || (taskStatuses[0] && taskStatuses[0].value) || 'pending')
                || rolesChanged || typesChanged || statusesChanged;

            useEffect(() => { if (onDirtyChange) onDirtyChange(isDirty); }, [isDirty]);

            const STATUS_PALETTE = [
                '#6366f1','#818cf8','#a5b4fc','#ddd6fe',
                '#0ea5e9','#38bdf8','#7dd3fc','#bae6fd',
                '#10b981','#34d399','#6ee7b7','#a7f3d0',
                '#f59e0b','#fbbf24','#fcd34d','#fef08a',
                '#ef4444','#f87171','#fca5a5','#fecaca',
                '#ec4899','#f472b6','#f9a8d4','#fbcfe8',
                '#8b5cf6','#a78bfa','#c4b5fd','#ede9fe',
                '#14b8a6','#2dd4bf','#5eead4','#99f6e4',
                '#f97316','#fb923c','#fdba74','#fed7aa',
                '#64748b','#94a3b8','#cbd5e1','#f1f5f9',
                '#1e293b','#334155','#475569','#ffffff',
            ];
            const TEXT_PALETTE = [
                '#ffffff','#f8fafc','#f1f5f9','#e2e8f0',
                '#000000','#0f172a','#1e293b','#334155',
                '#475569','#64748b','#94a3b8','#cbd5e1',
                '#6366f1','#0ea5e9','#10b981','#f59e0b',
                '#ef4444','#ec4899','#8b5cf6','#f97316',
            ];

            function saveAll() {
                if (title !== meta.title) dispatch({ type:'SET_META', patch:{ title } });
                if (Number(hpd) !== manpower.hours_per_day) dispatch({ type:'SET_HOURS_PER_DAY', value:Number(hpd) });
                const origType = data.defaultTaskType || taskTypes[0] || 'פרויקט';
                const origStatus = data.defaultTaskStatus || (taskStatuses[0] && taskStatuses[0].value) || 'pending';
                if (localDefaultType !== origType || localDefaultStatus !== origStatus) {
                    dispatch({ type:'SET_DEFAULT_TASK', taskType: localDefaultType, taskStatus: localDefaultStatus });
                }
                if (rolesChanged) dispatch({ type:'SET_ROLES', roles: localRoles });
                if (typesChanged) dispatch({ type:'SET_TASK_TYPES', taskTypes: localTypes });
                if (statusesChanged) dispatch({ type:'SET_TASK_STATUSES', taskStatuses: localStatuses });
                if (onDirtyChange) onDirtyChange(false);
                Swal.fire({ toast:true, position:'top-end', icon:'success', title:'ההגדרות נשמרו', showConfirmButton:false, timer:1800, timerProgressBar:true });
            }

            async function deleteRole(r) {
                const used = data.manpower.employees.some(e => e.team === r);
                if (used) {
                    const res = await Swal.fire({ title:`למחוק תפקיד "${r}"?`, text:'עובדים המשויכים לתפקיד זה יישארו ללא תפקיד', icon:'warning', showCancelButton:true, confirmButtonText:'מחק', cancelButtonText:'ביטול', reverseButtons:true });
                    if (!res.isConfirmed) return;
                }
                setLocalRoles(prev => prev.filter(x => x !== r));
            }

            async function deleteType(t) {
                const used = data.tasks.some(task => task.type === t);
                if (used) {
                    const res = await Swal.fire({ title:`למחוק סוג "${t}"?`, text:'משימות עם סוג זה יישארו ללא סוג', icon:'warning', showCancelButton:true, confirmButtonText:'מחק', cancelButtonText:'ביטול', reverseButtons:true });
                    if (!res.isConfirmed) return;
                }
                setLocalTypes(prev => prev.filter(x => x !== t));
            }

            function deleteStatus(value) {
                setLocalStatuses(prev => prev.filter(s => s.value !== value));
            }

            function addRole(name) {
                if (!name) return;
                setLocalRoles(prev => prev.includes(name) ? prev : [...prev, name]);
                setNewRole('');
            }

            function addType(name) {
                if (!name) return;
                setLocalTypes(prev => prev.includes(name) ? prev : [...prev, name]);
                setNewType('');
            }

            function addStatus(label) {
                if (!label) return;
                const v = label.trim().toLowerCase().replace(/\s+/g, '-');
                setLocalStatuses(prev => prev.find(s => s.value === v) ? prev : [...prev, { value:v, label:label.trim(), color:newStatusText, bg:newStatusBg, color2:newStatusText }]);
                setNewStatusLabel('');
            }

            const inp = "w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400/40 focus:border-emerald-400 transition shadow-sm";
            const inpSm = "px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-center font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-400/40 focus:border-emerald-400 transition shadow-sm";
            const sel = "w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400/40 focus:border-sky-400 transition shadow-sm appearance-none cursor-pointer";
            const fieldHint = "text-xs text-slate-400 mt-1.5 leading-relaxed";

            return (
                <div style={{background:'#f4f6fb', minHeight:'100%'}} className="p-6 space-y-5">

                    {/* ── SAVE BAR ── */}
                    <div style={{
                        display:'flex', alignItems:'center', justifyContent:'space-between',
                        padding:'14px 22px',
                        borderRadius:16,
                        background: isDirty ? 'linear-gradient(135deg,#f0fdf4,#d1fae5)' : 'linear-gradient(135deg,#f8fafc,#f1f5f9)',
                        border: isDirty ? '1.5px solid #6ee7b7' : '1.5px solid #e2e8f0',
                        boxShadow: isDirty ? '0 4px 20px rgba(16,185,129,0.15)' : '0 2px 8px rgba(0,0,0,0.04)',
                        transition:'all 0.25s',
                    }}>
                        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                            <div style={{ width:8, height:8, borderRadius:'50%', background: isDirty ? '#10b981' : '#94a3b8', boxShadow: isDirty ? '0 0 0 4px #6ee7b755' : 'none', transition:'all 0.25s' }} />
                            <span style={{ fontSize:13, fontWeight:600, color: isDirty ? '#065f46' : '#94a3b8' }}>
                                {isDirty ? 'יש שינויים שלא נשמרו' : 'כל השינויים מעודכנים'}
                            </span>
                        </div>
                        <div style={{ display:'flex', gap:10 }}>
                            <button onClick={() => window.parent._wgsb?.deleteGantt(ganttId, data.meta?.title)} style={{
                                padding:'9px 18px', borderRadius:10, fontSize:13, fontWeight:700, border:'1.5px solid #fecaca', cursor:'pointer',
                                background:'rgba(239,68,68,0.06)', color:'#ef4444', transition:'all 0.2s',
                            }}
                            onMouseEnter={e=>{e.currentTarget.style.background='rgba(239,68,68,0.14)';e.currentTarget.style.borderColor='#ef4444'}}
                            onMouseLeave={e=>{e.currentTarget.style.background='rgba(239,68,68,0.06)';e.currentTarget.style.borderColor='#fecaca'}}>
                                🗑 מחק גאנט
                            </button>
                            <button onClick={saveAll} disabled={!isDirty} style={{
                                padding:'9px 26px', borderRadius:10, fontSize:13, fontWeight:700, border:'none', cursor: isDirty ? 'pointer' : 'not-allowed',
                                background: isDirty ? 'linear-gradient(135deg,#10b981,#059669)' : '#e2e8f0',
                                color: isDirty ? '#fff' : '#94a3b8',
                                boxShadow: isDirty ? '0 4px 14px rgba(16,185,129,0.4)' : 'none',
                                transition:'all 0.2s',
                            }}>
                                שמור הגדרות
                            </button>
                        </div>
                    </div>

                    {/* ── ROW 1: כללי + ברירות מחדל ── */}
                    <div className="flex gap-5 flex-wrap">
                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="emerald" icon="⚙️" title="כללי" desc="הגדרות בסיסיות של הגאנט">
                            <div className="space-y-4">
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>שם התוכנית</label>
                                    <input value={title} onChange={e => setTitle(e.target.value)} className={inp} placeholder="שם הגאנט..." />
                                    <p className={fieldHint}>מוצג בכותרת הגאנט ובסיידבר.</p>
                                </div>
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>שעות עבודה ליום</label>
                                    <input type="number" step="0.5" min="1" max="24" value={hpd} onChange={e => setHpd(e.target.value)} className={inpSm} style={{width:120}} />
                                    <p className={fieldHint}>בסיס חישוב שעות זמינות לכל עובד.</p>
                                </div>
                            </div>
                        </SectionCard>
                        </div>

                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="sky" icon="✦" title="ברירות מחדל למשימה חדשה" desc="ערכים שיוגדרו אוטומטית בהוספת משימה">
                            <div className="space-y-4">
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>סוג משימה</label>
                                    <div style={{position:'relative'}}>
                                        <select value={localDefaultType} onChange={e => setLocalDefaultType(e.target.value)} className={sel}>
                                            {localTypes.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                        <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94a3b8',fontSize:11}}>▾</span>
                                    </div>
                                    <p className={fieldHint}>הסוג שייבחר בעמודת "סוג משימה" אוטומטית.</p>
                                </div>
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>סטטוס</label>
                                    <div style={{position:'relative'}}>
                                        <select value={localDefaultStatus} onChange={e => setLocalDefaultStatus(e.target.value)} className={sel}>
                                            {localStatuses.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
                                        </select>
                                        <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94a3b8',fontSize:11}}>▾</span>
                                    </div>
                                    <p className={fieldHint}>הסטטוס ההתחלתי של כל משימה חדשה.</p>
                                </div>
                            </div>
                        </SectionCard>
                        </div>
                    </div>

                    {/* ── ROW 2: תפקידים + סוגי משימות ── */}
                    <div className="flex gap-5 flex-wrap">
                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="teal" icon="👤" title="תפקידים" desc="לסיווג עובדים ומעקב ניצול משאבים לפי תפקיד">
                            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14,minHeight:36}}>
                                {localRoles.map(r => (
                                    <span key={r} style={{ display:'inline-flex',alignItems:'center',gap:4,padding:'5px 12px',borderRadius:10,background:'#f1f5f9',color:'#475569',fontSize:13,fontWeight:500,boxShadow:'0 1px 3px rgba(0,0,0,0.07)' }}>
                                        {r}
                                        <button onClick={() => deleteRole(r)} style={{color:'#94a3b8',background:'none',border:'none',cursor:'pointer',padding:'0 0 0 2px',fontSize:15,lineHeight:1}} onMouseEnter={e=>e.target.style.color='#ef4444'} onMouseLeave={e=>e.target.style.color='#94a3b8'}>×</button>
                                    </span>
                                ))}
                                {localRoles.length === 0 && <span style={{fontSize:12,color:'#cbd5e1',alignSelf:'center'}}>הוסף תפקיד ראשון...</span>}
                            </div>
                            <div style={{display:'flex',gap:8}}>
                                <input value={newRole} onChange={e => setNewRole(e.target.value)}
                                    onKeyDown={e => { if (e.key==='Enter') addRole(newRole.trim()); }}
                                    placeholder="שם תפקיד חדש..." className={inp} style={{flex:1}} />
                                <button onClick={() => addRole(newRole.trim())}
                                    style={{padding:'10px 18px',borderRadius:10,background:'linear-gradient(135deg,#14b8a6,#0d9488)',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,boxShadow:'0 2px 8px rgba(20,184,166,0.3)',whiteSpace:'nowrap'}}>
                                    + הוסף
                                </button>
                            </div>
                        </SectionCard>
                        </div>

                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="violet" icon="🏷️" title="סוגי משימות" desc="קיטלוג משימות לפי אופי — מוצג בצבע בגאנט">
                            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14,minHeight:36}}>
                                {localTypes.map(t => (
                                    <span key={t} style={{ display:'inline-flex',alignItems:'center',gap:4,padding:'5px 12px',borderRadius:10,background:getTypeColor(t,localTypes)+'18',color:getTypeColor(t,localTypes),fontSize:13,fontWeight:600,boxShadow:'inset 0 0 0 1.5px '+getTypeColor(t,localTypes)+'33' }}>
                                        {t}
                                        <button onClick={() => deleteType(t)} style={{background:'none',border:'none',cursor:'pointer',padding:'0 0 0 2px',fontSize:15,lineHeight:1,color:getTypeColor(t,localTypes)+'99'}} onMouseEnter={e=>e.target.style.color='#ef4444'} onMouseLeave={e=>e.target.style.color=getTypeColor(t,localTypes)+'99'}>×</button>
                                    </span>
                                ))}
                                {localTypes.length === 0 && <span style={{fontSize:12,color:'#cbd5e1',alignSelf:'center'}}>הוסף סוג ראשון...</span>}
                            </div>
                            <div style={{display:'flex',gap:8}}>
                                <input value={newType} onChange={e => setNewType(e.target.value)}
                                    onKeyDown={e => { if (e.key==='Enter') addType(newType.trim()); }}
                                    placeholder="סוג חדש..." className={inp} style={{flex:1}} />
                                <button onClick={() => addType(newType.trim())}
                                    style={{padding:'10px 18px',borderRadius:10,background:'linear-gradient(135deg,#8b5cf6,#7c3aed)',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,boxShadow:'0 2px 8px rgba(139,92,246,0.3)',whiteSpace:'nowrap'}}>
                                    + הוסף
                                </button>
                            </div>
                        </SectionCard>
                        </div>
                    </div>

                    {/* ── ROW 3: סטטוסי משימות ── */}
                    <SectionCard accent="rose" icon="◉" title="סטטוסי משימות" desc="הגדר שם, צבע רקע וצבע טקסט לכל סטטוס — יוצג בגאנט ובדשבורד">
                        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:20,minHeight:36}}>
                            {localStatuses.map(s => {
                                const inUse = data.tasks.some(t => t.status === s.value);
                                return (
                                    <span key={s.value} style={{ display:'inline-flex',alignItems:'center',gap:5,padding:'6px 14px',borderRadius:10,background: s.bg||s.color, color: s.color2||'#fff', fontSize:13, fontWeight:600, boxShadow:`0 2px 8px ${s.bg||s.color}55, inset 0 0 0 1px ${s.bg||s.color}` }}>
                                        {s.label}
                                        {!inUse && <button onClick={() => deleteStatus(s.value)} style={{background:'none',border:'none',cursor:'pointer',fontSize:15,lineHeight:1,color:'rgba(255,255,255,0.6)',padding:'0 0 0 2px'}} onMouseEnter={e=>e.target.style.color='#fff'} onMouseLeave={e=>e.target.style.color='rgba(255,255,255,0.6)'}>×</button>}
                                        {inUse && <span style={{fontSize:10,opacity:0.65,marginRight:2}}>בשימוש</span>}
                                    </span>
                                );
                            })}
                            {localStatuses.length === 0 && <span style={{fontSize:12,color:'#cbd5e1'}}>הוסף סטטוס ראשון...</span>}
                        </div>

                        <div style={{ background:'#f8fafc', borderRadius:16, border:'1px solid #e2e8f0', padding:'20px 24px', boxShadow:'inset 0 2px 8px rgba(0,0,0,0.03)' }}>
                            <div style={{fontSize:11,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:14}}>הוספת סטטוס חדש</div>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                                <div>
                                    <label style={{fontSize:11,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>שם</label>
                                    <input value={newStatusLabel} onChange={e => setNewStatusLabel(e.target.value)}
                                        onKeyDown={e => { if (e.key==='Enter') addStatus(newStatusLabel.trim()); }}
                                        placeholder="שם הסטטוס..." className={inp} />
                                </div>
                                <div style={{display:'flex',alignItems:'flex-end',gap:10}}>
                                    <div>
                                        <div style={{fontSize:11,fontWeight:600,color:'#64748b',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>תצוגה מקדימה</div>
                                        <span style={{ display:'inline-flex',alignItems:'center',padding:'7px 16px',borderRadius:10,background:newStatusBg,color:newStatusText,fontSize:13,fontWeight:600,boxShadow:`0 2px 8px ${newStatusBg}55`,minWidth:80,justifyContent:'center' }}>
                                            {newStatusLabel || 'סטטוס'}
                                        </span>
                                    </div>
                                    <button onClick={() => addStatus(newStatusLabel.trim())}
                                        style={{padding:'9px 20px',borderRadius:10,background:'linear-gradient(135deg,#f43f5e,#e11d48)',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,boxShadow:'0 2px 8px rgba(244,63,94,0.35)',whiteSpace:'nowrap',marginBottom:1}}>
                                        + הוסף
                                    </button>
                                </div>
                            </div>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginTop:14}}>
                                <div>
                                    <div style={{fontSize:11,fontWeight:600,color:'#64748b',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>צבע רקע</div>
                                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                                        {STATUS_PALETTE.map(c => (
                                            <button key={c} onClick={() => setNewStatusBg(c)}
                                                style={{ background:c, width:24, height:24, borderRadius:6, border: newStatusBg===c ? '3px solid #0ea5e9' : '2px solid rgba(0,0,0,0.1)', cursor:'pointer', flexShrink:0, boxShadow: newStatusBg===c ? '0 0 0 2px #fff, 0 0 0 4px #0ea5e9' : 'none', transition:'box-shadow 0.15s' }} />
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <div style={{fontSize:11,fontWeight:600,color:'#64748b',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>צבע טקסט</div>
                                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                                        {TEXT_PALETTE.map(c => (
                                            <button key={c} onClick={() => setNewStatusText(c)}
                                                style={{ background:c, width:24, height:24, borderRadius:6, border: newStatusText===c ? '3px solid #0ea5e9' : '2px solid rgba(0,0,0,0.1)', cursor:'pointer', flexShrink:0, boxShadow: newStatusText===c ? '0 0 0 2px #fff, 0 0 0 4px #0ea5e9' : 'none', transition:'box-shadow 0.15s' }} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </SectionCard>

                </div>
            );
        }

        // ========== EXPORT / IMPORT ==========
        function exportToExcel(data) {
            const wb = XLSX.utils.book_new();
            const { meta, manpower, tasks, roles } = data;
            const { year, month } = meta;
            const hpd = manpower.hours_per_day;
            const halfDayHours = manpower.half_day_hours || 4.5;
            const days = buildDays(year, month);
            const numDays = days.length;
            const primaryRole = getPrimaryRole(data);
            const roleHours = roleHoursByDay(manpower.employees, hpd, year, month, roles, halfDayHours);
            const avail = roleHours[primaryRole] || new Array(numDays).fill(0);
            const totals = tasksDailyTotal(tasks, numDays);
            const dayHeaders = days.map(d => `${d}/${month+1}`);

            // --- Style helpers ---
            const BASE_BORDER = {
                top:    { style:'thin', color:{ rgb:'E2E8F0' } },
                bottom: { style:'thin', color:{ rgb:'E2E8F0' } },
                left:   { style:'thin', color:{ rgb:'E2E8F0' } },
                right:  { style:'thin', color:{ rgb:'E2E8F0' } }
            };
            function styleCell(cell, s) { cell.s = s; }
            function mkStyle(overrides) {
                return Object.assign({
                    font:      { name:'Arial', sz:10 },
                    alignment: { horizontal:'center', vertical:'center', wrapText:true, readingOrder:2 },
                    border:    BASE_BORDER
                }, overrides);
            }
            function applyStyle(ws, addr, s) {
                if (!ws[addr]) return;
                ws[addr].s = s;
            }
            function cellAddr(r, c) {
                let col = '';
                let n = c;
                while (n >= 0) { col = String.fromCharCode(65 + (n % 26)) + col; n = Math.floor(n / 26) - 1; }
                return col + (r + 1);
            }
            function applyRangeStyle(ws, startR, startC, endR, endC, s) {
                for (let r = startR; r <= endR; r++) {
                    for (let c = startC; c <= endC; c++) {
                        const addr = cellAddr(r, c);
                        if (!ws[addr]) { ws[addr] = { t:'z', v:'' }; }
                        ws[addr].s = JSON.parse(JSON.stringify(s));
                    }
                }
            }

            // Shared styles
            const sTitleRow = mkStyle({
                font:  { name:'Arial', sz:14, bold:true, color:{ rgb:'FFFFFF' } },
                fill:  { patternType:'solid', fgColor:{ rgb:'1E3A5F' } },
                alignment: { horizontal:'center', vertical:'center', wrapText:true, readingOrder:2 }
            });
            const sHeaderRow = mkStyle({
                font:  { name:'Arial', sz:10, bold:true, color:{ rgb:'FFFFFF' } },
                fill:  { patternType:'solid', fgColor:{ rgb:'2563EB' } },
                alignment: { horizontal:'center', vertical:'center', wrapText:true, readingOrder:2 },
                border: BASE_BORDER
            });
            const sDataNormal = mkStyle({
                font:  { name:'Arial', sz:10 },
                fill:  { patternType:'solid', fgColor:{ rgb:'FFFFFF' } },
                alignment: { horizontal:'center', vertical:'center', wrapText:true, readingOrder:2 },
                border: BASE_BORDER
            });
            const sDataAlt = mkStyle({
                font:  { name:'Arial', sz:10 },
                fill:  { patternType:'solid', fgColor:{ rgb:'F8FAFC' } },
                alignment: { horizontal:'center', vertical:'center', wrapText:true, readingOrder:2 },
                border: BASE_BORDER
            });
            const sDataBoldLeft = mkStyle({
                font:  { name:'Arial', sz:10, bold:true },
                fill:  { patternType:'solid', fgColor:{ rgb:'FFFFFF' } },
                alignment: { horizontal:'right', vertical:'center', wrapText:true, readingOrder:2 },
                border: BASE_BORDER
            });
            const sDataBoldLeftAlt = mkStyle({
                font:  { name:'Arial', sz:10, bold:true },
                fill:  { patternType:'solid', fgColor:{ rgb:'F8FAFC' } },
                alignment: { horizontal:'right', vertical:'center', wrapText:true, readingOrder:2 },
                border: BASE_BORDER
            });
            const sWeekend = mkStyle({
                font:  { name:'Arial', sz:10 },
                fill:  { patternType:'solid', fgColor:{ rgb:'F1F5F9' } },
                alignment: { horizontal:'center', vertical:'center', readingOrder:2 },
                border: BASE_BORDER
            });
            const sWeekendHeader = mkStyle({
                font:  { name:'Arial', sz:10, bold:true, color:{ rgb:'FFFFFF' } },
                fill:  { patternType:'solid', fgColor:{ rgb:'1E40AF' } },
                alignment: { horizontal:'center', vertical:'center', readingOrder:2 },
                border: BASE_BORDER
            });

            // ========== SHEET 1 — תוכנית עבודה ==========
            // Columns: #, משימה, מוביל, סטטוס, סוג, תכנון, day1..dayN, סה"כ, הערות
            const COL_NUM    = 0;
            const COL_NAME   = 1;
            const COL_OWNER  = 2;
            const COL_STATUS = 3;
            const COL_TYPE   = 4;
            const COL_PLAN   = 5;
            const COL_DAY0   = 6;
            const COL_TOTAL  = COL_DAY0 + numDays;
            const COL_NOTES  = COL_TOTAL + 1;
            const TOTAL_COLS = COL_NOTES + 1;

            // Build AOA
            const titleLabel = `${meta.title} – ${MONTH_NAMES[month]} ${year}`;
            const s1aoa = [];
            // Row 0: title (will merge)
            const titleRowArr = new Array(TOTAL_COLS).fill('');
            titleRowArr[0] = titleLabel;
            s1aoa.push(titleRowArr);
            // Row 1: headers
            const hdrs = ['#','משימה','מוביל','סטטוס','סוג','תכנון (ש׳)',...dayHeaders,'סה"כ','הערות'];
            s1aoa.push(hdrs);
            // Data rows
            tasks.forEach((t, idx) => {
                const taskDays = t.days || new Array(numDays).fill(0);
                s1aoa.push([idx+1, t.name||'', t.owner||'', t.status||'', t.type||'', n(t.planned), ...taskDays.map(v=>n(v)), taskRowSum(t), t.notes||'']);
            });
            // Summary rows
            const totalAssigned = totals.reduce((a,b)=>a+b,0);
            const totalAvail    = avail.reduce((a,b)=>a+b,0);
            const totalDiff     = totalAvail - totalAssigned;
            const sRowShivutz = new Array(TOTAL_COLS).fill('');
            sRowShivutz[COL_NAME] = 'סה"כ שיבוץ'; [...totals].forEach((v,i)=>{ sRowShivutz[COL_DAY0+i]=v; }); sRowShivutz[COL_TOTAL]=totalAssigned;
            const sRowZamin   = new Array(TOTAL_COLS).fill('');
            sRowZamin[COL_NAME]   = 'זמינים';      [...avail].forEach((v,i)=>{ sRowZamin[COL_DAY0+i]=v; });   sRowZamin[COL_TOTAL]=totalAvail;
            const sRowHefresh = new Array(TOTAL_COLS).fill('');
            sRowHefresh[COL_NAME] = 'הפרש';        avail.forEach((a,i)=>{ sRowHefresh[COL_DAY0+i]=a-totals[i]; }); sRowHefresh[COL_TOTAL]=totalDiff;
            s1aoa.push(sRowShivutz, sRowZamin, sRowHefresh);

            const ws1 = XLSX.utils.aoa_to_sheet(s1aoa);

            // Merges: title row spans all cols
            ws1['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:TOTAL_COLS-1} }];

            // Column widths
            const s1cols = [
                { wch:5  },  // #
                { wch:32 },  // משימה
                { wch:14 },  // מוביל
                { wch:10 },  // סטטוס
                { wch:12 },  // סוג
                { wch:10 },  // תכנון
                ...days.map((d, i) => {
                    const dateObj = new Date(year, month, d);
                    return isWeekendDate(dateObj) ? { wch:5 } : { wch:7 };
                }),
                { wch:10 },  // סה"כ
                { wch:30 },  // הערות
            ];
            ws1['!cols'] = s1cols;

            // Row heights
            ws1['!rows'] = [{ hpt:22 }, { hpt:30 }];

            // Freeze: row 2 + col 2 (after header row + after col #)
            ws1['!freeze'] = { xSplit:2, ySplit:2, topLeftCell:'C3', activeCell:'C3', sqref:'C3' };

            // Apply styles: title row
            applyRangeStyle(ws1, 0, 0, 0, TOTAL_COLS-1, sTitleRow);

            // Header row
            for (let c = 0; c < TOTAL_COLS; c++) {
                const addr = cellAddr(1, c);
                if (!ws1[addr]) ws1[addr] = { t:'z', v:'' };
                const isWknd = c >= COL_DAY0 && c < COL_TOTAL && isWeekendDate(new Date(year, month, days[c-COL_DAY0]));
                ws1[addr].s = isWknd ? sWeekendHeader : sHeaderRow;
            }

            // Data rows
            const dataStartRow = 2;
            tasks.forEach((t, idx) => {
                const r = dataStartRow + idx;
                const isAlt = idx % 2 === 1;
                for (let c = 0; c < TOTAL_COLS; c++) {
                    const addr = cellAddr(r, c);
                    if (!ws1[addr]) ws1[addr] = { t:'z', v:'' };
                    const isWknd = c >= COL_DAY0 && c < COL_TOTAL && isWeekendDate(new Date(year, month, days[c-COL_DAY0]));
                    if (isWknd) {
                        ws1[addr].s = JSON.parse(JSON.stringify(sWeekend));
                        if (isAlt) ws1[addr].s.fill = { patternType:'solid', fgColor:{ rgb:'E9EEF4' } };
                    } else if (c === COL_NAME) {
                        ws1[addr].s = isAlt ? sDataBoldLeftAlt : sDataBoldLeft;
                    } else {
                        ws1[addr].s = isAlt ? JSON.parse(JSON.stringify(sDataAlt)) : JSON.parse(JSON.stringify(sDataNormal));
                        if (c === COL_NOTES) ws1[addr].s.alignment.horizontal = 'right';
                    }
                }
            });

            // Summary rows
            const shivutzR = dataStartRow + tasks.length;
            const zaminR   = shivutzR + 1;
            const hefreshR = zaminR + 1;
            const sShivutz = mkStyle({ font:{ name:'Arial', sz:10, bold:true }, fill:{ patternType:'solid', fgColor:{ rgb:'FEF3C7' } }, border: BASE_BORDER });
            const sZamin   = mkStyle({ font:{ name:'Arial', sz:10, bold:true, color:{ rgb:'FFFFFF' } }, fill:{ patternType:'solid', fgColor:{ rgb:'065F46' } }, border: BASE_BORDER });
            for (let c = 0; c < TOTAL_COLS; c++) {
                const aS = cellAddr(shivutzR, c);
                const aZ = cellAddr(zaminR, c);
                const aH = cellAddr(hefreshR, c);
                if (!ws1[aS]) ws1[aS] = { t:'z', v:'' };
                if (!ws1[aZ]) ws1[aZ] = { t:'z', v:'' };
                if (!ws1[aH]) ws1[aH] = { t:'z', v:'' };
                ws1[aS].s = JSON.parse(JSON.stringify(sShivutz));
                ws1[aZ].s = JSON.parse(JSON.stringify(sZamin));
                // הפרש: green if >= 0, red if < 0
                const v = (c >= COL_DAY0 && c < COL_TOTAL) ? avail[c-COL_DAY0] - totals[c-COL_DAY0] : (c === COL_TOTAL ? totalDiff : null);
                const hefreshColor = (v === null || v >= 0) ? '065F46' : 'DC2626';
                ws1[aH].s = mkStyle({ font:{ name:'Arial', sz:10, bold:true, color:{ rgb:'FFFFFF' } }, fill:{ patternType:'solid', fgColor:{ rgb: hefreshColor } }, border: BASE_BORDER });
            }

            ws1['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws1, 'תוכנית עבודה');

            // ========== SHEET 2 — כוח אדם ==========
            // Columns: שם, תפקיד, שעות/יום, סה"כ שעות, חופש / מחלה, day1..dayN
            const emp = manpower.employees;
            const manHeaderRow = ['שם','תפקיד','שעות/יום','סה"כ שעות','חופש / מחלה',...dayHeaders];
            const manAOA = [manHeaderRow];
            emp.forEach(e => {
                const hrs = personMonthlyHours(e, hpd, year, month, halfDayHours);
                const totalEmpHrs = hrs.reduce((a,b)=>a+b,0);
                const absenceDays = e.day_off ? e.day_off.filter(v => v && v !== false).length : 0;
                const empHpd = e.hours_per_day_override || hpd;
                manAOA.push([e.name||'', e.team||'', empHpd, totalEmpHrs, absenceDays, ...hrs]);
            });
            const ws2 = XLSX.utils.aoa_to_sheet(manAOA);

            // Column widths for ws2
            const ws2cols = [{ wch:16 },{ wch:14 },{ wch:10 },{ wch:12 },{ wch:14 },...days.map((d,i)=>{
                const dateObj = new Date(year, month, d);
                return isWeekendDate(dateObj) ? { wch:5 } : { wch:7 };
            })];
            ws2['!cols'] = ws2cols;
            ws2['!rows'] = [{ hpt:30 }];
            ws2['!freeze'] = { xSplit:1, ySplit:1, topLeftCell:'B2', activeCell:'B2', sqref:'B2' };

            // Header style ws2
            for (let c = 0; c < manHeaderRow.length; c++) {
                const addr = cellAddr(0, c);
                if (!ws2[addr]) ws2[addr] = { t:'z', v:'' };
                const isWknd = c >= 5 && isWeekendDate(new Date(year, month, days[c-5]));
                ws2[addr].s = isWknd ? sWeekendHeader : sHeaderRow;
            }

            // Data rows ws2
            emp.forEach((e, idx) => {
                const r = idx + 1;
                const isAlt = idx % 2 === 1;
                const hrs = personMonthlyHours(e, hpd, year, month, halfDayHours);
                for (let c = 0; c < manHeaderRow.length; c++) {
                    const addr = cellAddr(r, c);
                    if (!ws2[addr]) ws2[addr] = { t:'z', v:'' };
                    const dayIdx = c - 5;
                    const isWknd = c >= 5 && isWeekendDate(new Date(year, month, days[dayIdx]));
                    const isAbsent = c >= 5 && !!dayOffValue(e, dayIdx);
                    if (isAbsent) {
                        ws2[addr].s = mkStyle({ font:{ name:'Arial', sz:10, color:{ rgb:'DC2626' } }, fill:{ patternType:'solid', fgColor:{ rgb:'FEE2E2' } }, border: BASE_BORDER });
                    } else if (isWknd) {
                        ws2[addr].s = JSON.parse(JSON.stringify(sWeekend));
                    } else {
                        const base = isAlt ? JSON.parse(JSON.stringify(sDataAlt)) : JSON.parse(JSON.stringify(sDataNormal));
                        if (c === 0) { base.alignment.horizontal = 'right'; base.font = { name:'Arial', sz:10, bold:true }; }
                        ws2[addr].s = base;
                    }
                }
            });

            ws2['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws2, 'כוח אדם');

            // ========== SHEET 3 — חלוקת משאבים ==========
            const counts = {};
            manpower.employees.forEach(e => { counts[e.team] = (counts[e.team]||0) + 1; });
            const resHeader = ['תפקיד','עובדים','שעות/יום',...dayHeaders,'סה"כ'];
            const resAOA = [resHeader];
            roles.forEach(r => {
                const hrs = roleHours[r] || new Array(numDays).fill(0);
                const empHpd = manpower.employees.find(e=>e.team===r)?.hours_per_day_override || hpd;
                resAOA.push([r, counts[r]||0, empHpd*(counts[r]||0), ...hrs, hrs.reduce((a,b)=>a+b,0)]);
            });
            // Total row
            const totalHrsPerDay = roles.reduce((acc, r) => {
                const hrs = roleHours[r] || new Array(numDays).fill(0);
                hrs.forEach((h,i)=>{ acc[i]=(acc[i]||0)+h; });
                return acc;
            }, []);
            resAOA.push(['סה"כ', manpower.employees.length, '', ...totalHrsPerDay, totalHrsPerDay.reduce((a,b)=>a+b,0)]);

            const ws3 = XLSX.utils.aoa_to_sheet(resAOA);
            ws3['!cols'] = [{ wch:16 },{ wch:10 },{ wch:12 },...days.map((d,i)=>{
                return isWeekendDate(new Date(year, month, d)) ? { wch:5 } : { wch:7 };
            }),{ wch:10 }];
            ws3['!rows'] = [{ hpt:30 }];
            ws3['!freeze'] = { xSplit:1, ySplit:1, topLeftCell:'B2', activeCell:'B2', sqref:'B2' };

            // Header ws3
            for (let c = 0; c < resHeader.length; c++) {
                const addr = cellAddr(0, c);
                if (!ws3[addr]) ws3[addr] = { t:'z', v:'' };
                const isWknd = c >= 3 && c < 3+numDays && isWeekendDate(new Date(year, month, days[c-3]));
                ws3[addr].s = isWknd ? sWeekendHeader : sHeaderRow;
            }

            // Role rows ws3
            const altColors3 = ['FFFFFF','EFF6FF','FFFFFF','EFF6FF','FFFFFF'];
            roles.forEach((r, idx) => {
                const row = idx + 1;
                const fgColor = altColors3[idx % 2] || 'FFFFFF';
                for (let c = 0; c < resHeader.length; c++) {
                    const addr = cellAddr(row, c);
                    if (!ws3[addr]) ws3[addr] = { t:'z', v:'' };
                    const isWknd = c >= 3 && c < 3+numDays && isWeekendDate(new Date(year, month, days[c-3]));
                    if (isWknd) {
                        ws3[addr].s = JSON.parse(JSON.stringify(sWeekend));
                    } else {
                        const s = mkStyle({ fill:{ patternType:'solid', fgColor:{ rgb: fgColor } }, border: BASE_BORDER });
                        if (c === 0) { s.alignment.horizontal = 'right'; s.font = { name:'Arial', sz:10, bold:true }; }
                        ws3[addr].s = s;
                    }
                }
            });
            // Total row ws3
            const totalRow3 = roles.length + 1;
            for (let c = 0; c < resHeader.length; c++) {
                const addr = cellAddr(totalRow3, c);
                if (!ws3[addr]) ws3[addr] = { t:'z', v:'' };
                ws3[addr].s = mkStyle({ font:{ name:'Arial', sz:10, bold:true }, fill:{ patternType:'solid', fgColor:{ rgb:'DBEAFE' } }, border: BASE_BORDER });
            }

            ws3['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws3, 'חלוקת משאבים');

            // ========== SHEET 4 — ספרינטים ==========
            const sprintAOA = [];
            const sprintStyleMap = []; // { row, type: 'title'|'header'|'data'|'variancePos'|'varianceNeg' }

            data.sprints.forEach(sp => {
                // Sprint name header row
                const spTitleArr = new Array(5).fill('');
                spTitleArr[0] = sp.name; spTitleArr[1] = sp.dates||'';
                sprintAOA.push(spTitleArr);
                sprintStyleMap.push({ row: sprintAOA.length-1, type:'sprintTitle', cols:5 });

                // Column header
                sprintAOA.push(['משימה','סוג','תכנון','ביצוע','חריגה']);
                sprintStyleMap.push({ row: sprintAOA.length-1, type:'header', cols:5 });

                (sp.items||[]).forEach(it => {
                    const variance = n(it.done) - n(it.plan);
                    sprintAOA.push([it.task_name||it.task||'', it.type||'', n(it.plan), n(it.done), variance]);
                    sprintStyleMap.push({ row: sprintAOA.length-1, type:'data', varianceCol:4, variance });
                });
                sprintAOA.push([]); // empty separator
                sprintStyleMap.push({ row: sprintAOA.length-1, type:'empty' });
            });

            const ws4 = XLSX.utils.aoa_to_sheet(sprintAOA);
            ws4['!cols'] = [{ wch:28 },{ wch:12 },{ wch:10 },{ wch:10 },{ wch:10 }];
            ws4['!merges'] = [];

            sprintStyleMap.forEach(info => {
                const { row, type, cols, variance, varianceCol } = info;
                if (type === 'empty') return;
                const numC = cols || 5;
                if (type === 'sprintTitle') {
                    ws4['!merges'].push({ s:{r:row,c:0}, e:{r:row,c:numC-1} });
                    for (let c = 0; c < numC; c++) {
                        const addr = cellAddr(row, c);
                        if (!ws4[addr]) ws4[addr] = { t:'z', v:'' };
                        ws4[addr].s = mkStyle({ font:{ name:'Arial', sz:11, bold:true, color:{ rgb:'FFFFFF' } }, fill:{ patternType:'solid', fgColor:{ rgb:'1E3A5F' } }, border: BASE_BORDER });
                    }
                } else if (type === 'header') {
                    for (let c = 0; c < numC; c++) {
                        const addr = cellAddr(row, c);
                        if (!ws4[addr]) ws4[addr] = { t:'z', v:'' };
                        ws4[addr].s = sHeaderRow;
                    }
                } else if (type === 'data') {
                    for (let c = 0; c < numC; c++) {
                        const addr = cellAddr(row, c);
                        if (!ws4[addr]) ws4[addr] = { t:'z', v:'' };
                        if (c === varianceCol) {
                            const vColor = (variance >= 0) ? '065F46' : 'DC2626';
                            ws4[addr].s = mkStyle({ font:{ name:'Arial', sz:10, bold:true, color:{ rgb:'FFFFFF' } }, fill:{ patternType:'solid', fgColor:{ rgb: vColor } }, border: BASE_BORDER });
                        } else {
                            ws4[addr].s = JSON.parse(JSON.stringify(sDataNormal));
                            if (c === 0) { ws4[addr].s.alignment.horizontal = 'right'; }
                        }
                    }
                }
            });

            ws4['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws4, 'ספרינטים');

            // ========== SHEET 5 — סיכום + Pivot ==========
            const totalPlannedHrs = tasks.reduce((a,t)=>a+n(t.planned),0);
            const totalGap        = totalAvail - totalPlannedHrs;
            const empCount        = manpower.employees.length;

            // Summary card: KPI pairs
            const summaryData = [
                [titleLabel, ''],
                ['נתון', 'ערך'],
                ['חודש', `${MONTH_NAMES[month]} ${year}`],
                ['סה"כ משימות', tasks.length],
                ['שעות זמינות', totalAvail],
                ['שעות מתוכננות', totalPlannedHrs],
                ['פער', totalGap],
                ['מספר עובדים', empCount],
                ['',''],
            ];

            // Pivot: task types × owners
            const taskTypes  = [...new Set(tasks.map(t=>t.type||'ללא סוג'))];
            const taskOwners = [...new Set(tasks.map(t=>t.owner||'ללא בעלים'))];
            const pivotHeaderRow = ['סוג / מוביל', ...taskOwners, 'סה"כ'];
            summaryData.push(pivotHeaderRow);
            taskTypes.forEach(tp => {
                const pivotRow = [tp];
                let rowTotal = 0;
                taskOwners.forEach(ow => {
                    const hrs = tasks.filter(t=>(t.type||'ללא סוג')===tp && (t.owner||'ללא בעלים')===ow).reduce((a,t)=>a+n(t.planned),0);
                    pivotRow.push(hrs);
                    rowTotal += hrs;
                });
                pivotRow.push(rowTotal);
                summaryData.push(pivotRow);
            });
            // Pivot totals row
            const pivotTotRow = ['סה"כ'];
            taskOwners.forEach(ow => {
                pivotTotRow.push(tasks.filter(t=>(t.owner||'ללא בעלים')===ow).reduce((a,t)=>a+n(t.planned),0));
            });
            pivotTotRow.push(totalPlannedHrs);
            summaryData.push(pivotTotRow);

            const ws5 = XLSX.utils.aoa_to_sheet(summaryData);
            ws5['!cols'] = [{ wch:24 },{ wch:14 },...taskOwners.map(()=>({ wch:14 })),{ wch:12 }];
            ws5['!rows'] = [{ hpt:22 }, { hpt:28 }];
            ws5['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:1+taskOwners.length} }];

            // Title row style
            applyRangeStyle(ws5, 0, 0, 0, 1+taskOwners.length, sTitleRow);

            // KPI header row (row 1)
            for (let c = 0; c < 2; c++) {
                const addr = cellAddr(1, c);
                if (!ws5[addr]) ws5[addr] = { t:'z', v:'' };
                ws5[addr].s = sHeaderRow;
            }
            // KPI data rows (rows 2-8)
            const kpiStart = 2; const kpiEnd = 8;
            for (let r = kpiStart; r <= kpiEnd; r++) {
                const addrLabel = cellAddr(r, 0);
                const addrVal   = cellAddr(r, 1);
                if (!ws5[addrLabel]) ws5[addrLabel] = { t:'z', v:'' };
                if (!ws5[addrVal])   ws5[addrVal]   = { t:'z', v:'' };
                const isGap = r === kpiStart + 4; // פער row
                const gapVal = ws5[addrVal].v;
                ws5[addrLabel].s = mkStyle({ font:{ name:'Arial', sz:10, bold:true }, alignment:{ horizontal:'right', vertical:'center', readingOrder:2 }, fill:{ patternType:'solid', fgColor:{ rgb: r%2===0?'F8FAFC':'FFFFFF' } }, border: BASE_BORDER });
                ws5[addrVal].s   = mkStyle({ font:{ name:'Arial', sz:10, bold: isGap, color:{ rgb: isGap ? (n(gapVal)>=0?'065F46':'DC2626') : '111827' } }, fill:{ patternType:'solid', fgColor:{ rgb: r%2===0?'F8FAFC':'FFFFFF' } }, border: BASE_BORDER });
            }

            // Pivot starts at row 9 (summaryData index 9 = pivotHeaderRow)
            const pivotStartRow = 9;
            // Pivot header
            for (let c = 0; c < pivotHeaderRow.length; c++) {
                const addr = cellAddr(pivotStartRow, c);
                if (!ws5[addr]) ws5[addr] = { t:'z', v:'' };
                ws5[addr].s = sHeaderRow;
            }
            // Pivot data rows
            taskTypes.forEach((tp, idx) => {
                const r = pivotStartRow + 1 + idx;
                const isAlt = idx % 2 === 1;
                for (let c = 0; c < pivotHeaderRow.length; c++) {
                    const addr = cellAddr(r, c);
                    if (!ws5[addr]) ws5[addr] = { t:'z', v:'' };
                    const s = isAlt ? JSON.parse(JSON.stringify(sDataAlt)) : JSON.parse(JSON.stringify(sDataNormal));
                    if (c === 0) { s.alignment.horizontal = 'right'; s.font = { name:'Arial', sz:10, bold:true }; }
                    ws5[addr].s = s;
                }
            });
            // Pivot totals row
            const pivotTotRowIdx = pivotStartRow + 1 + taskTypes.length;
            for (let c = 0; c < pivotHeaderRow.length; c++) {
                const addr = cellAddr(pivotTotRowIdx, c);
                if (!ws5[addr]) ws5[addr] = { t:'z', v:'' };
                ws5[addr].s = mkStyle({ font:{ name:'Arial', sz:10, bold:true }, fill:{ patternType:'solid', fgColor:{ rgb:'DBEAFE' } }, border: BASE_BORDER });
            }

            ws5['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws5, 'סיכום + Pivot');

            // ========== WRITE FILE ==========
            XLSX.writeFile(wb, `${meta.title} – ${MONTH_NAMES[month]} ${year}.xlsx`);
        }

        async function importFromExcel(file, dispatch, currentData) {
            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type:'array' });
            const tasksSheet = wb.SheetNames.find(n => n.includes('תוכנית'));
            if (!tasksSheet) { Swal.fire({ title: 'שגיאה', text: 'לא נמצא גיליון תוכנית עבודה', icon: 'error', confirmButtonText: 'סגור' }); return; }
            const s = wb.Sheets[tasksSheet];
            const rows = XLSX.utils.sheet_to_json(s, { header:1, defval:'' });
            const tasks = [];
            const numDays = daysInMonth(currentData.meta.year, currentData.meta.month);
            for (let i = 2; i < rows.length; i++) {
                const r = rows[i];
                if (!r[0] || String(r[0]).startsWith('סה') || String(r[0]).startsWith('הפרש') || String(r[0]).includes('זמינים')) continue;
                const days = [];
                for (let j = 4; j < 4+numDays; j++) days.push(n(r[j]));
                tasks.push({ name:r[0]||'', owner:r[1]||'', type:r[2]||'', planned:n(r[3]), days, notes:r[4+numDays+1]||'' });
            }
            if (tasks.length) {
                dispatch({ type:'LOAD_ALL', payload:{ ...currentData, tasks } });
                Swal.fire({ title: 'ייבוא הצליח', text: `יובאו ${tasks.length} משימות`, icon: 'success', confirmButtonText: 'סגור' });
            } else { Swal.fire({ title: 'לא נמצאו נתונים', icon: 'error', confirmButtonText: 'סגור' }); }
        }

        // ========== API helpers ==========
        function stateToPayload(data) {
            const days = data.tasks[0]?.days?.length || daysInMonth(data.meta.year, data.meta.month);
            return {
                gantt: {
                    name: data.meta?.title,
                    year: data.meta?.year || null,
                    month: data.meta?.month ?? null,
                    hours_per_day: data.manpower?.hours_per_day || 8.5,
                    workdays_base: { taskTypes: data.taskTypes || DEFAULT_TASK_TYPES, taskStatuses: data.taskStatuses || TASK_STATUSES },
                },
                roles: (data.roles || []).map((name, i) => ({ name, sort_order: i })),
                employees: (data.manpower?.employees || []).map((e, i) => ({
                    name: e.name, team: e.team,
                    vacation_json: null,
                    hours_override_json: null,
                    workdays_json: null,
                    day_off_json: e.day_off || null,
                    hours_per_day_override: e.hours_per_day_override || 0,
                    sort_order: i,
                })),
                tasks: (data.tasks || []).map((t, i) => ({
                    name: t.name, task_number: t.task_number || '', owner: JSON.stringify(t.owners || []), type: t.type || '',
                    planned: String(t.planned ?? '0'),
                    months_json: null, days_json: t.days || null,
                    notes: t.notes || '', status: t.status || 'pending',
                    start_day: t.start_day ?? null, sort_order: i,
                })),
                sprints: (data.sprints || []).map((s, i) => ({
                    name: s.name, dates: s.dates || '', sort_order: i,
                    items: (s.items || []).map((it, j) => ({
                        task_name: it.task_name || '', type: it.type || '',
                        plan: Number(it.plan || 0), done: Number(it.done || 0), sort_order: j,
                    })),
                })),
            };
        }

        function apiStateToAppState(api) {
            const meta_month = api.month ?? new Date().getMonth();
            const meta_year  = api.year  ?? new Date().getFullYear();
            const dayCount   = daysInMonth(meta_year, meta_month);
            return {
                meta: { title: api.name || 'תוכנית חודשית', month: meta_month, year: meta_year },
                manpower: {
                    hours_per_day: api.hours_per_day || 8.5,
                    employees: (api.employees || []).map(e => ({
                        name: e.name, team: e.team,
                        day_off: e.day_off_json || new Array(dayCount).fill(false),
                        hours_per_day_override: e.hours_per_day_override || 0,
                    })),
                },
                tasks: (api.tasks || []).map(t => ({
                    name: t.name,
                    task_number: t.task_number || '',
                    owners: (() => { try { const v = JSON.parse(t.owner||'[]'); return Array.isArray(v) ? v : []; } catch { return t.owner ? [t.owner] : []; } })(),
                    type: t.type || '',
                    planned: t.planned || '0',
                    days: t.days_json || new Array(dayCount).fill(0),
                    notes: t.notes || '',
                    status: t.status || 'pending',
                    start_day: t.start_day ?? null,
                })),
                roles: (() => { const r = (api.roles || []).map(r => r.name === 'QA' ? 'בודק' : r.name); return r.length ? r : DEFAULT_ROLES; })(),
                taskTypes: (api.workdays_base && api.workdays_base.taskTypes) ? api.workdays_base.taskTypes : (Array.isArray(api.workdays_base) ? api.workdays_base : DEFAULT_TASK_TYPES),
                taskStatuses: (api.workdays_base && api.workdays_base.taskStatuses) ? api.workdays_base.taskStatuses : TASK_STATUSES,
                sprints: (api.sprints || []).map(s => ({
                    name: s.name, dates: s.dates || '',
                    items: (s.items || []).map(it => ({
                        task_name: it.task_name || '', type: it.type || '',
                        plan: it.plan || 0, done: it.done || 0,
                    })),
                })),
            };
        }

        // ========== APP ==========
        function App() {
            const [data, dispatch] = useReducer(reducer, EMPTY_STATE);
            const [loaded, setLoaded] = useState(false);
            const isNewGantt = new URLSearchParams(location.search).get('new') === '1';
            const [screen, setScreen] = useState(() => isNewGantt ? 'settings' : (localStorage.getItem('wg_monthly_screen') || 'dashboard'));
            const settingsDirtyRef = useRef(false);
            useEffect(() => { localStorage.setItem('wg_monthly_screen', screen); }, [screen]);
            const saveTimer = useRef(null);

            async function navigateTo(target) {
                if (screen === 'settings' && settingsDirtyRef.current) {
                    const res = await Swal.fire({ title:'יש שינויים שלא נשמרו', text:'האם לצאת מההגדרות מבלי לשמור?', icon:'warning', showCancelButton:true, confirmButtonText:'צא ללא שמירה', cancelButtonText:'הישאר', reverseButtons:true });
                    if (!res.isConfirmed) return;
                }
                setScreen(target);
            }
            const isViewer = (() => { try { const a = getAuth(); const u = a && a.getUser(); return u?.role === 'viewer'; } catch { return false; } })();

            function loadGantt() {
                if (!ganttId) { setLoaded(true); return; }
                apiFetch(`${API_BASE}/gantts/${ganttId}`)
                    .then(r => r.json())
                    .then(api => {
                        if (api && api.id) {
                            dispatch({ type: 'LOAD_ALL', payload: apiStateToAppState(api) });
                            setLoaded(true);
                        }
                    })
                    .catch(() => {});
            }

            useEffect(() => {
                window.__wgOnLogin = () => { setLoaded(false); loadGantt(); };
                if (localStorage.getItem('wg_access_token')) loadGantt();
                else setLoaded(true);
                return () => { window.__wgOnLogin = null; };
            }, []);

            useEffect(() => {
                if (!loaded || !ganttId || isViewer) return;
                if (saveTimer.current) clearTimeout(saveTimer.current);
                saveTimer.current = setTimeout(() => {
                    apiFetch(`${API_BASE}/gantts/${ganttId}/state`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(stateToPayload(data)),
                    }).catch(console.error);
                }, 800);
            }, [data, loaded]);

            if (!loaded) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:16,color:'#64748b'}}>טוען...</div>;

            const titles = {
                dashboard: { title:'דשבורד', sub:'סקירה כללית של החודש הנוכחי.' },
                tasks: { title:'תוכנית עבודה', sub:'ניהול משימות לפי ימים בחודש.' },
                manpower: { title:'כוח אדם', sub:'עובדים, חופש / מחלה ושעות זמינות.' },
                resources: { title:'חלוקת משאבים', sub:'שעות זמינות לפי תפקיד ויום (מחושב).' },
                sprints: { title:'ספרינטים', sub:'מעקב תכנון מול ביצוע.' },
                help: { title:'עזרה', sub:'מפת נתונים ונוסחאות.' },
                settings: { title:'הגדרות גאנט', sub:'שם, שעות עבודה, תפקידים וסוגי משימות.' },
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    <Sidebar current={screen} onSelect={navigateTo} meta={data.meta} />
                    <main className={`flex-1 min-w-0 overflow-y-auto${isViewer ? ' wg-readonly' : ''}`}>
                        {isViewer && <div style={{background:'linear-gradient(90deg,#f59e0b,#f97316)',color:'#fff',padding:'6px 20px',fontSize:13,fontWeight:700,textAlign:'center',letterSpacing:'.02em'}}>מצב צפייה בלבד — אין לך הרשאות עריכה</div>}
                        {screen !== 'settings' && (
                            <Header
                                title={titles[screen].title}
                                subtitle={titles[screen].sub}
                                meta={data.meta}
                                dispatch={dispatch}
                                onExport={() => exportToExcel(data)}
                                onImport={isViewer ? null : f => importFromExcel(f, dispatch, data)}
                                onReset={isViewer ? null : async () => { const r = await Swal.fire({ title: 'לאפס את כל הנתונים?', text: 'הפעולה תמחק את כל המשימות, העובדים והספרינטים', icon: 'warning', showCancelButton: true, confirmButtonText: 'אפס', cancelButtonText: 'ביטול', reverseButtons: true }); if (r.isConfirmed) dispatch({ type:'LOAD_ALL', payload:EMPTY_STATE }); }}
                            />
                        )}
                        {screen === 'settings' && (
                            <div className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200 no-print px-6 py-3">
                                <h1 className="text-xl font-bold text-slate-900">{titles.settings.title}</h1>
                                <p className="text-sm text-slate-500 mt-0.5">{titles.settings.sub}</p>
                            </div>
                        )}
                        {screen==='dashboard' && <Dashboard data={data} />}
                        {screen==='tasks' && <TasksScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} />}
                        {screen==='manpower' && <ManpowerScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} />}
                        {screen==='resources' && <ResourcesScreen data={data} />}
                        {screen==='sprints' && <SprintsScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} />}
                        {screen==='help' && <HelpScreen />}
                        {screen==='settings' && <SettingsScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} onDirtyChange={v => { settingsDirtyRef.current = v; }} />}
                    </main>
                </div>
            );
        }

        const bootEl = document.getElementById('boot-screen');
        if (bootEl && bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
        if (window.__bootStatus) window.__bootStatus('מרנדר...');
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
<div id="tt-portal"></div>
<script src="/version-check.js"></script>
</body>
</html>
