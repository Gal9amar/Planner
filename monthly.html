        function Dashboard({ data }) {
            const { meta, manpower, tasks, roles } = data;
            const { year, month } = meta;
            const hpd = manpower.hours_per_day;
            const days = buildDays(year, month);
            const numDays = days.length;
            const primaryRole = getPrimaryRole(data);

            const halfDayHours = manpower.half_day_hours || 4.5;
            const roleHours = useMemo(() => roleHoursByDay(manpower.employees, hpd, year, month, roles, halfDayHours), [manpower, year, month, roles]);
            const primaryAvail = roleHours[primaryRole] || new Array(numDays).fill(0);
            const taskDaily = useMemo(() => tasksDailyTotal(tasks, numDays), [tasks, numDays]);
            const diff = primaryAvail.map((a,i) => a - taskDaily[i]);

            const totalAssigned = taskDaily.reduce((a,b) => a+b, 0);
            const totalAvail = primaryAvail.reduce((a,b) => a+b, 0);
            const utilizationPct = totalAvail ? (totalAssigned / totalAvail * 100) : 0;
            const overloadDays = diff.filter((d,i) => !isWeekend(year,month,days[i]) && d < 0).length;

            // working days in month
            const workingDays = days.filter(d => !isWeekend(year, month, d)).length;

            // weekly buckets for bar chart (groups of 7 days)
            const weekLabels = [], weekAvail = [], weekAssigned = [];
            for (let i = 0; i < numDays; i += 7) {
                const label = `${days[i]}–${days[Math.min(i+6, numDays-1)]}`;
                weekLabels.push(label);
                weekAvail.push(primaryAvail.slice(i, i+7).reduce((a,b)=>a+b,0));
                weekAssigned.push(taskDaily.slice(i, i+7).reduce((a,b)=>a+b,0));
            }

            const capacityChartRef = useChart(() => ({
                type: 'bar',
                data: { labels: weekLabels, datasets: [
                    { label: `שעות ${primaryRole} זמינות`, data: weekAvail, backgroundColor: 'rgba(16,185,129,.7)', borderRadius: 6 },
                    { label: 'שעות משובצות', data: weekAssigned, backgroundColor: 'rgba(239,68,68,.7)', borderRadius: 6 },
                ]},
                options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'top', rtl:true, labels:{ font:{ family:'Heebo' } } } }, scales:{ x:{ ticks:{ font:{ family:'Heebo' } } }, y:{ ticks:{ font:{ family:'Heebo' } } } } }
            }), [data]);

            const diffChartRef = useChart(() => ({
                type: 'line',
                data: { labels: days.map(String), datasets: [{ label:'הפרש יומי (זמין−משובץ)', data: diff, tension:.3, fill:true, borderColor:'#10b981', backgroundColor:'rgba(16,185,129,.1)', pointBackgroundColor: diff.map((d,i) => isWeekend(year,month,days[i]) ? '#e2e8f0' : d < 0 ? '#ef4444' : '#10b981'), pointRadius:3 }] },
                options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'top', rtl:true, labels:{ font:{ family:'Heebo' } } } }, scales:{ x:{ ticks:{ font:{ family:'Heebo' }, maxRotation:0, autoSkip:true, maxTicksLimit:16 } }, y:{ ticks:{ font:{ family:'Heebo' } } } } }
            }), [data]);

            const typeAggregate = useMemo(() => {
                const agg = {};
                tasks.forEach(t => { const key = t.type||'לא מוגדר'; agg[key] = (agg[key]||0) + taskRowSum(t); });
                return agg;
            }, [tasks]);
            const typeChartRef = useChart(() => ({
                type: 'doughnut',
                data: { labels: Object.keys(typeAggregate), datasets: [{ data: Object.values(typeAggregate), backgroundColor: Object.keys(typeAggregate).map(k => TASK_TYPE_COLORS[k]||'#94a3b8'), borderWidth:2, borderColor:'#fff' }] },
                options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', rtl:true, labels:{ font:{ family:'Heebo' } } } } }
            }), [data]);

            const roleChartRef = useChart(() => {
                const totals = Object.keys(roleHours).map(r => ({ r, total: roleHours[r].reduce((a,b)=>a+b,0) })).filter(x => x.total > 0).sort((a,b) => b.total-a.total);
                return { type:'bar', data:{ labels: totals.map(t=>t.r), datasets:[{ label:'שעות זמינות חודשיות', data:totals.map(t=>t.total), backgroundColor:'#8b5cf6', borderRadius:6 }] }, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ x:{ ticks:{ font:{ family:'Heebo' } } }, y:{ ticks:{ font:{ family:'Heebo' } } } } } };
            }, [data]);

            function exportSummaryHTML() {
                const MONTH_NAMES_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
                const monthLabel = `${MONTH_NAMES_HE[month]} ${year}`;
                const taskStatuses = data.taskStatuses || TASK_STATUSES;
                const statusLabel = v => (taskStatuses.find(s=>s.value===v)||{label:v||'ממתין'}).label;
                const statusColor = v => (taskStatuses.find(s=>s.value===v)||{bg:'#f1f5f9',color:'#475569'});
                const taskRows = tasks.map(t => {
                    const assigned = taskRowSum(t);
                    const sc = statusColor(t.status);
                    return `<tr>
                        <td>${t.name||'—'}</td>
                        <td>${(t.owners||[]).join(', ')||'—'}</td>
                        <td>${t.type||'—'}</td>
                        <td style="text-align:center">${fmt(n(t.planned))}</td>
                        <td style="text-align:center">${fmt(assigned)}</td>
                        <td style="text-align:center"><span style="background:${sc.bg};color:${sc.color||sc.text||'#333'};padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600">${statusLabel(t.status)}</span></td>
                        <td>${t.notes||''}</td>
                    </tr>`;
                }).join('');
                const empRows = manpower.employees.map(e => {
                    const avail = (roleHours[e.team]||[]).reduce((a,b)=>a+n(b),0);
                    return `<tr><td>${e.name}</td><td>${e.team}</td><td style="text-align:center">${fmt(avail)}</td></tr>`;
                }).join('');
                const typeRows = Object.entries(typeAggregate).map(([type,hrs]) =>
                    `<tr><td>${type}</td><td style="text-align:center">${fmt(hrs)}</td></tr>`
                ).join('');
                const html = `<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>סיכום חודשי – ${meta.title||''} – ${monthLabel}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; color: #0f172a; direction: rtl; padding: 32px; }
  .page { max-width: 1100px; margin: 0 auto; }
  .header { background: linear-gradient(135deg,#10b981,#059669); color: #fff; border-radius: 20px; padding: 28px 36px; margin-bottom: 28px; }
  .header h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  .header p { font-size: 14px; opacity: .85; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 28px; }
  .kpi { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
  .kpi .lbl { font-size: 11px; color: #64748b; font-weight: 600; margin-bottom: 6px; }
  .kpi .val { font-size: 30px; font-weight: 800; line-height: 1; }
  .kpi .sub { font-size: 12px; color: #94a3b8; margin-top: 5px; }
  .section { background: #fff; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
  .section h2 { font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1.5px solid #f1f5f9; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f8fafc; color: #64748b; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 10px 12px; text-align: right; border-bottom: 1.5px solid #e2e8f0; }
  td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }
  .footer { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 32px; }
  @media print { body { background: #fff; padding: 0; } .page { max-width: 100%; } }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>📅 ${meta.title||'גאנט חודשי'}</h1>
    <p>${monthLabel} &nbsp;|&nbsp; ${workingDays} ימי עבודה &nbsp;|&nbsp; הופק: ${new Date().toLocaleDateString('he-IL')}</p>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="lbl">סה״כ משימות</div><div class="val" style="color:#1d4ed8">${tasks.length}</div></div>
    <div class="kpi"><div class="lbl">שעות ${primaryRole} זמינות</div><div class="val" style="color:#059669">${fmt(totalAvail)}</div><div class="sub">ניצול ${utilizationPct.toFixed(1)}%</div></div>
    <div class="kpi"><div class="lbl">שעות משובצות</div><div class="val" style="color:#d97706">${fmt(totalAssigned)}</div></div>
    <div class="kpi"><div class="lbl">ימי עומס יתר</div><div class="val" style="color:${overloadDays>0?'#dc2626':'#059669'}">${overloadDays}</div><div class="sub">מתוך ${workingDays} ימי עבודה</div></div>
  </div>

  <div class="section">
    <h2>✅ רשימת משימות</h2>
    <table>
      <thead><tr><th>שם משימה</th><th>מובילים</th><th>סוג</th><th style="text-align:center">תכנון (ש׳)</th><th style="text-align:center">שיבוץ (ש׳)</th><th style="text-align:center">סטטוס</th><th>הערות</th></tr></thead>
      <tbody>${taskRows}</tbody>
    </table>
  </div>

  <div class="section" style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
    <div>
      <h2>👥 כוח אדם</h2>
      <table>
        <thead><tr><th>שם</th><th>תפקיד</th><th style="text-align:center">שעות זמינות</th></tr></thead>
        <tbody>${empRows}</tbody>
      </table>
    </div>
    <div>
      <h2>📊 שעות לפי סוג משימה</h2>
      <table>
        <thead><tr><th>סוג</th><th style="text-align:center">שעות</th></tr></thead>
        <tbody>${typeRows}</tbody>
      </table>
    </div>
  </div>

  <div class="footer">Planner • הופק ב-${new Date().toLocaleString('he-IL')}</div>
</div>
</body></html>`;
                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${meta.title||'חודשי'} – ${monthLabel} – סיכום.html`;
                a.click();
                URL.revokeObjectURL(a.href);
            }

            return (
                <div className="p-6 space-y-6">
                    <div style={{ display:'flex', justifyContent:'flex-start', marginBottom:4 }}>
                        <button onClick={exportSummaryHTML} style={{ display:'inline-flex', alignItems:'center', gap:8, padding:'9px 20px', background:'linear-gradient(135deg,#10b981,#059669)', color:'#fff', border:'none', borderRadius:12, fontWeight:700, fontSize:14, fontFamily:'inherit', cursor:'pointer', boxShadow:'0 2px 12px rgba(16,185,129,0.3)' }}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            ייצא סיכום HTML
                        </button>
                    </div>
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard label="סה״כ משימות" value={tasks.length} color="blue" />
                        <StatCard label={`שעות ${primaryRole} זמינות`} value={fmt(totalAvail)} color="green" sub={`ניצול: ${utilizationPct.toFixed(1)}%`} />
                        <StatCard label="שעות משובצות" value={fmt(totalAssigned)} color="amber" />
                        <StatCard label="ימי עומס יתר" value={overloadDays} color={overloadDays ? 'red':'slate'} sub={`מתוך ${workingDays} ימי עבודה`} />
                    </div>
                    {tasks.length === 0 ? (
                        <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-12 text-center text-slate-400">
                            <Icon name="list" className="w-10 h-10 mx-auto mb-3 opacity-40" />
                            <div className="font-semibold text-lg">אין משימות עדיין</div>
                            <div className="text-sm mt-1">עבור ל"תוכנית עבודה" והוסף משימות</div>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <ChartBox title="יכולת מול שיבוץ – שבועי" hint="סיכום שבועי של שעות זמינות לעומת שיבוץ.">
                                <div className="h-72"><canvas ref={capacityChartRef}></canvas></div>
                            </ChartBox>
                            <ChartBox title="הפרש יומי (עודף/חסר)" hint="ירוק = עודף. אדום = חסר. ימי שישי/שבת לא נכללים.">
                                <div className="h-72"><canvas ref={diffChartRef}></canvas></div>
                            </ChartBox>
                            <ChartBox title="התפלגות משימות לפי סוג">
                                <div className="h-72"><canvas ref={typeChartRef}></canvas></div>
                            </ChartBox>
                            <ChartBox title="שעות זמינות לפי תפקיד">
                                <div className="h-72"><canvas ref={roleChartRef}></canvas></div>
                            </ChartBox>
                        </div>
                    )}
                </div>
            );
        }

        // ========== TASKS SCREEN ==========
        function TasksScreen({ data, dispatch }) {
            const { show: showToast, Toast } = useToast();
            const { meta, manpower, tasks, roles, taskTypes=DEFAULT_TASK_TYPES, taskStatuses=TASK_STATUSES } = data;
            const { year, month } = meta;
            const hpd = manpower.hours_per_day;
            const halfDayHours = manpower.half_day_hours || 4.5;
            const days = buildDays(year, month);
            const numDays = days.length;
            const primaryRole = getPrimaryRole(data);

            const roleHours = useMemo(() => roleHoursByDay(manpower.employees, hpd, year, month, roles, halfDayHours), [manpower, year, month, roles]);
            const avail = roleHours[primaryRole] || new Array(numDays).fill(0);
            const totals = tasksDailyTotal(tasks, numDays);
            const diff = avail.map((a,i) => a - totals[i]);
            const totalPlanned = useMemo(() => tasks.reduce((a,t) => a + n(t.planned), 0), [tasks]);
            const totalAssigned = totals.reduce((a,b) => a+b, 0);
            const planVsAssign = totalPlanned - totalAssigned;

            const [colW, setColW] = useColWidths(MONTHLY_COL_DEFAULTS, LS_KEY_MONTHLY);
            const [filter, setFilter] = useState('');
            const [typeFilter, setTypeFilter] = useState('');
            const [showImportModal, setShowImportModal] = useState(false);
            const [showJiraModal, setShowJiraModal] = useState(false);
            const filtered = tasks.map((t,idx) => ({ ...t, idx })).filter(t => {
                if (filter && !t.name.toLowerCase().includes(filter.toLowerCase()) && !(t.task_number||'').toLowerCase().includes(filter.toLowerCase())) return false;
                if (typeFilter && t.type !== typeFilter) return false;
                return true;
            });
            const taskDragSrc = useRef(null);
            const [taskDragOver, setTaskDragOver] = useState(null);
            function onTaskDragStart(e, realIdx) { taskDragSrc.current = realIdx; e.dataTransfer.effectAllowed = 'move'; }
            function onTaskDragOver(e, realIdx) { e.preventDefault(); setTaskDragOver(realIdx); }
            function onTaskDrop(e, realIdx) {
                e.preventDefault();
                const src = taskDragSrc.current;
                if (src === null || src === realIdx) { taskDragSrc.current = null; setTaskDragOver(null); return; }
                dispatch({ type: 'REORDER_TASKS', fromIdx: src, toIdx: realIdx });
                taskDragSrc.current = null;
                setTaskDragOver(null);
            }
            function onTaskDragEnd() { taskDragSrc.current = null; setTaskDragOver(null); }

            function handleImportTasks(items) {
                let skipped = 0;
                items.forEach(entry => {
                    if (typeof entry === 'string') {
                        const exists = tasks.some(t => (t.name||'').trim().toLowerCase() === entry.trim().toLowerCase());
                        if (!exists) dispatch({ type:'ADD_TASK', importedName: entry });
                        else skipped++;
                    } else if (entry && typeof entry === 'object' && entry.action) {
                        const { action, item } = entry;
                        if (action === 'replace') {
                            dispatch({ type:'REPLACE_TASK_BY_KEY', key: item.key, name: item.name, status: item.status });
                        } else {
                            dispatch({ type:'ADD_TASK', importedName: item.name, importedKey: item.key, importedStatus: item.status });
                        }
                    }
                });
                if (skipped > 0) showToast(`${skipped} משימות לא יובאו כי קיימות כבר`);
                setShowImportModal(false);
                setShowJiraModal(false);
            }

            return (
                <div className="p-6 space-y-4">
                    <Toast />
                    {showImportModal && (
                        <ImportTasksModal
                            existingTaskNames={tasks.map(t => t.name || '')}
                            onImport={handleImportTasks}
                            onClose={() => setShowImportModal(false)}
                        />
                    )}
                    {showJiraModal && (
                        <ImportJiraModal
                            existingTasks={tasks}
                            onImport={handleImportTasks}
                            onClose={() => setShowJiraModal(false)}
                        />
                    )}
                    <div className="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap gap-3 items-center justify-start">
                        <button onClick={() => {
                            if (tasks.some(t => !t.name || t.name.trim() === '')) {
                                showToast('יש למלא שם למשימה הפתוחה לפני הוספת משימה חדשה');
                                return;
                            }
                            dispatch({ type:'ADD_TASK' });
                        }} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">
                            <Icon name="plus" className="w-4 h-4" /> משימה חדשה
                        </button>
                        <button onClick={() => setShowImportModal(true)}
                                className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium">
                            <Icon name="download" className="w-4 h-4" /> ייבא משימה
                        </button>
                        <button onClick={() => setShowJiraModal(true)}
                                className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium">
                            <Icon name="download" className="w-4 h-4" /> ייבא משימות Jira
                        </button>
                        <input placeholder="חיפוש משימה..." value={filter} onChange={e => setFilter(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-lg text-sm min-w-52" />
                        <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-lg text-sm">
                            <option value="">כל הסוגים</option>
                            {taskTypes.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div className="scroll-x">
                            <table className="text-sm w-full">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-600 border-b border-slate-200">
                                        <th style={{width:20,minWidth:20,maxWidth:20}}></th>
                                        <ResizableTh colKey="task"     widths={colW} setWidth={setColW} className="p-2 text-right sticky-col bg-slate-50" style={{position:'sticky',right:0,zIndex:3}}>משימה</ResizableTh>
                                        <ResizableTh colKey="taskNum"  widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">מס׳ משימה</ResizableTh>
                                        <ResizableTh colKey="status"   widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">סטטוס</ResizableTh>
                                        <ResizableTh colKey="owners"   widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">מוביל</ResizableTh>
                                        <ResizableTh colKey="type"     widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">סוג משימה</ResizableTh>
                                        <ResizableTh colKey="startDay" widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">יום התחלה <InfoIcon text="יום בחודש שממנו מתחילה המשימה. ימים לפני כן יוצאלו." /></ResizableTh>
                                        <ResizableTh colKey="planned"  widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">תכנון <InfoIcon text="אומדן שעות כולל לחודש זה." /></ResizableTh>
                                        {days.map(d => <DayHeader key={d} day={d} year={year} month={month} />)}
                                        <ResizableTh colKey="progress" widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50 sticky-col-left" style={{position:'sticky',left:0,zIndex:3}}>התקדמות <InfoIcon text="שובץ מתוך תוכנן. אדום = חסר/עודף, ירוק = מדויק." /></ResizableTh>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.map(t => {
                                        const rowSum = taskRowSum(t);
                                        const isMatch = t.planned > 0 && n(rowSum) === n(t.planned);
                                        const startDay = t.start_day ? Number(t.start_day) : null;
                                        return (
                                            <tr key={t.idx}
                                                onDragOver={e => onTaskDragOver(e, t.idx)}
                                                onDrop={e => onTaskDrop(e, t.idx)}
                                                onDragEnd={onTaskDragEnd}
                                                className={cls('border-b border-slate-100 hover:bg-slate-50', taskDragOver === t.idx && 'outline outline-2 outline-indigo-400')}>
                                                <td draggable onDragStart={e => { e.stopPropagation(); onTaskDragStart(e, t.idx); }} style={{width:20,minWidth:20,maxWidth:20,textAlign:'center',verticalAlign:'middle',color:'#94a3b8',fontSize:14,userSelect:'none',cursor:'grab'}} title="גרור להזזה">⠿</td>
                                                <td className="p-1 sticky-col" style={{ width: colW.task, minWidth: colW.task, maxWidth: colW.task, overflow:'hidden', background: '#ffffff' }}>
                                                    <TextCell value={t.name} onChange={v => dispatch({ type:'SET_TASK_FIELD', idx:t.idx, field:'name', value:v })} className="font-medium text-slate-800" required autoFocusOnMount={!!t._newlyAdded} />
                                                </td>
                                                <td className="p-1 text-center" style={{ width: colW.taskNum, minWidth: colW.taskNum, maxWidth: colW.taskNum, overflow:'hidden' }}>
                                                    <input type="text" value={t.task_number||''} placeholder="CUS-200" onChange={e => dispatch({ type:'SET_TASK_FIELD', idx:t.idx, field:'task_number', value:e.target.value })} className="cell-input text-xs text-center w-full" />
                                                </td>
                                                <td className="p-1" style={{ width: colW.status, minWidth: colW.status, maxWidth: colW.status, overflow:'hidden' }}>
                                                    <StatusCell value={t.status||'pending'} onChange={v => dispatch({ type:'SET_TASK_FIELD', idx:t.idx, field:'status', value:v })} taskStatuses={taskStatuses} />
                                                </td>
                                                <td className="p-1" style={{ width: colW.owners, minWidth: colW.owners, maxWidth: colW.owners, overflow:'hidden' }}><OwnersCell owners={t.owners||[]} employees={manpower.employees} onChange={v => dispatch({ type:'SET_TASK_FIELD', idx:t.idx, field:'owners', value:v })} /></td>
                                                <td className="p-1" style={{ width: colW.type, minWidth: colW.type, maxWidth: colW.type, overflow:'hidden' }}><TypeSelectCell value={t.type} taskTypes={taskTypes} dispatch={dispatch} onChange={v => dispatch({ type:'SET_TASK_FIELD', idx:t.idx, field:'type', value:v })} /></td>
                                                <td className="p-1 text-center" style={{ width: colW.startDay, minWidth: colW.startDay, maxWidth: colW.startDay, overflow:'hidden' }}>
                                                    <select value={startDay ?? ''} className="cell-input no-spin text-xs text-center w-full"
                                                        onChange={e => dispatch({ type:'SET_TASK_FIELD', idx:t.idx, field:'start_day', value:e.target.value === '' ? null : Number(e.target.value) })}>
                                                        <option value="">—</option>
                                                        {days.filter(d => !isWeekend(year,month,d)).map(d => {
                                                            return <option key={d} value={d}>{d}/{month+1}</option>;
                                                        })}
                                                    </select>
                                                </td>
                                                <td className="p-1" style={{ width: colW.planned, minWidth: colW.planned, maxWidth: colW.planned, overflow:'hidden' }}><NumberCell value={t.planned} onChange={v => dispatch({ type:'SET_TASK_FIELD', idx:t.idx, field:'planned', value:v })} /></td>
                                                {days.map((d, di) => {
                                                    const isWknd = isWeekend(year,month,d);
                                                    const isPreStart = startDay !== null && d < startDay;
                                                    const planned = n(t.planned);
                                                    const isBlocked = !isWknd && planned > 0 && (() => {
                                                        let sumBefore = 0;
                                                        for (let di2 = 0; di2 < di; di2++) sumBefore += n((t.days||[])[di2]);
                                                        return sumBefore >= planned;
                                                    })();
                                                    return (
                                                        <td key={d} className={cls('p-0.5', isWknd && 'day-weekend', isBlocked && 'bg-slate-100')}
                                                            style={isPreStart ? { opacity: 0.25, pointerEvents: 'none' } : {}}>
                                                            {isWknd
                                                                ? <div className="w-9 h-7"></div>
                                                                : isBlocked
                                                                    ? <span className="text-slate-300 text-xs select-none flex items-center justify-center w-9 h-7" title="תקציב השעות מוצה">—</span>
                                                                    : <NumberCell value={(t.days||[])[di]||0} onChange={v => {
                                                                        if (planned > 0) {
                                                                            let sumOther = 0;
                                                                            for (let di2 = 0; di2 < (t.days||[]).length; di2++) {
                                                                                if (di2 !== di) sumOther += n((t.days||[])[di2]);
                                                                            }
                                                                            const max = Math.max(0, planned - sumOther);
                                                                            if (n(v) > max) v = max;
                                                                        }
                                                                        dispatch({ type:'SET_TASK_DAY', idx:t.idx, dayIdx:di, value:v });
                                                                    }} className="text-xs" />
                                                            }
                                                        </td>
                                                    );
                                                })}
                                                <td className="p-1 sticky-col-left" style={{ width: colW.progress, minWidth: colW.progress, maxWidth: colW.progress, overflow:'hidden', background: '#ffffff' }}>
                                                    <div style={{display:'flex', alignItems:'center', gap:4}}>
                                                        <div style={{flex:1, textAlign:'center'}}>
                                                            {(() => {
                                                                const planned = n(t.planned);
                                                                const assigned = n(rowSum);
                                                                if (planned === 0) return (
                                                                    <span className="text-slate-400 text-xs">{assigned > 0 ? fmt(assigned) : '—'}</span>
                                                                );
                                                                const over = assigned > planned;
                                                                const exact = assigned === planned;
                                                                const color = exact ? '#10b981' : over ? '#ef4444' : '#f59e0b';
                                                                return <span style={{color, fontSize:11, fontWeight:600}}>{fmt(assigned)}/{fmt(planned)}</span>;
                                                            })()}
                                                        </div>
                                                        <button onClick={async () => { const r = await Swal.fire({ title: 'למחוק משימה?', icon: 'warning', showCancelButton: true, confirmButtonText: 'מחק', cancelButtonText: 'ביטול', reverseButtons: true }); if (r.isConfirmed) dispatch({ type:'DELETE_TASK', idx:t.idx }); }} className="text-red-400 hover:text-red-600 p-1 rounded hover:bg-red-50 flex-shrink-0">
                                                            <Icon name="trash" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                                <tfoot>
                                    <tr className="bg-slate-50 border-t-2 border-slate-300 font-semibold">
                                        <td className="p-2 text-right sticky-col bg-slate-50 sticky-group" colSpan={2}>סה״כ שיבוץ יומי</td>
                                        <td colSpan={6} className="bg-slate-50"></td>
                                        {days.map((d,di) => (
                                            <td key={d} className={cls('p-1 text-center text-xs', isWeekend(year,month,d) && 'day-weekend')}>
                                                {!isWeekend(year,month,d) && fmt(totals[di])}
                                            </td>
                                        ))}
                                        <td className="p-2 text-center bg-emerald-100 sticky-col-left" style={{width:colW.progress,minWidth:colW.progress,maxWidth:colW.progress}}>{fmt(totalAssigned)}</td>
                                    </tr>
                                    <tr className="bg-indigo-50 font-semibold">
                                        <td className="p-2 text-right sticky-col bg-indigo-50 sticky-group" colSpan={2}>סה״כ תכנון שעות</td>
                                        <td colSpan={6} className="bg-indigo-50"></td>
                                        {days.map((d,di) => (
                                            <td key={d} className={cls('p-1', isWeekend(year,month,d) && 'day-weekend')}></td>
                                        ))}
                                        <td className="p-2 text-center bg-indigo-100 font-bold sticky-col-left" style={{width:colW.progress,minWidth:colW.progress,maxWidth:colW.progress}}>{fmt(totalPlanned)}</td>
                                    </tr>
                                    <tr className="bg-teal-50 font-semibold">
                                        <td className="p-2 text-right sticky-col bg-teal-50 sticky-group" colSpan={2}>משאבים זמינים ({primaryRole})</td>
                                        <td colSpan={6} className="bg-teal-50"></td>
                                        {days.map((d,di) => (
                                            <td key={d} className={cls('p-1 text-center text-xs', isWeekend(year,month,d) && 'day-weekend')}>
                                                {!isWeekend(year,month,d) && fmt(avail[di])}
                                            </td>
                                        ))}
                                        <td className="p-2 text-center bg-emerald-100 sticky-col-left" style={{width:colW.progress,minWidth:colW.progress,maxWidth:colW.progress}}>{fmt(avail.reduce((a,b)=>a+b,0))}</td>
                                    </tr>
                                    <tr className="font-bold border-t-2 border-slate-300">
                                        <td className="p-2 text-right sticky-col bg-white sticky-group" colSpan={2}>הפרש שיבוץ/זמינות</td>
                                        <td colSpan={6} className="bg-white"></td>
                                        {days.map((d,di) => (
                                            <td key={d} className={cls('p-1 text-center text-xs', isWeekend(year,month,d) ? 'day-weekend' : diff[di] < 0 ? 'text-red-700 bg-red-50' : 'text-emerald-700')}>
                                                {!isWeekend(year,month,d) && (diff[di] > 0 ? '+' : '') + fmt(diff[di])}
                                            </td>
                                        ))}
                                        <td className={cls('p-2 text-center bg-emerald-50 sticky-col-left', diff.reduce((a,b)=>a+b,0) < 0 ? 'text-red-700' : 'text-emerald-700')} style={{width:colW.progress,minWidth:colW.progress,maxWidth:colW.progress}}>
                                            {fmt(diff.reduce((a,b)=>a+b,0))}
                                        </td>
                                    </tr>
                                    <tr className="font-bold border-t border-indigo-200">
                                        <td className={cls('p-2 text-right sticky-col sticky-group', planVsAssign === 0 ? 'bg-emerald-50' : planVsAssign > 0 ? 'bg-amber-50' : 'bg-red-50')} colSpan={2}>
                                            שעות תכנון שלא חולקו
                                            {planVsAssign > 0 && <span className="mr-1 text-amber-600 text-xs">⚠ חסרה חלוקה</span>}
                                            {planVsAssign < 0 && <span className="mr-1 text-red-600 text-xs">⚠ חרגת מהתכנון</span>}
                                        </td>
                                        <td colSpan={6} className={planVsAssign === 0 ? 'bg-emerald-50' : planVsAssign > 0 ? 'bg-amber-50' : 'bg-red-50'}></td>
                                        {days.map((d,di) => (
                                            <td key={d} className={cls('p-1', isWeekend(year,month,d) && 'day-weekend', planVsAssign === 0 ? 'bg-emerald-50' : planVsAssign > 0 ? 'bg-amber-50' : 'bg-red-50')}></td>
                                        ))}
                                        <td className={cls('p-2 text-center sticky-col-left font-bold text-lg',
                                            planVsAssign === 0 ? 'bg-emerald-100 text-emerald-700' :
                                            planVsAssign > 0 ? 'bg-amber-100 text-amber-700' :
                                            'bg-red-100 text-red-700'
                                        )} style={{width:colW.progress,minWidth:colW.progress,maxWidth:colW.progress}}>
                                            {planVsAssign === 0 ? '✓' : (planVsAssign > 0 ? '-' : '+') + fmt(Math.abs(planVsAssign))}
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // ========== TEAMS PANEL ==========
        function TeamsPanel({ data, dispatch }) {
            const [teams, setTeams] = useState([]);
            const [expanded, setExpanded] = useState({});
            const [editingTeam, setEditingTeam] = useState(null);
            const [editingTeamName, setEditingTeamName] = useState('');
            const [editingMember, setEditingMember] = useState(null);
            const [newMember, setNewMember] = useState({});
            const [toast, setToast] = useState(null);
            const [createModal, setCreateModal] = useState(null);

            useEffect(() => {
                apiFetch(`${API_BASE}/teams`).then(r => r.json()).then(d => Array.isArray(d) && setTeams(d)).catch(() => {});
            }, []);

            function showToast(msg) {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            }

            function loadMember(member) {
                const exists = data.manpower.employees.some(e => e.name === member.name && e.team === member.role);
                if (exists) { showToast(`"${member.name}" כבר נמצא ברשימת העובדים`); return; }
                dispatch({ type: 'ADD_EMPLOYEE_FROM_TEAM', member });
            }
            function loadTeam(team) {
                team.members.forEach(m => loadMember(m));
            }

            function openCreateModal() {
                setCreateModal({ name: '', members: [{ _id: Date.now(), name: '', role: data.roles[0] || '' }] });
            }

            async function submitCreateModal() {
                const teamName = (createModal.name || '').trim();
                if (!teamName) return;
                const res = await apiFetch(`${API_BASE}/teams`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: teamName }) });
                const t = await res.json();
                const validMembers = createModal.members.filter(m => m.name.trim() && m.role.trim());
                for (const m of validMembers) {
                    const mr = await apiFetch(`${API_BASE}/teams/${t.id}/members`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: m.name.trim(), role: m.role.trim() }) });
                    const saved = await mr.json();
                    t.members = [...(t.members || []), saved];
                }
                setTeams(prev => [...prev, t]);
                setExpanded(prev => ({ ...prev, [t.id]: true }));
                setCreateModal(null);
            }

            async function renameTeam(team, name) {
                name = name.trim();
                if (!name || name === team.name) return;
                await apiFetch(`${API_BASE}/teams/${team.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
                setTeams(prev => prev.map(t => t.id === team.id ? { ...t, name } : t));
            }

            function enterEditMode(team) {
                setEditingTeam(team.id);
                setEditingTeamName(team.name);
                setEditingMember(null);
            }

            async function exitEditMode(team) {
                const name = editingTeamName.trim();
                if (name && name !== team.name) await renameTeam(team, name);
                setEditingTeam(null);
                setEditingTeamName('');
            }

            async function deleteTeam(team) {
                const role = window.wgAuth?.getUser()?.role;
                if (role !== 'superadmin' && role !== 'admin') {
                    await Swal.fire({ title: 'פעולה מוגבלת', text: 'מחיקת צוות מותרת למנהל מערכת בלבד', icon: 'info', confirmButtonText: 'הבנתי' });
                    return;
                }
                const result = await Swal.fire({ title: `למחוק צוות?`, text: `"${team.name}" וכל חברי הצוות יימחקו`, icon: 'warning', showCancelButton: true, confirmButtonText: 'מחק', cancelButtonText: 'ביטול', reverseButtons: true });
                if (!result.isConfirmed) return;
                await apiFetch(`${API_BASE}/teams/${team.id}`, { method: 'DELETE' });
                setTeams(prev => prev.filter(t => t.id !== team.id));
            }

            async function addMember(teamId) {
                const nm = newMember[teamId] || {};
                const name = (nm.name || '').trim();
                const role = (nm.role || '').trim();
                if (!name || !role) {
                    setNewMember(prev => ({ ...prev, [teamId]: { ...prev[teamId], _err: true } }));
                    return;
                }
                setNewMember(prev => ({ ...prev, [teamId]: { ...prev[teamId], _err: false } }));
                const res = await apiFetch(`${API_BASE}/teams/${teamId}/members`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, role }) });
                const m = await res.json();
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, members: [...t.members, m] } : t));
                setNewMember(prev => ({ ...prev, [teamId]: { name: '', role: '', _err: false } }));
            }

            async function saveMember() {
                if (!editingMember) return;
                const { teamId, memberId, name, role } = editingMember;
                await apiFetch(`${API_BASE}/teams/${teamId}/members/${memberId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name.trim(), role: role.trim() }) });
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, members: t.members.map(m => m.id === memberId ? { ...m, name: name.trim(), role: role.trim() } : m) } : t));
                setEditingMember(null);
            }

            async function deleteMember(teamId, memberId, memberName) {
                const result = await Swal.fire({ title: `למחוק עובד?`, text: `"${memberName}" יוסר מהצוות`, icon: 'warning', showCancelButton: true, confirmButtonText: 'מחק', cancelButtonText: 'ביטול', reverseButtons: true });
                if (!result.isConfirmed) return;
                await apiFetch(`${API_BASE}/teams/${teamId}/members/${memberId}`, { method: 'DELETE' });
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, members: t.members.filter(m => m.id !== memberId) } : t));
            }

            return (
                <div className="bg-white rounded-2xl border border-slate-200 p-5" style={{ position: 'relative' }}>
                    {toast && (
                        <div style={{ position: 'fixed', bottom: 28, left: '50%', transform: 'translateX(-50%)', background: '#1e293b', color: '#fff', padding: '10px 22px', borderRadius: 10, fontSize: 13, fontWeight: 500, zIndex: 9999, boxShadow: '0 4px 16px rgba(0,0,0,.18)', pointerEvents: 'none' }}>
                            {toast}
                        </div>
                    )}

                    {/* ── מודל יצירת צוות חדש ── */}
                    {createModal && ReactDOM.createPortal(
                        <div style={{ position:'fixed', inset:0, background:'rgba(15,23,42,0.45)', zIndex:10000, display:'flex', alignItems:'center', justifyContent:'center' }}
                            onClick={e => { if (e.target === e.currentTarget) setCreateModal(null); }}>
                            <div style={{ background:'#fff', borderRadius:20, padding:28, width:420, maxWidth:'calc(100vw - 32px)', boxShadow:'0 24px 64px rgba(0,0,0,.22)', direction:'rtl' }}>
                                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
                                    <h3 style={{ margin:0, fontSize:17, fontWeight:800, color:'#0f172a' }}>צוות חדש</h3>
                                    <button onClick={() => setCreateModal(null)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:20, color:'#94a3b8', lineHeight:1 }}>✕</button>
                                </div>
                                <div style={{ marginBottom:20 }}>
                                    <label style={{ fontSize:12, fontWeight:700, color:'#64748b', display:'block', marginBottom:6 }}>שם הצוות</label>
                                    <input autoFocus value={createModal.name}
                                        onChange={e => setCreateModal(m => ({ ...m, name: e.target.value }))}
                                        onKeyDown={e => { if (e.key === 'Enter') submitCreateModal(); }}
                                        placeholder="לדוגמה: צוות פיתוח"
                                        style={{ width:'100%', padding:'8px 12px', border:'1.5px solid #e2e8f0', borderRadius:10, fontSize:14, fontFamily:'inherit', outline:'none', boxSizing:'border-box' }}
                                        onFocus={e => e.target.style.borderColor='#6366f1'}
                                        onBlur={e => e.target.style.borderColor='#e2e8f0'} />
                                </div>
                                <div style={{ marginBottom:16 }}>
                                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                                        <label style={{ fontSize:12, fontWeight:700, color:'#64748b' }}>חברי הצוות</label>
                                        <button onClick={() => setCreateModal(m => ({ ...m, members: [{ _id: Date.now(), name:'', role: data.roles[0] || '', _focus: true }, ...m.members] }))}
                                            style={{ display:'inline-flex', alignItems:'center', gap:4, fontSize:12, fontWeight:600, color:'#6366f1', background:'rgba(99,102,241,0.08)', border:'none', borderRadius:8, padding:'4px 10px', cursor:'pointer' }}>
                                            + הוסף חבר
                                        </button>
                                    </div>
                                    <div style={{ display:'flex', flexDirection:'column', gap:8, maxHeight:220, overflowY:'auto' }}>
                                        {createModal.members.map((m, i) => (
                                            <div key={m._id || i} style={{ display:'flex', gap:8, alignItems:'center' }}>
                                                <input autoFocus={!!m._focus} value={m.name}
                                                    onChange={e => setCreateModal(cm => ({ ...cm, members: cm.members.map((x,j) => j===i ? { ...x, name:e.target.value, _focus: false } : x) }))}
                                                    placeholder="שם עובד"
                                                    style={{ flex:1, padding:'7px 10px', border:'1.5px solid #e2e8f0', borderRadius:9, fontSize:13, fontFamily:'inherit', outline:'none' }}
                                                    onFocus={e => e.target.style.borderColor='#6366f1'}
                                                    onBlur={e => e.target.style.borderColor='#e2e8f0'} />
                                                <select value={m.role}
                                                    onChange={e => setCreateModal(cm => ({ ...cm, members: cm.members.map((x,j) => j===i ? { ...x, role:e.target.value } : x) }))}
                                                    style={{ flex:1, padding:'7px 10px', border:'1.5px solid #e2e8f0', borderRadius:9, fontSize:13, fontFamily:'inherit', outline:'none', background:'#fff' }}
                                                    onFocus={e => e.target.style.borderColor='#6366f1'}
                                                    onBlur={e => e.target.style.borderColor='#e2e8f0'}>
                                                    {data.roles.map(r => <option key={r} value={r}>{r}</option>)}
                                                </select>
                                                {createModal.members.length > 1 &&
                                                    <button onClick={() => setCreateModal(cm => ({ ...cm, members: cm.members.filter((_,j) => j!==i) }))}
                                                        style={{ background:'none', border:'none', cursor:'pointer', color:'#ef4444', fontSize:16, padding:'2px 4px', lineHeight:1 }}>✕</button>
                                                }
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div style={{ display:'flex', gap:10, justifyContent:'flex-start' }}>
                                    <button onClick={submitCreateModal}
                                        disabled={!createModal.name.trim()}
                                        style={{ padding:'9px 22px', background: createModal.name.trim() ? 'linear-gradient(135deg,#6366f1,#8b5cf6)' : '#e2e8f0', color: createModal.name.trim() ? '#fff' : '#94a3b8', border:'none', borderRadius:10, fontWeight:700, fontSize:14, fontFamily:'inherit', cursor: createModal.name.trim() ? 'pointer' : 'default', boxShadow: createModal.name.trim() ? '0 2px 12px rgba(99,102,241,0.3)' : 'none', transition:'all .15s' }}>
                                        שמור
                                    </button>
                                    <button onClick={() => setCreateModal(null)}
                                        style={{ padding:'9px 18px', background:'rgba(100,116,139,0.1)', color:'#475569', border:'1px solid rgba(100,116,139,0.2)', borderRadius:10, fontWeight:600, fontSize:14, fontFamily:'inherit', cursor:'pointer' }}>
                                        ביטול
                                    </button>
                                </div>
                            </div>
                        </div>,
                        document.body
                    )}

                    <div className="flex items-center justify-between mb-4">
                        <div>
                            <h2 className="font-bold text-slate-900">צוותים</h2>
                            <p className="text-sm text-slate-500">הגדר צוותים ועובדים וטען אותם לגנט</p>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={openCreateModal} className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium whitespace-nowrap inline-flex items-center gap-1">
                                <Icon name="plus" className="w-4 h-4" /> הוסף צוות
                            </button>
                        </div>
                    </div>
                    {teams.length === 0 && <div className="text-sm text-slate-400 text-center py-6">אין צוותים עדיין — צור צוות חדש</div>}

                    <div className="flex flex-wrap gap-3">
                        {teams.map((team, tIdx) => {
                            const tagColors = [
                                { bg: '#eff6ff', border: '#bfdbfe', text: '#1d4ed8', dot: '#3b82f6' },
                                { bg: '#f0fdf4', border: '#bbf7d0', text: '#15803d', dot: '#22c55e' },
                                { bg: '#fdf4ff', border: '#e9d5ff', text: '#7e22ce', dot: '#a855f7' },
                                { bg: '#fff7ed', border: '#fed7aa', text: '#c2410c', dot: '#f97316' },
                                { bg: '#f0f9ff', border: '#bae6fd', text: '#0369a1', dot: '#0ea5e9' },
                                { bg: '#fff1f2', border: '#fecdd3', text: '#be123c', dot: '#f43f5e' },
                            ];
                            const tc = tagColors[tIdx % tagColors.length];
                            const isEditing = editingTeam === team.id;
                            return (
                            <div key={team.id} style={{ width: 260, flexShrink: 0, border: `1.5px solid ${isEditing ? tc.border : '#e2e8f0'}`, borderRadius: 14, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: '#fff', boxShadow: isEditing ? `0 0 0 3px ${tc.bg}` : '0 1px 4px rgba(0,0,0,.06)', transition: 'box-shadow .15s, border-color .15s' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', borderBottom: `1.5px solid ${isEditing ? tc.border : '#f1f5f9'}`, background: isEditing ? tc.bg : '#fff' }}>
                                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, flexShrink: 0, flex: 1, minWidth: 0 }}>
                                        <span style={{ width: 7, height: 7, borderRadius: '50%', background: tc.dot, flexShrink: 0 }}></span>
                                        {isEditing ? (
                                            <input autoFocus value={editingTeamName} onChange={e => setEditingTeamName(e.target.value)}
                                                style={{ border: 'none', background: 'transparent', outline: 'none', fontSize: 13, fontWeight: 700, color: tc.text, minWidth: 0, flex: 1 }}
                                                onKeyDown={e => { if (e.key === 'Enter') exitEditMode(team); if (e.key === 'Escape') { setEditingTeam(null); setEditingTeamName(''); } }} />
                                        ) : (
                                            <span style={{ fontSize: 13, fontWeight: 700, color: '#1e293b' }}>{team.name}</span>
                                        )}
                                    </span>
                                    {!isEditing && <span style={{ fontSize: 11, color: '#94a3b8', flexShrink: 0 }}>{team.members.length} חברים</span>}
                                    {isEditing ? (
                                        <button onClick={() => exitEditMode(team)}
                                            style={{ padding: '3px 10px', borderRadius: 7, background: tc.text, color: '#fff', border: 'none', cursor: 'pointer', fontSize: 11, fontWeight: 700, flexShrink: 0 }}
                                            onMouseOver={e => e.currentTarget.style.opacity='0.8'}

                                                        style={{ padding: '4px 8px', border: '1.5px solid #7dd3fc', borderRadius: 7, fontSize: 12, width: '100%', outline: 'none', boxSizing: 'border-box' }} placeholder="שם" />
                                                    <div style={{ display: 'flex', gap: 5 }}>
                                                        <select value={editingMember.role} onChange={e => setEditingMember(p => ({ ...p, role: e.target.value }))}

                                                            <option value="">תפקיד...</option>

                                                        <button onClick={saveMember} style={{ padding: '4px 10px', borderRadius: 7, background: '#2563eb', color: '#fff', border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>שמור</button>

                                                    <div style={{ display: 'flex', gap: 3 }}>

                                                                    onMouseOver={e => { e.currentTarget.style.background='#e2e8f0'; }}
                                                                    onMouseOut={e => { e.currentTarget.style.background='#f1f5f9'; }}>עריכה</button>
                                                                <button onClick={() => deleteMember(team.id, m.id, m.name)}
                                                                    style={{ padding: '2px 8px', borderRadius: 7, background: '#fef2f2', color: '#ef4444', border: '1px solid #fecaca', cursor: 'pointer', fontSize: 11, fontWeight: 600 }}

                                                                onMouseOut={e => e.currentTarget.style.opacity='1'}>+ טען</button>

                                                </div>

                    </div>
                </div>

        }

        // ========== MANPOWER SCREEN ==========
        function ManpowerScreen({ data, dispatch }) {
            const { meta, manpower, roles } = data;
            const { year, month } = meta;
            const hpd = manpower.hours_per_day;
            const halfDayHours = manpower.half_day_hours || 4.5;

            const days = buildDays(year, month);
            const numDays = days.length;
            const [showOverrides, setShowOverrides] = useState(false);
            return (
                <div className="p-6 space-y-4">
                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div className="flex items-center justify-between p-4 border-b border-slate-200">
                            <div>
                                <h2 className="font-bold text-slate-900">עובדים – חופש / מחלה</h2>
                                <div className="flex items-center gap-3 mt-1 flex-wrap">
                                    <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-medium">יום עבודה = שעות רגילות</span>
                                    <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-red-50 text-red-700 font-medium">לחיצה 1 = חופש</span>
                                    <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-orange-50 text-orange-700 font-medium">לחיצה 2 = מחלה</span>
                                    <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-violet-50 text-violet-700 font-medium">
                                        לחיצה 3 = חצי יום
                                        <span className="mx-1 text-violet-400">|</span>
                                        <input
                                            type="number" min="0.5" max="12" step="0.5"
                                            value={halfDayHours}
                                            onChange={e => dispatch({ type:'SET_HALF_DAY_HOURS', value: parseFloat(e.target.value)||4.5 })}
                                            className="no-spin w-10 text-center bg-violet-100 border border-violet-300 rounded px-1 py-0 text-xs text-violet-800 font-bold focus:outline-none focus:ring-1 focus:ring-violet-400"
                                        />
                                        <span className="text-violet-500 text-[10px]">שע'</span>
                                    </span>
                                    <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-slate-50 text-slate-500 font-medium">לחיצה 4 = חזרה ליום עבודה</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <label className="flex items-center gap-2 text-sm text-slate-600 cursor-pointer select-none">
                                    <input type="checkbox" checked={showOverrides} onChange={e => setShowOverrides(e.target.checked)} />
                                    הצג שעות/יום מותאמות
                                    <InfoIcon text="ניתן לקבוע שעות שונות לעובד-יום ספציפי (למשל חצי יום)." />
                                </label>
                                <button onClick={() => dispatch({ type:'ADD_EMPLOYEE' })} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">
                                    <Icon name="plus" className="w-4 h-4" /> הוסף עובד
                                </button>
                            </div>
                        </div>
                        <div className="scroll-x">
                            <table className="text-sm w-full">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-600 border-b border-slate-200 text-xs">
                                        <th className="p-2 text-right sticky-col bg-slate-50" style={{ minWidth:120 }}>שם</th>
                                        <th className="p-2" style={{ minWidth:100 }}>תפקיד</th>
                                        {days.map(d => <DayHeader key={d} day={d} year={year} month={month} />)}
                                        <th className="p-2 bg-emerald-50" style={{ minWidth:65 }}>שעות זמינות</th>
                                        <th className="p-2" style={{ minWidth:36 }}></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {emps.map((emp, ei) => {
                                        const hrs = personMonthlyHours(emp, hpd, year, month, halfDayHours);
                                        const total = hrs.reduce((a,b) => a+b, 0);
                                        return (
                                            <React.Fragment key={ei}>
                                                <tr className="border-b border-slate-100 hover:bg-slate-50">
                                                    <td className="p-1 sticky-col bg-white">
                                                        <TextCell value={emp.name} onChange={v => dispatch({ type:'SET_EMP_FIELD', empIdx:ei, field:'name', value:v })} className="font-semibold" />
                                                    </td>
                                                    <td className="p-1"><SelectCell value={emp.team} options={roles} onChange={v => dispatch({ type:'SET_EMP_FIELD', empIdx:ei, field:'team', value:v })} /></td>
                                                    {days.map((d, di) => {
                                                        const weekend = isWeekend(year, month, d);
                                                        const offVal = dayOffValue(emp, di);
                                                        return (
                                                            <td key={d} className={cls('p-0.5 text-center', weekend && 'day-weekend')}>
                                                                {weekend ? <div className="w-9 h-7 flex items-center justify-center text-[10px] text-slate-300">—</div> : (
                                                                    <button
                                                                        onClick={() => dispatch({ type:'SET_EMP_DAY_OFF', empIdx:ei, dayIdx:di })}
                                                                        title={offVal === 'vacation' ? 'חופש' : offVal === 'sick' ? 'מחלה' : offVal === 'half' ? 'חצי יום' : 'יום עבודה'}
                                                                        className={cls('w-9 h-7 rounded text-xs font-medium transition-colors',
                                                                            offVal === 'vacation' ? 'bg-red-100 text-red-700 hover:bg-red-200' :
                                                                            offVal === 'sick'     ? 'bg-orange-100 text-orange-700 hover:bg-orange-200' :
                                                                            offVal === 'half'    ? 'bg-violet-100 text-violet-700 hover:bg-violet-200' :
                                                                                                   'bg-emerald-50 text-emerald-700 hover:bg-emerald-100')}>
                                                                        {offVal === 'vacation' ? 'חופש' : offVal === 'sick' ? 'מחלה' : offVal === 'half' ? 'חצי' : fmt(hrs[di]||hpd)}
                                                                    </button>
                                                                )}
                                                            </td>
                                                        );
                                                    })}
                                                    <td className="p-2 text-center font-bold bg-emerald-50">{fmt(total)}</td>
                                                    <td className="p-1 text-center">
                                                        <button onClick={async () => { const r = await Swal.fire({ title: 'למחוק עובד?', icon: 'warning', showCancelButton: true, confirmButtonText: 'מחק', cancelButtonText: 'ביטול', reverseButtons: true }); if (r.isConfirmed) dispatch({ type:'DELETE_EMPLOYEE', empIdx:ei }); }} className="text-slate-400 hover:text-red-600 p-1 rounded hover:bg-red-50">

                                                    </td>

                                                            </td>
                                                        ))}

                                                    </tr>
                                                )}
                                            </React.Fragment>

                                    {emps.length === 0 && (
                                        <tr><td colSpan={numDays+4} className="p-8 text-center text-slate-400 text-sm">אין עובדים עדיין – לחץ "הוסף עובד"</td></tr>
                                    )}

                                </tbody>
                            </table>
                        </div>
                    </div>

                    <TeamsPanel data={data} dispatch={dispatch} />
                </div>
            );
        }

        // ========== RESOURCES SCREEN ==========
        function ResourcesScreen({ data }) {
            const { meta, manpower, roles } = data;
            const { year, month } = meta;
            const hpd = manpower.hours_per_day;
            const halfDayHours = manpower.half_day_hours || 4.5;
            const days = buildDays(year, month);
            const numDays = days.length;

            const roleHours = useMemo(() => roleHoursByDay(manpower.employees, hpd, year, month, roles, halfDayHours), [manpower, year, month, roles]);
            const counts = {};
            manpower.employees.forEach(e => { counts[e.team] = (counts[e.team]||0)+1; });
            const totalPerDay = new Array(numDays).fill(0);
            roles.forEach(r => { for (let i=0;i<numDays;i++) totalPerDay[i] += (roleHours[r]||[])[i]||0; });

            return (
                <div className="p-6 space-y-4">
                    <div className="bg-teal-50 border border-teal-200 rounded-2xl p-4 text-sm text-teal-900 flex items-start gap-3">
                        <Icon name="info" className="w-5 h-5 shrink-0 mt-0.5" />
                        <div><div className="font-semibold">גליון מחושב (read-only)</div>
                        <div className="mt-1 opacity-90">הערכים מחושבים מנתוני כוח האדם בחלוקה לפי תפקיד ויום.</div></div>
                    </div>
                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div className="p-4 border-b border-slate-200">
                            <h2 className="font-bold text-slate-900">שעות עבודה אפשריות לפי תפקיד – יומי</h2>
                        </div>
                        <div className="scroll-x">
                            <table className="text-sm w-full">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-600 border-b border-slate-200">
                                        <th className="p-2 text-right sticky-col bg-slate-50" style={{ minWidth:130 }}>תפקיד</th>
                                        <th className="p-2" style={{ minWidth:60 }}>עובדים</th>
                                        {days.map(d => <DayHeader key={d} day={d} year={year} month={month} />)}
                                        <th className="p-2 bg-emerald-50">סה״כ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {roles.map(role => {
                                        const hrs = roleHours[role] || new Array(numDays).fill(0);
                                        const annual = hrs.reduce((a,b) => a+b, 0);
                                        return (
                                            <tr key={role} className={cls('border-b border-slate-100', !counts[role] && 'opacity-50')}>
                                                <td className="p-2 font-semibold text-right sticky-col bg-white">{role}</td>
                                                <td className="p-2 text-center">{counts[role]||0}</td>
                                                {days.map((d,di) => (
                                                    <td key={d} className={cls('p-1 text-center text-xs', isWeekend(year,month,d) && 'day-weekend')}>
                                                        {!isWeekend(year,month,d) && fmt(hrs[di])}
                                                    </td>
                                                ))}
                                                <td className="p-2 text-center font-bold bg-emerald-50">{fmt(annual)}</td>
                                            </tr>
                                        );
                                    })}
                                    <tr className="bg-slate-100 font-bold border-t-2 border-slate-300">
                                        <td className="p-2 text-right sticky-col bg-slate-100">סה״כ כללי</td>
                                        <td className="p-2 text-center">{manpower.employees.length}</td>
                                        {days.map((d,di) => (
                                            <td key={d} className={cls('p-1 text-center text-xs', isWeekend(year,month,d) && 'day-weekend')}>
                                                {!isWeekend(year,month,d) && fmt(totalPerDay[di])}
                                            </td>
                                        ))}
                                        <td className="p-2 text-center bg-emerald-100">{fmt(totalPerDay.reduce((a,b)=>a+b,0))}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // ========== SPRINTS SCREEN ==========
        function SprintsScreen({ data, dispatch }) {
            return (
                <div className="p-6 space-y-4">
                    <div className="flex items-center justify-between">
                        <div>
                            <h2 className="font-bold text-slate-900 text-lg">ניצול משאבים – ספרינטים</h2>
                            <p className="text-sm text-slate-500">מעקב ביצוע מול תכנון בתוך החודש.</p>
                        </div>
                        <button onClick={() => dispatch({ type:'ADD_SPRINT' })} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">
                            <Icon name="plus" className="w-4 h-4" /> ספרינט חדש

                    {data.sprints.length === 0 && (
                        <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-12 text-center text-slate-400">

                        {data.sprints.map((sp, si) => {
                            const totalPlan = sp.items.reduce((a,b) => a+n(b.plan), 0);
                            const totalDone = sp.items.reduce((a,b) => a+n(b.done), 0);
                            const deviation = totalDone - totalPlan;
                            const devPct = totalPlan ? (deviation/totalPlan*100) : 0;
                            return (
                                <div key={si} className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                                    <div className="p-4 border-b border-slate-200 bg-slate-50 flex items-start gap-3">
                                        <div className="flex-1">
                                            <TextCell value={sp.name} onChange={v => dispatch({ type:'SET_SPRINT_FIELD', idx:si, field:'name', value:v })} className="font-bold text-slate-900 text-base" />
                                            <TextCell value={sp.dates} onChange={v => dispatch({ type:'SET_SPRINT_FIELD', idx:si, field:'dates', value:v })} className="text-xs text-slate-500 mt-1" />
                                        </div>
                                        <div className="text-left text-sm">
                                            <div>תכנון: <b>{fmt(totalPlan)}</b></div>
                                            <div>ביצוע: <b>{fmt(totalDone)}</b></div>

                                                        <td className="p-1"><NumberCell value={it.done} onChange={v => dispatch({ type:'SET_SPRINT_ITEM', sIdx:si, iIdx:ii, field:'done', value:v })} /></td>

                                            + הוסף משימה לספרינט
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

                                <ul className="list-disc mr-5 text-sm text-slate-700 space-y-1.5">
                                    <li><b>שעות ביום</b> – מקדם גלובלי לכל ימי העבודה.</li>
                                    <li><b>חופש / מחלה</b> – לחיצה על תא עובד-יום מסמנת היעדרות (✕ = אפס שעות).</li>
                                    <li><b>שעות/יום מותאמות</b> – ניתן לקבוע שעות שונות לעובד-יום ספציפי (הצג מקדמים).</li>
                                    <li><b>תכנון (משימה)</b> – אומדן שעות כולל לחודש.</li>
                                    <li><b>שעות יומיות (משימה)</b> – כמה שעות מוקצות ביום ספציפי.</li>
                                </ul>
                            </section>
                            <section>
                                <h3 className="font-bold text-slate-800 mb-2">ניווט חודש</h3>
                                <p className="text-sm text-slate-700">
                                    ניתן לנווט בין חודשים בעזרת החיצים בכותרת, לבחור חודש מהרשימה, או לשנות שנה ישירות.
                                    כשמשנים חודש, מספר הימים מתעדכן אוטומטית ותאי הנתונים מותאמים.
                                </p>
                            </section>
                            <section>
                                <h3 className="font-bold text-slate-800 mb-2">ייצוא / ייבוא</h3>
                                <p className="text-sm text-slate-700">ניתן לייצא לאקסל (.xlsx) ולייבא בחזרה. הנתונים נשמרים אוטומטית ב-localStorage.</p>
