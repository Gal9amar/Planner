    <style>
        .swal2-popup {
            font-family: 'Heebo', system-ui, sans-serif !important;
            direction: rtl !important;
            background: rgba(255,255,255,0.82) !important;
            backdrop-filter: blur(40px) saturate(200%) !important;
            -webkit-backdrop-filter: blur(40px) saturate(200%) !important;
            border: 1px solid rgba(255,255,255,0.6) !important;
            border-radius: 24px !important;
            box-shadow: 0 8px 48px rgba(14,165,233,0.18), 0 2px 16px rgba(99,102,241,0.14), inset 0 1px 0 rgba(255,255,255,0.9) !important;
            color: #0f172a !important;
        }
        .swal2-title { font-family: 'Heebo', system-ui, sans-serif !important; color: #0f172a !important; font-weight: 700 !important; }
        .swal2-html-container { font-family: 'Heebo', system-ui, sans-serif !important; color: #334155 !important; }
        .swal2-confirm {
            background: linear-gradient(135deg, #0ea5e9, #6366f1) !important;

            font-weight: 600 !important; box-shadow: 0 2px 12px rgba(99,102,241,0.3) !important;
        }
        .swal2-cancel {
            background: rgba(100,116,139,0.12) !important;
            color: #475569 !important; border: 1px solid rgba(100,116,139,0.2) !important;
            border-radius: 10px !important; font-family: 'Heebo', system-ui, sans-serif !important;
            font-weight: 600 !important;
        }
        .swal2-cancel:hover { background: rgba(100,116,139,0.22) !important; }
        .swal2-icon { border-color: rgba(99,102,241,0.35) !important; }
        .swal2-icon.swal2-warning { border-color: rgba(251,146,60,0.4) !important; color: #f97316 !important; }
        .swal2-icon.swal2-success { border-color: rgba(34,197,94,0.35) !important; }
        .swal2-icon.swal2-success .swal2-success-ring { border-color: rgba(34,197,94,0.25) !important; }
        html, body { height: 100%; overflow: hidden; }

        @media print { .no-print { display: none !important; } }

        .col-resize-handle.dragging { background: #10b981; opacity: 0.6; }

<body>
    <div id="root">
        <div id="boot-screen"
            style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#d1fae5,#f1f5f9);color:#0f172a;font-family:'Heebo',system-ui,sans-serif;">
            <div style="width:52px;height:52px;border:5px solid #cbd5e1;border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;"></div>
            <div style="font-size:18px;font-weight:600;">טוען תוכנית עבודה חודשית...</div>
            <div id="boot-status" style="font-size:13px;color:#475569;">טוען ספריות מהרשת</div>
            <div id="boot-error" style="max-width:640px;margin-top:8px;padding:14px 16px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;font-size:13px;display:none;white-space:pre-wrap;text-align:right;direction:rtl;"></div>
        </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    <script>
        (function () {
            var boot = document.getElementById('boot-status');
            var bootErr = document.getElementById('boot-error');
            function showErr(msg) {
                if (!bootErr) return;
                bootErr.style.display = 'block';
                bootErr.textContent = (bootErr.textContent ? bootErr.textContent + '\n' : '') + msg;
            }
            window.__bootStatus = function (msg) { if (boot) boot.textContent = msg; };
            window.__bootError = showErr;
            window.addEventListener('error', function (e) {
                if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) { showErr('נכשלה טעינה: ' + (e.target.src || e.target.href)); return; }
                showErr('שגיאה: ' + (e.message || e));
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                showErr('שגיאה אסינכרונית: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
            });
            setTimeout(function () {
                if (document.getElementById('boot-screen'))
                    showErr('הטעינה איטית – ודא חיבור לאינטרנט או בדוק Console (F12).');
            }, 15000);
        })();
    </script>
    <script>if (window.__bootStatus) window.__bootStatus('מקמפל את האפליקציה...');</script>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef, useReducer, useCallback } = React;

        // ========== CONSTANTS ==========
        const MONTH_NAMES = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
        const DAY_NAMES = ['א','ב','ג','ד','ה','ו','ש']; // Sun=0 ... Sat=6
        const TASK_TYPES = ['תשתית','שוטף','באגים','פרויקט'];
        const TASK_STATUSES = [
            { value: 'pending',     label: 'ממתין',    color: '#64748b', bg: '#64748b', color2: '#ffffff' },
            { value: 'in-dev',      label: 'בפיתוח',   color: '#3b82f6', bg: '#3b82f6', color2: '#ffffff' },
            { value: 'rfq',         label: 'RFQ',      color: '#f59e0b', bg: '#f59e0b', color2: '#ffffff' },
            { value: 'testing',     label: 'בבדיקות',  color: '#f97316', bg: '#f97316', color2: '#ffffff' },
            { value: 'done',        label: 'הושלם',    color: '#10b981', bg: '#10b981', color2: '#ffffff' },
        ];
        const JIRA_STATUS_MAP = {
            'open':            'pending',
            'in dev':          'in-dev',
            'ready for dev':   'pending',
            'ready for qa':    'rfq',
            'testing':         'testing',
            'qa':              'testing',
            'po review':       'done',
        };
        function getStatus(val, statuses=TASK_STATUSES) { return statuses.find(s => s.value === val) || statuses[0]; }
        const TASK_TYPE_COLORS_BASE = { 'תשתית':'#0ea5e9','שוטף':'#10b981','באגים':'#ef4444','פרויקט':'#8b5cf6','':'#94a3b8' };
        const COLOR_PALETTE = ['#0ea5e9','#10b981','#ef4444','#8b5cf6','#f59e0b','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
        function getTypeColor(name, taskTypes=[]) {
            if (!name) return '#94a3b8';
            if (TASK_TYPE_COLORS_BASE[name]) return TASK_TYPE_COLORS_BASE[name];
            const idx = taskTypes.indexOf(name);
            return COLOR_PALETTE[(idx >= 0 ? idx : 0) % COLOR_PALETTE.length];
        }
        const TASK_TYPE_COLORS = new Proxy(TASK_TYPE_COLORS_BASE, { get: (t,k) => t[k] || '#94a3b8' });
        const DEFAULT_ROLES = ['פיתוח','בודק','P&P','תשתיות','ניהול','אחר'];
        const API_BASE = '/api';
        const ganttId = new URLSearchParams(location.search).get('ganttId');
        function getAuth() {
            return window.wgAuth || (window.parent !== window && window.parent.wgAuth) || null;
        }
        function apiFetch(url, opts) {
            const auth = getAuth();
            if (auth) return auth.authFetch(url, opts);
            return new Promise((resolve, reject) => {
                const deadline = Date.now() + 3000;
                const t = setInterval(() => {
                    const a = getAuth();
                    if (a) { clearInterval(t); a.authFetch(url, opts).then(resolve).catch(reject); }
                    else if (Date.now() > deadline) { clearInterval(t); reject(new Error('wgAuth not ready')); }
                }, 20);
            });
        }

        // ========== DATE HELPERS ==========
        function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
        function dayOfWeek(year, month, day) { return new Date(year, month, day).getDay(); } // 0=Sun,6=Sat
        function isWeekend(year, month, day) { const d = dayOfWeek(year, month, day); return d === 5 || d === 6; } // Fri/Sat

        function buildDays(year, month) {
            const count = daysInMonth(year, month);
            return Array.from({ length: count }, (_, i) => i + 1);
        }

        // ========== INITIAL STATE ==========
        const now = new Date();
        const DEFAULT_TASK_TYPES = ['תשתית','שוטף','באגים','פרויקט'];

        const EMPTY_STATE = {
            meta: { title: 'תוכנית עבודה חודשית', month: now.getMonth(), year: now.getFullYear() },
            manpower: { hours_per_day: 8.5, half_day_hours: 4.5, employees: [] },
            tasks: [],
            roles: DEFAULT_ROLES,
            taskTypes: DEFAULT_TASK_TYPES,
            taskStatuses: TASK_STATUSES,
            sprints: [],
        };

        // ========== HELPERS ==========
        const n = (x) => { const v = Number(x); return isNaN(v) ? 0 : v; };
        const fmt = (x) => {
            if (x === '' || x === null || x === undefined) return x;
            const v = Number(x); if (isNaN(v)) return x;
            return v % 1 === 0 ? v.toString() : v.toFixed(1);
        };
        const cls = (...c) => c.filter(Boolean).join(' ');

        // ========== CALCULATIONS ==========
        // day_off values: null/false/'' = work, 'vacation' = חופש, 'sick' = מחלה, true (legacy) = vacation
        function dayOffValue(emp, i) {
            const v = emp.day_off && emp.day_off[i];
            if (!v) return null;
            if (v === true) return 'vacation'; // legacy boolean
            return v;
        }

        function personDailyHours(emp, year, month, halfDayHours) {
            const days = buildDays(year, month);
            return days.map((d, i) => {
                const off = dayOffValue(emp, i);
                if (off === 'half') return n(halfDayHours) || 4.5;
                if (off) return 0;
                if (isWeekend(year, month, d)) return 0;
                return emp.hours_override && n(emp.hours_override[i]) > 0 ? n(emp.hours_override[i]) : n(emp.hours_per_day_override) > 0 ? n(emp.hours_per_day_override) : 0; // filled from global later
            });
        }

        function personMonthlyHours(emp, hpd, year, month, halfDayHours) {
            const days = buildDays(year, month);
            return days.map((d, i) => {
                const off = dayOffValue(emp, i);
                if (off === 'half') return n(halfDayHours) || 4.5;
                if (off) return 0;
                if (isWeekend(year, month, d)) return 0;
                const override = emp.hours_override && n(emp.hours_override[i]) > 0 ? n(emp.hours_override[i]) : n(emp.hours_per_day_override) > 0 ? n(emp.hours_per_day_override) : hpd;
                return override;
            });
        }

        function empTotalHours(emp, hpd, year, month, halfDayHours) {
            return personMonthlyHours(emp, hpd, year, month, halfDayHours).reduce((a,b) => a+b, 0);
        }

        function roleHoursByDay(employees, hpd, year, month, roles, halfDayHours) {
            const numDays = daysInMonth(year, month);
            const result = {};
            roles.forEach(r => { result[r] = new Array(numDays).fill(0); });
            employees.forEach(e => {
                const hrs = personMonthlyHours(e, hpd, year, month, halfDayHours);
                if (!result[e.team]) result[e.team] = new Array(numDays).fill(0);
                for (let i = 0; i < numDays; i++) result[e.team][i] += hrs[i];
            });
            return result;
        }

        function tasksDailyTotal(tasks, numDays) {
            const total = new Array(numDays).fill(0);
            tasks.forEach(t => {
                const sd = t.start_day ? Number(t.start_day) : null;
                for (let i = 0; i < numDays; i++) {
                    if (sd !== null && (i + 1) < sd) continue;
                    total[i] += n((t.days || [])[i]);
                }
            });
            return total;
        }

        function taskRowSum(task) {
            const sd = task.start_day ? Number(task.start_day) : null;
            return (task.days || []).reduce((a, b, i) => {
                if (sd !== null && (i + 1) < sd) return a;
                return a + n(b);
            }, 0);
        }

        function getPrimaryRole(data) {
            const assignedTeams = new Set(data.manpower.employees.map(e => e.team));
            return data.roles.find(r => assignedTeams.has(r)) || data.roles[0] || 'פיתוח';
        }

        function makeEmptyDays(year, month) { return new Array(daysInMonth(year, month)).fill(0); }

        // ========== REDUCER ==========
        function reducer(state, action) {
            const numDays = daysInMonth(state.meta.year, state.meta.month);
            switch (action.type) {
                case 'LOAD_ALL': return action.payload;

                case 'SET_META': {
                    const newMeta = { ...state.meta, ...action.patch };
                    const newNumDays = daysInMonth(newMeta.year, newMeta.month);
                    // resize all tasks.days and employees.day_off / hours_override arrays
                    const tasks = state.tasks.map(t => {
                        const days = Array.from({ length: newNumDays }, (_, i) => n((t.days||[])[i]));
                        return { ...t, days, status: t.status || 'pending', start_day: t.start_day ?? null };
                    });
                    const employees = state.manpower.employees.map(e => ({
                        ...e,
                        day_off: Array.from({ length: newNumDays }, (_, i) => !!(e.day_off||[])[i]),
                        hours_override: Array.from({ length: newNumDays }, (_, i) => n((e.hours_override||[])[i])),
                    }));
                    return { ...state, meta: newMeta, tasks, manpower: { ...state.manpower, employees } };
                }

                case 'SET_EMP_FIELD': {
                    const emps = state.manpower.employees.map((e,i) => i===action.empIdx ? { ...e, [action.field]: action.value } : e);
                    return { ...state, manpower: { ...state.manpower, employees: emps } };
                }
                case 'SET_EMP_DAY_OFF': {
                    const emps = state.manpower.employees.map((e,i) => {
                        if (i !== action.empIdx) return e;
                        const d = [...(e.day_off || new Array(numDays).fill(null))];
                        // cycle: null → 'vacation' → 'sick' → 'half' → null
                        const cur = d[action.dayIdx];
                        const legacy = cur === true ? 'vacation' : cur;
                        d[action.dayIdx] = legacy === null || !legacy ? 'vacation' : legacy === 'vacation' ? 'sick' : legacy === 'sick' ? 'half' : null;
                        return { ...e, day_off: d };
                    });
                    return { ...state, manpower: { ...state.manpower, employees: emps } };
                }
                case 'SET_HALF_DAY_HOURS':
                    return { ...state, manpower: { ...state.manpower, half_day_hours: action.value } };
                case 'SET_EMP_HOUR_OVERRIDE': {
                    const emps = state.manpower.employees.map((e,i) => {
                        if (i !== action.empIdx) return e;
                        const o = [...(e.hours_override || new Array(numDays).fill(0))];
                        o[action.dayIdx] = action.value;
                        return { ...e, hours_override: o };
                    });
                    return { ...state, manpower: { ...state.manpower, employees: emps } };
                }
                case 'SET_HOURS_PER_DAY':
                    return { ...state, manpower: { ...state.manpower, hours_per_day: action.value } };
                case 'ADD_EMPLOYEE': {
                    const nd = daysInMonth(state.meta.year, state.meta.month);
                    const newEmp = { name: 'עובד חדש', team: state.roles[0]||'פיתוח', hours_per_day_override: 0, day_off: new Array(nd).fill(false), hours_override: new Array(nd).fill(0) };
                    return { ...state, manpower: { ...state.manpower, employees: [...state.manpower.employees, newEmp] } };
                }
                case 'DELETE_EMPLOYEE':
                    return { ...state, manpower: { ...state.manpower, employees: state.manpower.employees.filter((_,i) => i !== action.empIdx) } };
                case 'ADD_EMPLOYEE_FROM_TEAM': {
                    const { member } = action;
                    const exists = state.manpower.employees.some(e => e.name === member.name && e.team === member.role);
                    if (exists) return state;
                    const nd = daysInMonth(state.meta.year, state.meta.month);
                    const newEmp = { name: member.name, team: member.role || state.roles[0] || '', hours_per_day_override: 0, day_off: new Array(nd).fill(false), hours_override: new Array(nd).fill(0) };
                    return { ...state, manpower: { ...state.manpower, employees: [...state.manpower.employees, newEmp] } };
                }

                case 'SET_TASK_FIELD': {
                    const tasks = state.tasks.map((t,i) => i===action.idx ? { ...t, [action.field]: action.value, _newlyAdded: false } : t);
                    return { ...state, tasks };
                }
                case 'SET_TASK_DAY': {
                    const tasks = state.tasks.map((t,i) => {
                        if (i !== action.idx) return t;
                        const days = [...(t.days||new Array(numDays).fill(0))];
                        days[action.dayIdx] = action.value;
                        return { ...t, days };
                    });
                    return { ...state, tasks };
                }
                case 'ADD_TASK': {
                    const nd = daysInMonth(state.meta.year, state.meta.month);
                    const newTask = { name: action.importedName || '', task_number: action.importedKey || '', owners:[], type: state.defaultTaskType || 'פרויקט', planned:0, days:new Array(nd).fill(0), notes:'', status: action.importedStatus || state.defaultTaskStatus || 'pending', start_day:null, _newlyAdded: !action.importedName };
                    return { ...state, tasks: [newTask, ...state.tasks] };
                }
                case 'REPLACE_TASK_BY_KEY': {
                    const tasks = state.tasks.map(t =>
                        t.task_number && t.task_number.trim().toUpperCase() === action.key.trim().toUpperCase()
                            ? { ...t, name: action.name, ...(action.status ? { status: action.status } : {}) }
                            : t
                    );
                    return { ...state, tasks };
                }
                case 'SET_DEFAULT_TASK':
                    return { ...state, defaultTaskType: action.taskType ?? state.defaultTaskType, defaultTaskStatus: action.taskStatus ?? state.defaultTaskStatus };
                case 'DELETE_TASK':
                    return { ...state, tasks: state.tasks.filter((_,i) => i !== action.idx) };
                case 'REORDER_TASKS': {
                    const { fromIdx, toIdx } = action;
                    const tasks = [...state.tasks];
                    const [moved] = tasks.splice(fromIdx, 1);
                    tasks.splice(toIdx, 0, moved);
                    return { ...state, tasks };
                }

                case 'SET_SPRINT_FIELD': {
                    const sprints = state.sprints.map((s,i) => i===action.idx ? { ...s, [action.field]: action.value } : s);
                    return { ...state, sprints };
                }
                case 'SET_SPRINT_ITEM': {
                    const sprints = state.sprints.map((s,i) => {
                        if (i !== action.sIdx) return s;
                        const items = s.items.map((it,j) => j===action.iIdx ? { ...it, [action.field]: action.value } : it);
                        return { ...s, items };
                    });
                    return { ...state, sprints };
                }
                case 'ADD_SPRINT':
                    return { ...state, sprints: [...state.sprints, { name:'ספרינט חדש', dates:'', items:[] }] };
                case 'DELETE_SPRINT':
                    return { ...state, sprints: state.sprints.filter((_,i) => i !== action.idx) };
                case 'ADD_SPRINT_ITEM': {
                    const sprints = state.sprints.map((s,i) => i===action.sIdx ? { ...s, items:[...s.items, { task_name:'', type:'שוטף', plan:0, done:0 }] } : s);
                    return { ...state, sprints };
                }
                case 'DELETE_SPRINT_ITEM': {
                    const sprints = state.sprints.map((s,i) => i===action.sIdx ? { ...s, items:s.items.filter((_,j) => j!==action.iIdx) } : s);
                    return { ...state, sprints };
                }
                case 'ADD_ROLE': {
                    const name = (action.name||'').trim();
                    if (!name || state.roles.includes(name)) return state;
                    return { ...state, roles: [...state.roles, name] };
                }
                case 'DELETE_ROLE':
                    return { ...state, roles: state.roles.filter(r => r !== action.name) };
                case 'ADD_TASK_TYPE': {
                    const name = (action.name||'').trim();
                    if (!name || (state.taskTypes||[]).includes(name)) return state;
                    return { ...state, taskTypes: [...(state.taskTypes||DEFAULT_TASK_TYPES), name] };
                }
                case 'DELETE_TASK_TYPE':
                    return { ...state, taskTypes: (state.taskTypes||DEFAULT_TASK_TYPES).filter(t => t !== action.name) };
                case 'ADD_TASK_STATUS': {
                    const { value, label, color, bg, color2 } = action;
                    if (!value || !label) return state;
                    const cur = state.taskStatuses || TASK_STATUSES;
                    if (cur.find(s => s.value === value)) return state;
                    return { ...state, taskStatuses: [...cur, { value, label, color, bg, color2 }] };
                }
                case 'DELETE_TASK_STATUS': {
                    const cur = state.taskStatuses || TASK_STATUSES;
                    return { ...state, taskStatuses: cur.filter(s => s.value !== action.value) };
                }
                case 'SET_ROLES':
                    return { ...state, roles: action.roles };
                case 'SET_TASK_TYPES':
                    return { ...state, taskTypes: action.taskTypes };
                case 'SET_TASK_STATUSES':
                    return { ...state, taskStatuses: action.taskStatuses };
                default: return state;
            }
        }

        // ========== UI PRIMITIVES ==========
        function Tooltip({ text, children }) {
            const ref = useRef(null);
            function show() {
                const portal = document.getElementById('tt-portal');
                if (!portal || !ref.current) return;
                const r = ref.current.getBoundingClientRect();
                portal.textContent = text;
                portal.style.left = (r.left + r.width / 2 - 110) + 'px';
                portal.style.top  = (r.top - portal.offsetHeight - 10) + 'px';
                portal.classList.add('visible');
                // reposition after render
                requestAnimationFrame(() => {
                    portal.style.top = (r.top - portal.offsetHeight - 10) + 'px';
                });
            }
            function hide() {
                const portal = document.getElementById('tt-portal');
                if (portal) portal.classList.remove('visible');
            }
            return <span ref={ref} style={{position:'relative',display:'inline-flex'}} tabIndex={0} onMouseEnter={show} onMouseLeave={hide} onFocus={show} onBlur={hide}>{children}</span>;
        }
        function InfoIcon({ text }) {
            return <Tooltip text={text}><span className="inline-flex items-center justify-center w-4 h-4 ms-1 rounded-full bg-slate-200 text-slate-600 text-[10px] font-bold cursor-help">?</span></Tooltip>;

        function DropdownPortal({ children }) {
            return ReactDOM.createPortal(children, document.body);

        function OwnersCell({ owners=[], employees=[], onChange }) {
            const [open, setOpen] = useState(false);
            const [pos, setPos] = useState({ top:0, left:0, width:160 });
            const ref = useRef(null);
            const dropRef = useRef(null);

            useEffect(() => {
                if (!open) return;
                function handleClick(e) {
                    if (ref.current && ref.current.contains(e.target)) return;
                    if (dropRef.current && dropRef.current.contains(e.target)) return;
                    setOpen(false);
                }
                document.addEventListener('mousedown', handleClick);
                return () => document.removeEventListener('mousedown', handleClick);
            }, [open]);

            function handleOpen() {
                if (ref.current) {
                    const r = ref.current.getBoundingClientRect();
                    const dropH = 220;
                    const spaceBelow = window.innerHeight - r.bottom;
                    const top = spaceBelow >= dropH + 8 ? r.bottom + 4 : r.top - dropH - 4;
                    setPos({ top, left: r.right - Math.max(r.width, 180), width: Math.max(r.width, 180) });
                }
                setOpen(o => !o);
            }

            function toggle(name) {
                if (owners.includes(name)) onChange(owners.filter(o => o !== name));
                else onChange([...owners, name]);
            }

            const label = owners.length === 0
                ? <span className="text-slate-400 text-xs">— בחר —</span>

                                                <span className="text-slate-400 text-xs me-auto">{emp.team}</span>
                                            </label>
                                        );
                                    })
                                }
                            </div>
                        </DropdownPortal>
                    )}
                </div>
            );
        }
        function useToast() {
            const [toast, setToast] = useState(null);
            const timerRef = useRef(null);
            function show(msg, type = 'warning') {
                if (timerRef.current) clearTimeout(timerRef.current);
                setToast({ msg, type });
                timerRef.current = setTimeout(() => setToast(null), 5500);
            }
            function Toast() {
                if (!toast) return null;
                const colors = { warning: 'bg-amber-50 border-amber-400 text-amber-800', error: 'bg-red-50 border-red-400 text-red-800' };
                const el = (
                    <div className={`px-5 py-3 rounded-xl border shadow-lg text-sm font-semibold flex items-center gap-2 ${colors[toast.type] || colors.warning}`}
                         style={{direction:'rtl',animation:'fadeInDown .2s ease',position:'fixed',top:16,left:'50%',transform:'translateX(-50%)',zIndex:99999,pointerEvents:'none',whiteSpace:'nowrap'}}>
                        <span>{toast.type === 'warning' ? '⚠️' : '❌'}</span>
                        {toast.msg}
                    </div>
                );
                return ReactDOM.createPortal(el, document.body);
            }
            return { show, Toast };
        }

        function ImportJiraModal({ existingTasks, onImport, onClose }) {
            const [jiraTasks, setJiraTasks] = useState([]);
            const [selected, setSelected] = useState({});
            const [error, setError] = useState('');
            const fileRef = useRef(null);

            const existingByKey = useMemo(() => {
                const m = {};
                (existingTasks || []).forEach(t => { if (t.task_number) m[t.task_number.trim().toUpperCase()] = t; });
                return m;
            }, [existingTasks]);

            function handleFile(file) {
                setError(''); setJiraTasks([]); setSelected({});
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
                        if (rows.length < 2) { setError('הקובץ ריק'); return; }
                        const header = rows[0].map(h => String(h).trim());
                        const keyIdx = header.findIndex(h => h.toLowerCase() === 'issue key');
                        const sumIdx = header.findIndex(h => h.toLowerCase() === 'summary');
                        const statusIdx = header.findIndex(h => h.toLowerCase() === 'status');
                        if (keyIdx === -1 || sumIdx === -1) { setError('לא נמצאו עמודות Issue key / Summary'); return; }
                        const parsed = rows.slice(1)
                            .filter(r => r[sumIdx])
                            .map((r, i) => {
                                const rawStatus = statusIdx !== -1 ? String(r[statusIdx]||'').trim().toLowerCase() : '';
                                const mappedStatus = JIRA_STATUS_MAP[rawStatus] || 'pending';
                                return { id: i, key: String(r[keyIdx]||'').trim(), name: String(r[sumIdx]||'').trim(), status: mappedStatus };
                            })
                            .filter(t => t.name);
                        if (parsed.length === 0) { setError('לא נמצאו משימות בקובץ'); return; }
                        const autoSel = {};
                        parsed.forEach(t => {
                            const conflict = t.key && existingByKey[t.key.toUpperCase()];
                            if (!conflict) autoSel[t.id] = { action: 'add', item: t };
                        });
                        setJiraTasks(parsed);
                        setSelected(autoSel);
                    } catch { setError('שגיאה בקריאת הקובץ'); }
                };
                reader.readAsArrayBuffer(file);
            }

            function toggleSelect(t) {
                const conflict = t.key && existingByKey[t.key.toUpperCase()];
                if (conflict) return;
                setSelected(prev => ({ ...prev, [t.id]: prev[t.id] ? undefined : { action: 'add', item: t } }));
            }

            function setConflictAction(t, action) {
                setSelected(prev => ({ ...prev, [t.id]: action === 'skip' ? undefined : { action, item: t } }));
            }

            function selectAllNew() {
                const next = { ...selected };
                jiraTasks.forEach(t => {

                setSelected(next);

            function handleImport() {
                onImport(Object.values(selected).filter(Boolean));

            const selectedCount = Object.values(selected).filter(Boolean).length;
            const conflicts = jiraTasks.filter(t => t.key && existingByKey[t.key.toUpperCase()]);

                            <span style={{ fontSize:12, fontWeight:400, color:'#94a3b8', marginRight:'auto' }}>Issue key → מספר משימה | Summary → שם משימה | Status → סטטוס</span>
                        </div>
                        <div style={{ padding:'12px 20px', borderBottom:'1px solid #f1f5f9', background:'#f8fafc', display:'flex', alignItems:'flex-start', gap:10 }}>
                            <span style={{ fontSize:18, marginTop:1 }}>ℹ️</span>
                            <div style={{ fontSize:12, color:'#475569', lineHeight:1.6 }}>
                                <strong style={{ color:'#1e293b' }}>איך לייצא מ-Jira?</strong><br/>
                                פתח פילטר משימות ב-Jira ← לחץ <strong>Export → Excel</strong> ← טען את הקובץ כאן.<br/>
                                <span style={{ color:'#64748b' }}>מהקובץ יטענו <strong>מספר המשימה (Issue key)</strong>, <strong>שם המשימה (Summary)</strong> ו<strong>סטטוס (Status)</strong> בלבד.</span>
                            </div>

                        <div style={{ padding:'12px 20px', borderBottom:'1px solid #f1f5f9', display:'flex', alignItems:'center', gap:12 }}>
                            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{ display:'none' }} onChange={e => { if (e.target.files?.[0]) handleFile(e.target.files[0]); e.target.value=''; }} />
                            <button onClick={() => fileRef.current?.click()}

                            {jiraTasks.length > 0 && (
                                <>

                                            </div>
                                            {conflicts.map(t => {
                                                const existing = existingByKey[t.key.toUpperCase()];
                                                const sel = selected[t.id];
                                                return (
                                                    <div key={t.id} style={{ padding:'10px 20px', borderTop:'1px solid #fde68a', display:'flex', flexDirection:'column', gap:6 }}>
                                                        <div style={{ display:'flex', gap:8, alignItems:'flex-start' }}>

                                                                <div style={{ fontSize:12, color:'#64748b' }}>חדש: <span style={{ color:'#374151' }}>{t.name}</span></div>
                                                            </div>
                                                        </div>
                                                        <div style={{ display:'flex', gap:8 }}>
                                                            <button onClick={() => setConflictAction(t, 'skip')}
                                                                    style={{ padding:'4px 12px', borderRadius:6, fontSize:12, border:'1px solid #e2e8f0', cursor:'pointer',
                                                                             background: !sel ? '#f1f5f9' : '#fff', fontWeight: !sel ? 700 : 400, color: !sel ? '#374151' : '#94a3b8' }}>
                                                                דלג
                                                            </button>
                                                            <button onClick={() => setConflictAction(t, 'replace')}
                                                                    style={{ padding:'4px 12px', borderRadius:6, fontSize:12, border:'1px solid #e2e8f0', cursor:'pointer',
                                                                             background: sel?.action === 'replace' ? '#fef3c7' : '#fff', fontWeight: sel?.action === 'replace' ? 700 : 400, color: sel?.action === 'replace' ? '#92400e' : '#94a3b8' }}>
                                                                החלף
                                                            </button>
                                                            <button onClick={() => setConflictAction(t, 'add')}
                                                                    style={{ padding:'4px 12px', borderRadius:6, fontSize:12, border:'1px solid #e2e8f0', cursor:'pointer',

                                                                הוסף גם
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}

                                    {newTasks.length > 0 && (

        function NumberCell({ value, onChange, placeholder='0', className='' }) {

            return (
                <input type="text" inputMode="decimal" className={cls('cell-input no-spin', className)} value={displayValue} placeholder={placeholder}
                    onChange={e => setLocal(e.target.value)}
                    onBlur={() => {
                        if (local === '' || local === null || local === 0 || local === '0') { onChange(0); setLocal(0); return; }
                        const num = Number(local);
                        onChange(isNaN(num) ? 0 : num);
                    }} />
            );
        }
        function TextCell({ value, onChange, className='', required=false, placeholder='—', autoFocusOnMount=false }) {
            const [local, setLocal] = useState(value ?? '');
            const [editing, setEditing] = useState(autoFocusOnMount);
            const [invalid, setInvalid] = useState(false);
            const inputRef = useRef(null);
            useEffect(() => { setLocal(value ?? ''); }, [value]);
            function commit(v) {
                if (required && !v.trim()) {
                    setInvalid(true);
                    setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 0);
                    return;
                }
                setInvalid(false);
                setEditing(false);
                onChange(v);
            }
            useEffect(() => {
                if (editing) {
                    const tryFocus = (attempts) => {
                        if (inputRef.current) {
                            inputRef.current.focus();
                            inputRef.current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                        } else if (attempts > 0) {
                            setTimeout(() => tryFocus(attempts - 1), 50);
                        }
                    };
                    const t = setTimeout(() => tryFocus(5), 30);
                    return () => clearTimeout(t);
                }
            }, [editing]);
            if (editing) return (
                <input ref={inputRef} type="text"
                    className={cls('cell-input text-right', invalid ? 'border-red-400 bg-red-50' : '', className)}
                    value={local}
                    placeholder={required ? 'שם משימה...' : placeholder}
                    onChange={e => { setLocal(e.target.value); if (invalid && e.target.value.trim()) setInvalid(false); }}
                    onBlur={() => commit(local)}
                    onKeyDown={e => { if (e.key === 'Enter') commit(local); if (e.key === 'Escape' && !required) { setLocal(value ?? ''); setEditing(false); } }} />
            );
            return (
                <div onClick={() => setEditing(true)}
                    className={cls('cursor-text min-h-[28px] px-2 py-1 rounded-md hover:bg-white hover:border hover:border-slate-200 text-right break-words whitespace-normal leading-snug', invalid ? 'border border-red-400 bg-red-50' : '', className)}
                    style={{ wordBreak: 'break-word' }}>
                    {local || <span className="text-slate-300 italic text-sm">{required ? 'לחץ להוספת שם' : '—'}</span>}
                </div>
            );
        }

        function useColWidths(defaults, lsKey) {
            const [widths, setWidths] = useState(() => {
                try { const s = localStorage.getItem(lsKey); return s ? { ...defaults, ...JSON.parse(s) } : { ...defaults }; } catch { return { ...defaults }; }
            });
            function setWidth(col, w) {
                setWidths(prev => {
                    const next = { ...prev, [col]: Math.max(40, w) };
                    try { localStorage.setItem(lsKey, JSON.stringify(next)); } catch {}
                    return next;
                });
            }
            return [widths, setWidth];
        }

        function ResizableTh({ colKey, widths, setWidth, className='', style={}, children }) {
            const thRef = useRef(null);
            const dragging = useRef(false);
            const startX = useRef(0);
            const startW = useRef(0);
            const [isDragging, setIsDragging] = useState(false);

            function onMouseDown(e) {
                e.preventDefault();
                dragging.current = true;
                startX.current = e.clientX;
                startW.current = widths[colKey];
                setIsDragging(true);
                function onMove(ev) {
                    if (!dragging.current) return;
                    const delta = startX.current - ev.clientX; // RTL: drag left = wider
                    setWidth(colKey, startW.current + delta);
                }
                function onUp() {
                    dragging.current = false;
                    setIsDragging(false);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                }
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            }

            return (
                <th ref={thRef} className={className} style={{ ...style, width: widths[colKey], minWidth: widths[colKey], maxWidth: widths[colKey], position: style.position || 'relative', overflow: 'hidden' }}>
                    {children}
                    <div className={`col-resize-handle${isDragging ? ' dragging' : ''}`} onMouseDown={onMouseDown} />
