<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .swal2-popup {
            font-family: 'Heebo', system-ui, sans-serif !important;
            direction: rtl !important;
            background: rgba(255,255,255,0.82) !important;
            backdrop-filter: blur(40px) saturate(200%) !important;
            -webkit-backdrop-filter: blur(40px) saturate(200%) !important;
            border: 1px solid rgba(255,255,255,0.6) !important;
            border-radius: 24px !important;
            box-shadow: 0 8px 48px rgba(14,165,233,0.18), 0 2px 16px rgba(99,102,241,0.14), inset 0 1px 0 rgba(255,255,255,0.9) !important;
            color: #0f172a !important;
        }
        .swal2-title { font-family: 'Heebo', system-ui, sans-serif !important; color: #0f172a !important; font-weight: 700 !important; }
        .swal2-html-container { font-family: 'Heebo', system-ui, sans-serif !important; color: #334155 !important; }
        .swal2-confirm {
            background: linear-gradient(135deg, #0ea5e9, #6366f1) !important;
            border: none !important; border-radius: 10px !important;
            font-family: 'Heebo', system-ui, sans-serif !important;
            font-weight: 600 !important; box-shadow: 0 2px 12px rgba(99,102,241,0.3) !important;
        }
        .swal2-cancel {
            background: rgba(100,116,139,0.12) !important;
            color: #475569 !important; border: 1px solid rgba(100,116,139,0.2) !important;
            border-radius: 10px !important; font-family: 'Heebo', system-ui, sans-serif !important;
            font-weight: 600 !important;
        }
        .swal2-cancel:hover { background: rgba(100,116,139,0.22) !important; }
        .swal2-icon { border-color: rgba(99,102,241,0.35) !important; }
        .swal2-icon.swal2-warning { border-color: rgba(251,146,60,0.4) !important; color: #f97316 !important; }
        .swal2-icon.swal2-success { border-color: rgba(34,197,94,0.35) !important; }
        .swal2-icon.swal2-success .swal2-success-ring { border-color: rgba(34,197,94,0.25) !important; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Heebo', system-ui, -apple-system, sans-serif; background: #f1f5f9; margin: 0; overflow: hidden; }
        #root { height: 100%; overflow: hidden; }
        .no-spin::-webkit-inner-spin-button, .no-spin::-webkit-outer-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
        @keyframes fadeInDown { from { opacity:0; transform:translate(-50%,-10px); } to { opacity:1; transform:translate(-50%,0); } }
        .no-spin { -moz-appearance: textfield; appearance: textfield; }
        #tt-portal {
            position: fixed; z-index: 9999; pointer-events: none;
            background: #0f172a; color: #fff; padding: 8px 10px; border-radius: 8px; width: 220px;
            font-size: 12px; line-height: 1.4; box-shadow: 0 10px 20px rgba(0,0,0,.2);
            opacity: 0; transition: opacity .15s ease;
        }
        #tt-portal.visible { opacity: 1; }
        #tt-portal::after { content:''; position:absolute; top:100%; right:50%; transform:translateX(50%); border:6px solid transparent; border-top-color:#0f172a; }
        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .cell-input { width:100%; background:transparent; border:1px solid transparent; padding:4px 6px; border-radius:6px; text-align:center; }
        .cell-input:hover { border-color:#cbd5e1; background:#fff; }
        .cell-input:focus { outline:none; border-color:#f59e0b; background:#fff; box-shadow:0 0 0 3px rgba(245,158,11,.15); }
        .scroll-x { overflow-x: auto; }
        table { border-collapse: separate; border-spacing: 0; }
        /* frozen columns: משימה (right) + התקדמות (left) */
        .sticky-col      { position: sticky; right: 0; z-index: 2; box-shadow: -2px 0 6px rgba(0,0,0,0.08); }
        .sticky-col-left { position: sticky; left: 0;  z-index: 2; box-shadow: 2px 0 6px rgba(0,0,0,0.08); }
        thead .sticky-col, thead .sticky-col-left { z-index: 3; background: #f8fafc; }
        tfoot .sticky-col { z-index: 3; }
        .sticky-group { box-shadow: -2px 0 6px rgba(0,0,0,0.08); }
        tbody .day-weekend { background: #f8fafc !important; }
        .day-weekend { color: #94a3b8; }
        @media print { .no-print { display: none !important; } }
        .wg-readonly button:not(.wg-allow-readonly),
        .wg-readonly input:not(.wg-allow-readonly),
        .wg-readonly select:not(.wg-allow-readonly),
        .wg-readonly textarea:not(.wg-allow-readonly),
        .wg-readonly .cursor-text {
            pointer-events: none !important;
            opacity: 0.5 !important;
            cursor: not-allowed !important;
        }
        .wg-readonly [data-wg-edit] { display: none !important; }
        /* col-resize handle */
        thead th { border-left: 1px solid #e2e8f0; }
        .col-resize-handle {
            position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            cursor: col-resize; z-index: 10; user-select: none;
        }
        .col-resize-handle.dragging { background: #10b981; opacity: 0.6; }
    </style>
</head>

<body>
    <div id="root">
        <div id="boot-screen"
            style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#d1fae5,#f1f5f9);color:#0f172a;font-family:'Heebo',system-ui,sans-serif;">
            <div style="width:52px;height:52px;border:5px solid #cbd5e1;border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;"></div>
            <div style="font-size:18px;font-weight:600;">טוען תוכנית ספרינט...</div>
            <div id="boot-status" style="font-size:13px;color:#475569;">טוען ספריות מהרשת</div>
            <div id="boot-error" style="max-width:640px;margin-top:8px;padding:14px 16px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;font-size:13px;display:none;white-space:pre-wrap;text-align:right;direction:rtl;"></div>
        </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    <script>
        (function () {
            var boot = document.getElementById('boot-status');
            var bootErr = document.getElementById('boot-error');
            function showErr(msg) {
                if (!bootErr) return;
                bootErr.style.display = 'block';
                bootErr.textContent = (bootErr.textContent ? bootErr.textContent + '\n' : '') + msg;
            }
            window.__bootStatus = function (msg) { if (boot) boot.textContent = msg; };
            window.__bootError = showErr;
            window.addEventListener('error', function (e) {
                if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) { showErr('נכשלה טעינה: ' + (e.target.src || e.target.href)); return; }
                showErr('שגיאה: ' + (e.message || e));
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                showErr('שגיאה אסינכרונית: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
            });
            setTimeout(function () {
                if (document.getElementById('boot-screen'))
                    showErr('הטעינה איטית – ודא חיבור לאינטרנט או בדוק Console (F12).');
            }, 15000);
        })();
    </script>
    <script>if (window.__bootStatus) window.__bootStatus('מקמפל את האפליקציה...');</script>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef, useReducer, useCallback } = React;

        // ========== CONSTANTS ==========
        const DAY_NAMES = ['א','ב','ג','ד','ה','ו','ש']; // Sun=0 ... Sat=6
        const TASK_TYPES = ['תשתית','שוטף','באגים','פרויקט'];
        const TASK_STATUSES = [
            { value: 'pending',     label: 'ממתין',    color: '#000000', bg: '#f1f5f9' },
            { value: 'in-progress', label: 'בביצוע',   color: '#3b82f6', bg: '#eff6ff' },
            { value: 'review',      label: 'בבדיקה',   color: '#f97316', bg: '#fff7ed' },
            { value: 'done',        label: 'הושלם',    color: '#10b981', bg: '#ecfdf5' },
        ];
        function getStatus(val, statuses=TASK_STATUSES) { return statuses.find(s => s.value === val) || statuses[0]; }
        const TASK_TYPE_COLORS_BASE = { 'תשתית':'#0ea5e9','שוטף':'#10b981','באגים':'#ef4444','פרויקט':'#8b5cf6','':'#94a3b8' };
        const COLOR_PALETTE = ['#0ea5e9','#10b981','#ef4444','#8b5cf6','#f59e0b','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
        function getTypeColor(name, taskTypes=[]) {
            if (!name) return '#94a3b8';
            if (TASK_TYPE_COLORS_BASE[name]) return TASK_TYPE_COLORS_BASE[name];
            const idx = taskTypes.indexOf(name);
            return COLOR_PALETTE[(idx >= 0 ? idx : 0) % COLOR_PALETTE.length];
        }
        const TASK_TYPE_COLORS = new Proxy(TASK_TYPE_COLORS_BASE, { get: (t,k) => t[k] || '#94a3b8' });
        const DEFAULT_ROLES = ['פיתוח','בודק','P&P','תשתיות','ניהול','אחר'];
        const API_BASE = '/api';
        const ganttId = new URLSearchParams(location.search).get('ganttId');
        function getAuth() {
            return window.wgAuth || (window.parent !== window && window.parent.wgAuth) || null;
        }
        function apiFetch(url, opts) {
            const auth = getAuth();
            if (auth) return auth.authFetch(url, opts);
            return new Promise((resolve, reject) => {
                const deadline = Date.now() + 3000;
                const t = setInterval(() => {
                    const a = getAuth();
                    if (a) { clearInterval(t); a.authFetch(url, opts).then(resolve).catch(reject); }
                    else if (Date.now() > deadline) { clearInterval(t); reject(new Error('wgAuth not ready')); }
                }, 20);
            });
        }

        // ========== DATE HELPERS ==========
        function isoDate(d) { return d.toISOString().slice(0, 10); }
        function parseISO(s) { return s ? new Date(s + 'T00:00:00') : null; }
        function buildRangeDays(start, end) {
            const s = typeof start === 'string' ? parseISO(start) : start;
            const e = typeof end === 'string' ? parseISO(end) : end;
            if (!s || !e || Number.isNaN(+s) || Number.isNaN(+e) || s > e) return [];
            const out = [];
            let cur = new Date(s.getFullYear(), s.getMonth(), s.getDate());
            const last = new Date(e.getFullYear(), e.getMonth(), e.getDate());
            while (cur <= last) {
                out.push(new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()));
                cur.setDate(cur.getDate() + 1);
            }
            return out;
        }
        function pad(n) { return String(n).padStart(2, '0'); }
        function isWeekendDate(d) { const dow = d.getDay(); return dow === 5 || dow === 6; }
        function fmtDMY(d) { return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; }
        function getRangeDays(meta) { return buildRangeDays(meta.sprint_start, meta.sprint_end); }
        function countWorkingDays(rangeDays) { return rangeDays.filter(d => !isWeekendDate(d)).length; }
        function sprintRangeLabel(meta) {
            const rangeDays = getRangeDays(meta);
            if (!rangeDays.length) return 'ספרינט';
            return `ספרינט ${fmtDMY(rangeDays[0])} – ${fmtDMY(rangeDays[rangeDays.length-1])}`;
        }

        // ========== INITIAL STATE ==========
        const now = new Date();
        const DEFAULT_TASK_TYPES = ['תשתית','שוטף','באגים','פרויקט'];

        const EMPTY_STATE = {
            meta: { title: 'תוכנית ספרינט', sprint_start: isoDate(new Date(now.getFullYear(), now.getMonth(), now.getDate())), sprint_end: isoDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 13)), freeze_date: null },
            manpower: { hours_per_day: 8.5, employees: [] },
            tasks: [],
            roles: DEFAULT_ROLES,
            taskTypes: DEFAULT_TASK_TYPES,
            taskStatuses: TASK_STATUSES,
            sprints: [],
        };

        // ========== HELPERS ==========
        const n = (x) => { const v = Number(x); return isNaN(v) ? 0 : v; };
        const fmt = (x) => {
            if (x === '' || x === null || x === undefined) return x;
            const v = Number(x); if (isNaN(v)) return x;
            return v % 1 === 0 ? v.toString() : v.toFixed(1);
        };
        const cls = (...c) => c.filter(Boolean).join(' ');

        // ========== CALCULATIONS ==========
        // day_off values: null/false/'' = work, 'vacation' = חופש, 'sick' = מחלה, true (legacy) = vacation
        function dayOffValue(emp, i) {
            const v = emp.day_off && emp.day_off[i];
            if (!v) return null;
            if (v === true) return 'vacation';
            return v;
        }

        function personSprintHours(emp, hpd, rangeDays) {
            return rangeDays.map((d, i) => {
                if (dayOffValue(emp, i)) return 0;
                if (isWeekendDate(d)) return 0;
                const override = emp.hours_override && n(emp.hours_override[i]) > 0 ? n(emp.hours_override[i]) : n(emp.hours_per_day_override) > 0 ? n(emp.hours_per_day_override) : hpd;
                return override;
            });
        }

        function empTotalHours(emp, hpd, rangeDays) {
            return personSprintHours(emp, hpd, rangeDays).reduce((a,b) => a+b, 0);
        }

        function roleHoursByDay(employees, hpd, rangeDays, roles) {
            const numDays = rangeDays.length;
            const result = {};
            roles.forEach(r => { result[r] = new Array(numDays).fill(0); });
            employees.forEach(e => {
                const hrs = personSprintHours(e, hpd, rangeDays);
                if (!result[e.team]) result[e.team] = new Array(numDays).fill(0);
                for (let i = 0; i < numDays; i++) result[e.team][i] += hrs[i];
            });
            return result;
        }

        function tasksDailyTotal(tasks, rangeDays) {
            const total = new Array(rangeDays.length).fill(0);
            tasks.forEach(t => {
                for (let i = 0; i < rangeDays.length; i++) {
                    if (t.start_day && isoDate(rangeDays[i]) < t.start_day) continue;
                    total[i] += n((t.days || [])[i]);
                }
            });
            return total;
        }

        function taskRowSum(task, rangeDays) {
            return (task.days || []).reduce((a, b, i) => {
                if (task.start_day && rangeDays[i] && isoDate(rangeDays[i]) < task.start_day) return a;
                return a + n(b);
            }, 0);
        }

        function getPrimaryRole(data) {
            const assignedTeams = new Set(data.manpower.employees.map(e => e.team));
            return data.roles.find(r => assignedTeams.has(r)) || data.roles[0] || 'פיתוח';
        }

        function makeEmptyDays(rangeDays) { return new Array(rangeDays.length).fill(0); }

        // ========== REDUCER ==========
        function reducer(state, action) {
            const rangeDays = getRangeDays(state.meta);
            const numDays = rangeDays.length;
            switch (action.type) {
                case 'LOAD_ALL': return action.payload;

                case 'SET_DATES': {
                    const newMeta = {
                        ...state.meta,
                        sprint_start: action.sprint_start,
                        sprint_end: action.sprint_end,
                        freeze_date: action.freeze_date || null,
                    };
                    const oldRangeDays = getRangeDays(state.meta);
                    const newRangeDays = getRangeDays(newMeta);
                    const oldIndex = new Map(oldRangeDays.map((d, i) => [isoDate(d), i]));
                    const remapNum = (arr=[]) => newRangeDays.map(d => n(arr[oldIndex.get(isoDate(d))]));
                    const remapBool = (arr=[]) => newRangeDays.map(d => !!arr[oldIndex.get(isoDate(d))]);
                    const tasks = state.tasks.map(t => ({
                        ...t,
                        days: remapNum(t.days || []),
                        start_day: t.start_day && oldIndex.has(t.start_day) ? t.start_day : (t.start_day && newRangeDays.some(d => isoDate(d) === t.start_day) ? t.start_day : null),
                    }));
                    const employees = state.manpower.employees.map(e => ({
                        ...e,
                        day_off: remapBool(e.day_off || []),
                        hours_override: remapNum(e.hours_override || []),
                    }));
                    return { ...state, meta: newMeta, tasks, manpower: { ...state.manpower, employees } };
                }

                case 'SET_META': {
                    return { ...state, meta: { ...state.meta, ...action.patch } };
                }

                case 'SET_EMP_FIELD': {
                    const emps = state.manpower.employees.map((e,i) => i===action.empIdx ? { ...e, [action.field]: action.value } : e);
                    return { ...state, manpower: { ...state.manpower, employees: emps } };
                }
                case 'SET_EMP_DAY_OFF': {
                    const emps = state.manpower.employees.map((e,i) => {
                        if (i !== action.empIdx) return e;
                        const d = [...(e.day_off || new Array(numDays).fill(null))];
                        const cur = d[action.dayIdx];
                        const legacy = cur === true ? 'vacation' : cur;
                        d[action.dayIdx] = legacy === null || !legacy ? 'vacation' : legacy === 'vacation' ? 'sick' : null;
                        return { ...e, day_off: d };
                    });
                    return { ...state, manpower: { ...state.manpower, employees: emps } };
                }
                case 'SET_EMP_HOUR_OVERRIDE': {
                    const emps = state.manpower.employees.map((e,i) => {
                        if (i !== action.empIdx) return e;
                        const o = [...(e.hours_override || new Array(numDays).fill(0))];
                        o[action.dayIdx] = action.value;
                        return { ...e, hours_override: o };
                    });
                    return { ...state, manpower: { ...state.manpower, employees: emps } };
                }
                case 'SET_HOURS_PER_DAY':
                    return { ...state, manpower: { ...state.manpower, hours_per_day: action.value } };
                case 'ADD_EMPLOYEE': {
                    const newEmp = { name: 'עובד חדש', team: state.roles[0]||'פיתוח', hours_per_day_override: 0, day_off: new Array(numDays).fill(false), hours_override: new Array(numDays).fill(0) };
                    return { ...state, manpower: { ...state.manpower, employees: [...state.manpower.employees, newEmp] } };
                }
                case 'DELETE_EMPLOYEE':
                    return { ...state, manpower: { ...state.manpower, employees: state.manpower.employees.filter((_,i) => i !== action.empIdx) } };
                case 'ADD_EMPLOYEE_FROM_TEAM': {
                    const { member } = action;
                    const exists = state.manpower.employees.some(e => e.name === member.name && e.team === member.role);
                    if (exists) return state;
                    const newEmp = { name: member.name, team: member.role || state.roles[0] || '', hours_per_day_override: 0, day_off: new Array(numDays).fill(false), hours_override: new Array(numDays).fill(0) };
                    return { ...state, manpower: { ...state.manpower, employees: [...state.manpower.employees, newEmp] } };
                }

                case 'SET_TASK_FIELD': {
                    const tasks = state.tasks.map((t,i) => i===action.idx ? { ...t, [action.field]: action.value, _newlyAdded: false } : t);
                    return { ...state, tasks };
                }
                case 'SET_TASK_DAY': {
                    const tasks = state.tasks.map((t,i) => {
                        if (i !== action.idx) return t;
                        const days = [...(t.days||new Array(numDays).fill(0))];
                        days[action.dayIdx] = action.value;
                        return { ...t, days };
                    });
                    return { ...state, tasks };
                }
                case 'ADD_TASK': {
                    const newTask = { name: action.importedName || '', task_number:'', owners:[], type: state.defaultTaskType || 'פרויקט', planned:0, days:new Array(numDays).fill(0), notes:'', status: state.defaultTaskStatus || 'pending', start_day:null, _uid: Math.random().toString(36).slice(2), _newlyAdded: !action.importedName };
                    return { ...state, tasks: [newTask, ...state.tasks] };
                }
                case 'SET_DEFAULT_TASK':
                    return { ...state, defaultTaskType: action.taskType ?? state.defaultTaskType, defaultTaskStatus: action.taskStatus ?? state.defaultTaskStatus };
                case 'DELETE_TASK':
                    return { ...state, tasks: state.tasks.filter((_,i) => i !== action.idx) };
                case 'REORDER_TASKS': {
                    const { fromIdx, toIdx } = action;
                    const tasks = [...state.tasks];
                    const [moved] = tasks.splice(fromIdx, 1);
                    tasks.splice(toIdx, 0, moved);
                    return { ...state, tasks };
                }

                case 'SET_SPRINT_FIELD': {
                    const sprints = state.sprints.map((s,i) => i===action.idx ? { ...s, [action.field]: action.value } : s);
                    return { ...state, sprints };
                }
                case 'SET_SPRINT_ITEM': {
                    const sprints = state.sprints.map((s,i) => {
                        if (i !== action.sIdx) return s;
                        const items = s.items.map((it,j) => j===action.iIdx ? { ...it, [action.field]: action.value } : it);
                        return { ...s, items };
                    });
                    return { ...state, sprints };
                }
                case 'ADD_SPRINT':
                    return { ...state, sprints: [...state.sprints, { name:'ספרינט חדש', dates:'', items:[] }] };
                case 'DELETE_SPRINT':
                    return { ...state, sprints: state.sprints.filter((_,i) => i !== action.idx) };
                case 'ADD_SPRINT_ITEM': {
                    const sprints = state.sprints.map((s,i) => i===action.sIdx ? { ...s, items:[...s.items, { task_name:'', type:'שוטף', plan:0, done:0 }] } : s);
                    return { ...state, sprints };
                }
                case 'DELETE_SPRINT_ITEM': {
                    const sprints = state.sprints.map((s,i) => i===action.sIdx ? { ...s, items:s.items.filter((_,j) => j!==action.iIdx) } : s);
                    return { ...state, sprints };
                }
                case 'ADD_ROLE': {
                    const name = (action.name||'').trim();
                    if (!name || state.roles.includes(name)) return state;
                    return { ...state, roles: [...state.roles, name] };
                }
                case 'DELETE_ROLE':
                    return { ...state, roles: state.roles.filter(r => r !== action.name) };
                case 'ADD_TASK_TYPE': {
                    const name = (action.name||'').trim();
                    if (!name || (state.taskTypes||[]).includes(name)) return state;
                    return { ...state, taskTypes: [...(state.taskTypes||DEFAULT_TASK_TYPES), name] };
                }
                case 'DELETE_TASK_TYPE':
                    return { ...state, taskTypes: (state.taskTypes||DEFAULT_TASK_TYPES).filter(t => t !== action.name) };
                case 'ADD_TASK_STATUS': {
                    const { value, label, color, bg, color2 } = action;
                    if (!value || !label) return state;
                    const cur = state.taskStatuses || TASK_STATUSES;
                    if (cur.find(s => s.value === value)) return state;
                    return { ...state, taskStatuses: [...cur, { value, label, color, bg, color2 }] };
                }
                case 'DELETE_TASK_STATUS': {
                    const cur = state.taskStatuses || TASK_STATUSES;
                    return { ...state, taskStatuses: cur.filter(s => s.value !== action.value) };
                }
                default: return state;
            }

        function TextCell({ value, onChange, className='', required=false, placeholder='—', autoFocusOnMount=false }) {
            const [local, setLocal] = useState(value ?? '');
            const [editing, setEditing] = useState(autoFocusOnMount);
            const [invalid, setInvalid] = useState(false);
            const inputRef = useRef(null);
            useEffect(() => { setLocal(value ?? ''); }, [value]);
            function commit(v) {
                if (required && !v.trim()) {
                    setInvalid(true);
                    setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 0);
                    return;
                }
                setInvalid(false);
                setEditing(false);
                onChange(v);
            }
            useEffect(() => {
                if (editing) {
                    const tryFocus = (attempts) => {
                        if (inputRef.current) {
                            inputRef.current.focus();
                            inputRef.current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                        } else if (attempts > 0) {
                            setTimeout(() => tryFocus(attempts - 1), 50);
                        }
                    };
                    const t = setTimeout(() => tryFocus(5), 30);
                    return () => clearTimeout(t);
                }
            }, [editing]);
            if (editing) return (
                <input ref={inputRef} type="text"
                    className={cls('cell-input text-right', invalid ? 'border-red-400 bg-red-50' : '', className)}
                    value={local}
                    placeholder={required ? 'שם משימה...' : placeholder}
                    onChange={e => { setLocal(e.target.value); if (invalid && e.target.value.trim()) setInvalid(false); }}
                    onBlur={() => commit(local)}
                    onKeyDown={e => { if (e.key === 'Enter') commit(local); if (e.key === 'Escape' && !required) { setLocal(value ?? ''); setEditing(false); } }} />
            );
            return (
                <div onClick={() => setEditing(true)}
                    className={cls('cursor-text min-h-[28px] px-2 py-1 rounded-md hover:bg-white hover:border hover:border-slate-200 text-right break-words whitespace-normal leading-snug', invalid ? 'border border-red-400 bg-red-50' : '', className)}

        function useColWidths(defaults, lsKey) {

            });
            function setWidth(col, w) {
                setWidths(prev => {

        function ResizableTh({ colKey, widths, setWidth, className='', style={}, children }) {
            const thRef = useRef(null);
            const dragging = useRef(false);
            const startX = useRef(0);
            const startW = useRef(0);
            const [isDragging, setIsDragging] = useState(false);

            function onMouseDown(e) {
                e.preventDefault();
                dragging.current = true;
                startX.current = e.clientX;
                startW.current = widths[colKey];
                setIsDragging(true);
                function onMove(ev) {
                    if (!dragging.current) return;
                    const delta = startX.current - ev.clientX; // RTL: drag left = wider
                    setWidth(colKey, startW.current + delta);
                }
                function onUp() {
                    dragging.current = false;
                    setIsDragging(false);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                }
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            }

            return (
                <th ref={thRef} className={className} style={{ ...style, width: widths[colKey], minWidth: widths[colKey], maxWidth: widths[colKey], position: style.position || 'relative', overflow: 'hidden' }}>
                    {children}

                settings:'M12 15a3 3 0 100-6 3 3 0 000 6zm7.4-3a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z',
            };
            return <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={paths[name]} /></svg>;
        };

        // ========== MONTH NAVIGATOR ==========
        function SprintHeader({ meta, dispatch }) {
            const rangeDays = getRangeDays(meta);
            const workdays = countWorkingDays(rangeDays);
            async function editDates() {
                const result = await Swal.fire({
                    title: 'ערוך תאריכי ספרינט',
                    html: `
                        <div style="display:grid;gap:12px;text-align:right">
                            <label>תאריך התחלה<input id="sw-start" type="date" class="swal2-input" value="${meta.sprint_start || ''}" style="margin:6px 0 0;width:100%"></label>
                            <label>תאריך סיום<input id="sw-end" type="date" class="swal2-input" value="${meta.sprint_end || ''}" style="margin:6px 0 0;width:100%"></label>
                            <label>תאריך הקפאה<input id="sw-freeze" type="date" class="swal2-input" value="${meta.freeze_date || ''}" style="margin:6px 0 0;width:100%"></label>
                        </div>`,
                    focusConfirm: false,
                    showCancelButton: true,
                    confirmButtonText: 'שמור',
                    cancelButtonText: 'ביטול',
                    preConfirm: () => {
                        const sprint_start = document.getElementById('sw-start').value;
                        const sprint_end = document.getElementById('sw-end').value;
                        const freeze_date = document.getElementById('sw-freeze').value || null;
                        if (!sprint_start || !sprint_end) return Swal.showValidationMessage('יש לבחור התחלה וסיום');
                        if (sprint_start > sprint_end) return Swal.showValidationMessage('תאריך התחלה חייב להיות לפני תאריך הסיום');
                        if (freeze_date && (freeze_date < sprint_start || freeze_date > sprint_end)) return Swal.showValidationMessage('תאריך ההקפאה חייב להיות בתוך טווח הספרינט');
                        return { sprint_start, sprint_end, freeze_date };
                    }
                });
                if (result.isConfirmed) dispatch({ type: 'SET_DATES', ...result.value });
            }
            return (
                <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-4 py-2 shadow-sm">
                    <div className="text-center min-w-[130px]">
                        <div className="font-bold text-slate-900">{rangeDays.length ? `${fmtDMY(rangeDays[0])} → ${fmtDMY(rangeDays[rangeDays.length-1])}` : 'בחר טווח'}</div>
                        <div className="text-xs text-slate-500">{rangeDays.length} ימים · {workdays} ימי עבודה</div>
                    </div>
                    <div className="mr-2 text-xs text-slate-400 border-r border-slate-200 pr-3">
                        ❄️ הקפאה: {meta.freeze_date ? fmtDMY(parseISO(meta.freeze_date)) : 'אין'}
                    </div>
                    <button onClick={editDates} className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50 inline-flex items-center gap-1">
                        <Icon name="edit" className="w-4 h-4" /> ערוך תאריכים
                    </button>
                </div>
            );
        }

        // ========== SIDEBAR ==========
        const NAV = [
            { id:'dashboard', label:'דשבורד', icon:'chart', hint:'סקירה כללית: KPI, עומס יומי, גרפים.' },
            { id:'tasks', label:'תוכנית עבודה', icon:'list', hint:'ניהול משימות לפי ימים בחודש.' },
            { id:'manpower', label:'כוח אדם', icon:'users', hint:'עובדים, ימי היעדרות ושעות.' },
            { id:'resources', label:'חלוקת משאבים', icon:'pie', hint:'שעות זמינות לפי תפקיד.' },
            { id:'sprints', label:'ספרינטים', icon:'target', hint:'מעקב ספרינטים חודשיים.' },
            { id:'settings', label:'הגדרות גאנט', icon:'settings', hint:'שם, שעות, תפקידים, סוגי משימות.' },
            { id:'help', label:'עזרה', icon:'info', hint:'מפת נתונים ונוסחאות.' },
        ];

        function Sidebar({ current, onSelect }) {
            useEffect(() => { window.__wgSetScreen = onSelect; }, [onSelect]);
            return null;
        }

        // ========== HEADER ==========
        function Header({ title, subtitle, onExport, onImport, onReset, meta, dispatch }) {
            const fileRef = useRef(null);
            return (
                <div className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200 no-print">
                    <div className="px-6 py-3 flex items-center gap-3 flex-wrap">
                        <div className="flex-1">
                            <h1 className="text-xl font-bold text-slate-900">{title}</h1>
                            {subtitle && <p className="text-sm text-slate-500 mt-0.5">{subtitle}</p>}
                        </div>
                        <SprintHeader meta={meta} dispatch={dispatch} />
                        {onImport && <><input ref={fileRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={e => { if (e.target.files?.[0]) onImport(e.target.files[0]); e.target.value=''; }} />
                        <button onClick={() => fileRef.current?.click()} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium">
                            <Icon name="upload" className="w-4 h-4" /> ייבוא
                        </button></>}
                        <button onClick={onExport} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium shadow-sm">
                            <Icon name="download" className="w-4 h-4" /> ייצוא
                        </button>
                        {onReset && <button onClick={onReset} title="איפוס לתבנית ריקה" className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 text-sm">
                            איפוס
                        </button>}
                    </div>
                </div>
            );
        }

        // ========== DAY HEADER HELPERS ==========
        function SprintDayHeader({ d, freeze_date }) {
            const dow = d.getDay();
            const weekend = isWeekendDate(d);
            const iso = isoDate(d);
            const frozen = freeze_date && iso >= freeze_date;
            return (
                <th className={cls('p-1 text-center', weekend && 'day-weekend')} style={{ minWidth: 54, background: frozen ? '#eff6ff' : undefined }}>
                    <div className={cls('text-[9px]', weekend ? 'text-slate-400' : frozen ? 'text-blue-400' : 'text-slate-500')}>{DAY_NAMES[dow]} {frozen ? '❄️' : ''}</div>
                    <div className={cls('text-xs font-semibold', weekend ? 'text-slate-400' : frozen ? 'text-blue-700' : 'text-slate-700')}>{fmtDMY(d)}</div>
                </th>
            );
        }

        // ========== DASHBOARD ==========
        function StatCard({ label, value, hint, color='slate', sub }) {
            const colors = { slate:'from-slate-50 to-slate-100 text-slate-700', blue:'from-sky-50 to-blue-100 text-sky-800', green:'from-emerald-50 to-green-100 text-emerald-800', red:'from-red-50 to-rose-100 text-red-700', amber:'from-amber-50 to-orange-100 text-amber-800', violet:'from-violet-50 to-purple-100 text-violet-800' };
            return (
                <div className={cls('rounded-2xl p-5 bg-gradient-to-br shadow-sm border border-white', colors[color])}>
                    <div className="flex items-center justify-between"><div className="text-sm font-medium opacity-80">{label}</div>{hint && <InfoIcon text={hint} />}</div>
                    <div className="text-3xl font-bold mt-2">{value}</div>
                    {sub && <div className="text-xs opacity-70 mt-1">{sub}</div>}
                </div>
            );
        }


        function Dashboard({ data }) {
            const { meta, manpower, tasks, roles } = data;
            const taskStatuses = data.taskStatuses || TASK_STATUSES;
            const rangeDays = getRangeDays(meta);
            const hpd = manpower.hours_per_day;
            const days = rangeDays;
            const numDays = days.length;
            const primaryRole = getPrimaryRole(data);

            const roleHours = useMemo(() => roleHoursByDay(manpower.employees, hpd, rangeDays, roles), [manpower.employees, hpd, meta.sprint_start, meta.sprint_end, roles]);
            const primaryAvail = roleHours[primaryRole] || new Array(numDays).fill(0);
            const taskDaily = useMemo(() => tasksDailyTotal(tasks, rangeDays), [tasks, meta.sprint_start, meta.sprint_end]);

            const totalAssigned = taskDaily.reduce((a,b) => a+b, 0);
            const totalAvail = primaryAvail.reduce((a,b) => a+b, 0);
            const utilizationPct = totalAvail ? (totalAssigned / totalAvail * 100) : 0;

            const today = isoDate(new Date());
            const sprintEnd = meta.sprint_end || '';
            const sprintStart = meta.sprint_start || '';
            const elapsedWorkDays = days.filter(d => !isWeekendDate(d) && isoDate(d) < today).length;
            const remainingWorkDays = days.filter(d => !isWeekendDate(d) && isoDate(d) >= today).length;
            const totalWorkDays = days.filter(d => !isWeekendDate(d)).length;
            const sprintEnded = sprintEnd && today > sprintEnd;
            const sprintStarted = sprintStart && today >= sprintStart;
            const timeElapsedPct = totalWorkDays > 0 ? (elapsedWorkDays / totalWorkDays * 100) : 0;

            const doneTasks = tasks.filter(t => t.status === 'done').length;
            const totalTasks = tasks.length;
            const progressPct = totalTasks > 0 ? (doneTasks / totalTasks * 100) : 0;

            // tasks per employee
            const tasksByEmployee = useMemo(() => {
                const map = {};
                tasks.forEach(t => {
                    (t.owners || []).forEach(name => {
                        if (!name) return;
                        if (!map[name]) map[name] = { total: 0, done: 0 };
                        map[name].total++;
                        if (t.status === 'done') map[name].done++;
                    });
                });
                return Object.entries(map).sort((a,b) => b[1].total - a[1].total);
            }, [tasks]);
            const maxTasksForEmployee = tasksByEmployee.length ? tasksByEmployee[0][1].total : 1;

            // absence days within sprint range
            const absenceByEmployee = useMemo(() => {
                const result = [];
                manpower.employees.forEach(emp => {
                    const count = (emp.day_off || []).filter((off, i) => {
                        if (!off) return false;
                        const d = days[i];
                        return d && !isWeekendDate(d);
                    }).length;
                    if (count > 0) result.push({ name: emp.name, count });
                });
                return result;
            }, [manpower.employees, days]);
            const totalAbsenceDays = absenceByEmployee.reduce((s,e) => s + e.count, 0);

            // planned hours total
            const totalPlanned = useMemo(() => tasks.reduce((s,t) => s + n(t.planned), 0), [tasks]);
            const hoursGap = totalAvail - totalPlanned;
            const hoursGapPct = totalAvail > 0 ? (totalPlanned / totalAvail * 100) : 0;

            const statusCounts = useMemo(() => {
                const counts = {};
                taskStatuses.forEach(s => { counts[s.value] = 0; });
                tasks.forEach(t => { const s = t.status || 'pending'; if (counts[s] !== undefined) counts[s]++; else counts[s] = 1; });
                return counts;
            }, [tasks, taskStatuses]);

            // progress bar color logic
            const progressColor = progressPct >= 100 ? '#10b981' : progressPct >= timeElapsedPct ? '#3b82f6' : progressPct >= 40 ? '#f59e0b' : '#ef4444';
            const timeColor = sprintEnded ? '#10b981' : remainingWorkDays <= 2 ? '#ef4444' : remainingWorkDays <= 5 ? '#f59e0b' : '#3b82f6';

            function exportSummaryHTML() {
                const fmtD = d => { if (!d) return '—'; const o = new Date(d); return `${pad(o.getDate())}/${pad(o.getMonth()+1)}/${o.getFullYear()}`; };
                const statusLabel = v => (taskStatuses.find(s=>s.value===v)||{label:v||'ממתין'}).label;
                const statusColor = v => (taskStatuses.find(s=>s.value===v)||{bg:'#f1f5f9',color:'#475569'});
                const taskRows = tasks.map(t => {
                    const assigned = t.days ? t.days.reduce((a,b)=>a+n(b),0) : 0;
                    const sc = statusColor(t.status);
                    return `<tr>
                        <td>${t.name||'—'}</td>
                        <td>${(t.owners||[]).join(', ')||'—'}</td>
                        <td>${t.type||'—'}</td>
                        <td style="text-align:center">${t.task_number||'—'}</td>
                        <td style="text-align:center">${fmt(n(t.planned))}</td>
                        <td style="text-align:center">${fmt(assigned)}</td>
                        <td style="text-align:center"><span style="background:${sc.bg};color:${sc.color||sc.text||'#333'};padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600">${statusLabel(t.status)}</span></td>
                        <td>${t.notes||''}</td>
                    </tr>`;
                }).join('');
                const empRows = manpower.employees.map(e => {
                    const avail = (roleHours[e.team]||[]).reduce((a,b)=>a+n(b),0);
                    const absCount = (e.day_off||[]).filter((v,i)=>(v&&v!==false)&&!isWeekendDate(rangeDays[i])).length;
                    return `<tr>
                        <td>${e.name}</td><td>${e.team}</td>
                        <td style="text-align:center">${fmt(avail)}</td>
                        <td style="text-align:center">${absCount > 0 ? `<span style="color:#ea580c;font-weight:600">${absCount} יום</span>` : '—'}</td>
                    </tr>`;
                }).join('');
                const statusRows = taskStatuses.map(s => {
                    const c = statusCounts[s.value]||0;
                    const pct = totalTasks ? (c/totalTasks*100).toFixed(0) : 0;
                    return `<tr><td><span style="background:${s.bg};color:${s.color||s.text||'#333'};padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600">${s.label}</span></td><td style="text-align:center">${c}</td><td style="text-align:center">${pct}%</td></tr>`;
                }).join('');
                const html = `<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>סיכום ספרינט – ${meta.title||''}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; color: #0f172a; direction: rtl; padding: 32px; }
  .page { max-width: 1100px; margin: 0 auto; }
  .header { background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; border-radius: 20px; padding: 28px 36px; margin-bottom: 28px; }
  .header h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  .header p { font-size: 14px; opacity: .85; }
  .kpi-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 14px; margin-bottom: 28px; }
  .kpi { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
  .kpi .lbl { font-size: 11px; color: #64748b; font-weight: 600; margin-bottom: 6px; }
  .kpi .val { font-size: 30px; font-weight: 800; line-height: 1; }
  .kpi .sub { font-size: 12px; color: #94a3b8; margin-top: 5px; }
  .kpi .gap { font-size: 18px; font-weight: 800; margin-top: 4px; }
  .section { background: #fff; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
  .section h2 { font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1.5px solid #f1f5f9; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f8fafc; color: #64748b; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 10px 12px; text-align: right; border-bottom: 1.5px solid #e2e8f0; }
  td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }
  .prog-bar { background: #e2e8f0; border-radius: 999px; height: 8px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 999px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .footer { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 32px; }
  @media print { body { background: #fff; padding: 0; } .page { max-width: 100%; } }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>📋 ${meta.title||'ספרינט'}</h1>
    <p>${fmtD(meta.sprint_start)} – ${fmtD(meta.sprint_end)} &nbsp;|&nbsp; ${totalWorkDays} ימי עבודה &nbsp;|&nbsp; הופק: ${new Date().toLocaleDateString('he-IL')}</p>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="lbl">סה״כ משימות</div><div class="val" style="color:#1d4ed8">${totalTasks}</div></div>
    <div class="kpi"><div class="lbl">הושלמו</div><div class="val" style="color:#059669">${doneTasks}</div><div class="sub">${progressPct.toFixed(0)}% מהיעד</div></div>
    <div class="kpi"><div class="lbl">שעות זמינות</div><div class="val" style="color:#7c3aed">${fmt(totalAvail)}</div><div class="sub">ניצול ${utilizationPct.toFixed(0)}%</div></div>
    <div class="kpi"><div class="lbl">שעות נדרשות</div><div class="val" style="color:${hoursGap>=0?'#059669':'#dc2626'}">${fmt(totalPlanned)}</div><div class="gap" style="color:${hoursGap>=0?'#059669':'#dc2626'}">${hoursGap>=0?'עודף':'חסר'} ${fmt(Math.abs(hoursGap))} ש׳</div></div>
    <div class="kpi"><div class="lbl">חופש / מחלה</div><div class="val" style="color:${totalAbsenceDays>0?'#ea580c':'#059669'}">${totalAbsenceDays}</div><div class="sub">${totalAbsenceDays===0?'ללא היעדרויות':absenceByEmployee.length+' עובדים'}</div></div>
  </div>

  <div class="section">
    <h2>📊 סטטוס משימות</h2>
    <div style="margin-bottom:14px"><div class="prog-bar" style="height:14px"><div class="prog-fill" style="width:${progressPct.toFixed(0)}%;background:linear-gradient(90deg,#10b981,#059669)"></div></div></div>
    <table><thead><tr><th>סטטוס</th><th style="text-align:center">כמות</th><th style="text-align:center">אחוז</th></tr></thead><tbody>${statusRows}</tbody></table>
  </div>

  <div class="section">
    <h2>✅ רשימת משימות</h2>
    <table>
      <thead><tr><th>שם משימה</th><th>מובילים</th><th>סוג</th><th style="text-align:center">מזהה</th><th style="text-align:center">תכנון (ש׳)</th><th style="text-align:center">שיבוץ (ש׳)</th><th style="text-align:center">סטטוס</th><th>הערות</th></tr></thead>
      <tbody>${taskRows}</tbody>
    </table>
  </div>

  <div class="section">
    <h2>👥 כוח אדם</h2>
    <table>
      <thead><tr><th>שם</th><th>תפקיד</th><th style="text-align:center">שעות זמינות</th><th style="text-align:center">היעדרויות</th></tr></thead>
      <tbody>${empRows}</tbody>
    </table>
  </div>

  <div class="footer">Planner • הופק ב-${new Date().toLocaleString('he-IL')}</div>
</div>
</body></html>`;
                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${meta.title||'ספרינט'} – סיכום.html`;
                a.click();
                URL.revokeObjectURL(a.href);
            }

            return (
                <div style={{ padding: 24, display: 'flex', flexDirection: 'column', gap: 20, background: '#f8fafc', minHeight: '100%' }}>

                    {/* ── export button ── */}

        // ========== TASKS SCREEN ==========
        function TasksScreen({ data, dispatch }) {
            const { show: showToast, Toast } = useToast();
            const { meta, manpower, tasks, roles, taskTypes=DEFAULT_TASK_TYPES, taskStatuses=TASK_STATUSES } = data;
            const rangeDays = getRangeDays(meta);
            const hpd = manpower.hours_per_day;
            const days = rangeDays;
            const numDays = days.length;
            const primaryRole = getPrimaryRole(data);

            const roleHours = useMemo(() => roleHoursByDay(manpower.employees, hpd, rangeDays, roles), [manpower, meta.sprint_start, meta.sprint_end, roles]);
            const avail = roleHours[primaryRole] || new Array(numDays).fill(0);
            const totals = tasksDailyTotal(tasks, rangeDays);
            const diff = avail.map((a,i) => a - totals[i]);
            const totalPlanned = useMemo(() => tasks.reduce((a,t) => a + n(t.planned), 0), [tasks]);
            const totalAssigned = totals.reduce((a,b) => a+b, 0);
            const planVsAssign = totalPlanned - totalAssigned;

            const [filter, setFilter] = useState('');
            const [typeFilter, setTypeFilter] = useState('');
            const [colW, setColW] = useColWidths(SPRINT_COL_DEFAULTS, LS_KEY_SPRINT);
            const [showImportModal, setShowImportModal] = useState(false);
            const filtered = tasks.map((t,idx) => ({ ...t, idx })).filter(t => {
                if (filter && !t.name.toLowerCase().includes(filter.toLowerCase())) return false;
                if (typeFilter && t.type !== typeFilter) return false;
                return true;
            });
            const taskDragSrc = useRef(null);
            const [taskDragOver, setTaskDragOver] = useState(null);
            function onTaskDragStart(e, realIdx) { taskDragSrc.current = realIdx; e.dataTransfer.effectAllowed = 'move'; }
            function onTaskDragOver(e, realIdx) { e.preventDefault(); setTaskDragOver(realIdx); }
            function onTaskDrop(e, realIdx) {
                e.preventDefault();
                const src = taskDragSrc.current;
                if (src === null || src === realIdx) { taskDragSrc.current = null; setTaskDragOver(null); return; }
                dispatch({ type: 'REORDER_TASKS', fromIdx: src, toIdx: realIdx });
                taskDragSrc.current = null;
                setTaskDragOver(null);
            }
            function onTaskDragEnd() { taskDragSrc.current = null; setTaskDragOver(null); }

            function handleImportTasks(names) {
                const existingNames = new Set(tasks.map(t => (t.name||'').trim().toLowerCase()));
                const toImport = names.filter(n => !existingNames.has(n.trim().toLowerCase()));
                const skipped = names.length - toImport.length;
                toImport.forEach(name => {
                    dispatch({ type:'ADD_TASK', importedName: name });
                });
                if (skipped > 0) showToast(`${skipped} משימות לא יובאו כי קיימות כבר`);
                setShowImportModal(false);
            }

            return (
                <div className="p-6 space-y-4">
                    <Toast />
                    {showImportModal && (
                        <ImportTasksModal
                            existingTaskNames={tasks.map(t => t.name || '')}
                            onImport={handleImportTasks}
                            onClose={() => setShowImportModal(false)}
                        />
                    )}
                    <div className="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap gap-3 items-center justify-start">
                        <button onClick={() => {
                            if (tasks.some(t => !t.name || t.name.trim() === '')) {
                                showToast('יש למלא שם למשימה הפתוחה לפני הוספת משימה חדשה');
                                return;
                            }
                            dispatch({ type:'ADD_TASK' });
                        }} className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">
                            <Icon name="plus" className="w-4 h-4" /> משימה חדשה
                        </button>
                        <button onClick={() => setShowImportModal(true)}
                                className="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium">
                            <Icon name="download" className="w-4 h-4" /> ייבא משימה
                        </button>
                        <input placeholder="חיפוש משימה..." value={filter} onChange={e => setFilter(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-lg text-sm min-w-52" />
                        <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-lg text-sm">
                            <option value="">כל הסוגים</option>
                            {taskTypes.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div className="scroll-x">
                            <table className="text-sm w-full">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-600 border-b border-slate-200">
                                        <th style={{width:20,minWidth:20,maxWidth:20}}></th>
                                        <ResizableTh colKey="task"     widths={colW} setWidth={setColW} className="p-2 text-right sticky-col bg-slate-50" style={{position:'sticky',right:0,zIndex:3}}>משימה</ResizableTh>
                                        <ResizableTh colKey="taskNum"  widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">מס׳ משימה</ResizableTh>
                                        <ResizableTh colKey="status"   widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">סטטוס</ResizableTh>
                                        <ResizableTh colKey="owners"   widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">עובדים</ResizableTh>
                                        <ResizableTh colKey="type"     widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">סוג משימה</ResizableTh>

                                        <ResizableTh colKey="planned"  widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50">תכנון <InfoIcon text="אומדן שעות כולל לספרינט זה." /></ResizableTh>
                                        {days.map(d => <SprintDayHeader key={isoDate(d)} d={d} freeze_date={meta.freeze_date} />)}
                                        <ResizableTh colKey="progress" widths={colW} setWidth={setColW} className="p-2 text-center bg-slate-50 sticky-col-left" style={{position:'sticky',left:0,zIndex:3}}>התקדמות <InfoIcon text="שובץ מתוך תוכנן. אדום = חסר/עודף, ירוק = מדויק." /></ResizableTh>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.map(t => {
                                        const rowSum = taskRowSum(t, rangeDays);
                                        const isMatch = t.planned > 0 && n(rowSum) === n(t.planned);
                                        const startDay = t.start_day || null;
                                        const st = getStatus(t.status, taskStatuses);
                                        const stickyBg = st.bg || '#ffffff';

                                            <tr key={t._uid || t.idx}
