                            </section>
                            <section>
                                <h3 className="font-bold text-slate-800 mb-2">ניהול טווח הספרינט</h3>
                                <p className="text-sm text-slate-700">
                                    ניתן לערוך את טווח הספרינט דרך כפתור "ערוך תאריכים" בכותרת — לבחור תאריך התחלה, סיום ותאריך הקפאה.
                                    בעת שינוי הטווח, הערכים הקיימים (שעות יומיות, היעדרויות) ממופים מחדש לפי תאריך ISO כדי לשמור על הנתונים.
                                </p>
                            </section>
                            <section>
                                <h3 className="font-bold text-slate-800 mb-2">ייצוא / ייבוא</h3>
                                <p className="text-sm text-slate-700">ניתן לייצא לאקסל (.xlsx) ולייבא בחזרה. הנתונים נשמרים אוטומטית בשרת (API).</p>
                            </section>
                        </div>
                    </div>
                </div>
            );
        }

        // ========== SECTION CARD ==========
        function SectionCard({ accent, icon, title, desc, children }) {
            const accents = {
                amber:  { bar:'#f59e0b', bg:'#fffbeb', iconBg:'#fef3c7', iconColor:'#d97706' },
                sky:    { bar:'#0ea5e9', bg:'#f0f9ff', iconBg:'#e0f2fe', iconColor:'#0284c7' },
                emerald:{ bar:'#10b981', bg:'#f0fdf4', iconBg:'#d1fae5', iconColor:'#059669' },
                violet: { bar:'#8b5cf6', bg:'#faf5ff', iconBg:'#ede9fe', iconColor:'#7c3aed' },
                rose:   { bar:'#f43f5e', bg:'#fff1f2', iconBg:'#ffe4e6', iconColor:'#e11d48' },
            };
            const a = accents[accent] || accents.amber;
            return (
                <div style={{ background:'#fff', borderRadius:20, boxShadow:'0 4px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04)', border:'1px solid #e8edf3', overflow:'hidden' }}>
                    <div style={{ background: `linear-gradient(135deg, ${a.bg} 0%, #fff 100%)`, borderBottom:'1px solid #e8edf3', padding:'18px 24px 16px' }}>
                        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                            <div style={{ width:36, height:36, borderRadius:10, background: a.iconBg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, boxShadow:`0 0 0 4px ${a.bar}18` }}>
                                {icon}
                            </div>
                            <div>
                                <div style={{ fontWeight:700, fontSize:15, color:'#1e293b', letterSpacing:'-0.01em' }}>{title}</div>
                                {desc && <div style={{ fontSize:12, color:'#94a3b8', marginTop:2, lineHeight:1.5 }}>{desc}</div>}
                            </div>
                            <div style={{ marginRight:'auto', width:3, height:32, borderRadius:4, background: a.bar, flexShrink:0 }} />
                        </div>
                    </div>
                    <div style={{ padding:'20px 24px' }}>
                        {children}
                    </div>
                </div>
            );
        }

        // ========== SETTINGS SCREEN ==========
        function SettingsScreen({ data, dispatch, onDirtyChange }) {
            const { meta, manpower, roles, taskTypes=DEFAULT_TASK_TYPES, taskStatuses=TASK_STATUSES } = data;
            const [title, setTitle] = useState(meta.title);
            const [hpd, setHpd] = useState(manpower.hours_per_day);
            const [localDefaultType, setLocalDefaultType] = useState(data.defaultTaskType || taskTypes[0] || 'פרויקט');
            const [localDefaultStatus, setLocalDefaultStatus] = useState(data.defaultTaskStatus || (taskStatuses[0] && taskStatuses[0].value) || 'pending');
            const [newRole, setNewRole] = useState('');
            const [newType, setNewType] = useState('');
            const [newStatusLabel, setNewStatusLabel] = useState('');
            const [newStatusBg, setNewStatusBg] = useState('#6366f1');
            const [newStatusText, setNewStatusText] = useState('#ffffff');

            const isDirty = title !== meta.title
                || Number(hpd) !== manpower.hours_per_day
                || localDefaultType !== (data.defaultTaskType || taskTypes[0] || 'פרויקט')
                || localDefaultStatus !== (data.defaultTaskStatus || (taskStatuses[0] && taskStatuses[0].value) || 'pending');

            useEffect(() => { if (onDirtyChange) onDirtyChange(isDirty); }, [isDirty]);

            const STATUS_PALETTE = [
                '#6366f1','#818cf8','#a5b4fc','#ddd6fe',
                '#0ea5e9','#38bdf8','#7dd3fc','#bae6fd',
                '#10b981','#34d399','#6ee7b7','#a7f3d0',
                '#f59e0b','#fbbf24','#fcd34d','#fef08a',
                '#ef4444','#f87171','#fca5a5','#fecaca',
                '#ec4899','#f472b6','#f9a8d4','#fbcfe8',
                '#8b5cf6','#a78bfa','#c4b5fd','#ede9fe',
                '#14b8a6','#2dd4bf','#5eead4','#99f6e4',
                '#f97316','#fb923c','#fdba74','#fed7aa',
                '#64748b','#94a3b8','#cbd5e1','#f1f5f9',
                '#1e293b','#334155','#475569','#ffffff',
            ];
            const TEXT_PALETTE = [
                '#ffffff','#f8fafc','#f1f5f9','#e2e8f0',
                '#000000','#0f172a','#1e293b','#334155',
                '#475569','#64748b','#94a3b8','#cbd5e1',
                '#6366f1','#0ea5e9','#10b981','#f59e0b',
                '#ef4444','#ec4899','#8b5cf6','#f97316',
            ];

            function saveAll() {
                if (title !== meta.title) dispatch({ type:'SET_META', patch:{ title } });
                if (Number(hpd) !== manpower.hours_per_day) dispatch({ type:'SET_HOURS_PER_DAY', value:Number(hpd) });
                const origType = data.defaultTaskType || taskTypes[0] || 'פרויקט';
                const origStatus = data.defaultTaskStatus || (taskStatuses[0] && taskStatuses[0].value) || 'pending';
                if (localDefaultType !== origType || localDefaultStatus !== origStatus) {
                    dispatch({ type:'SET_DEFAULT_TASK', taskType: localDefaultType, taskStatus: localDefaultStatus });
                }
                if (onDirtyChange) onDirtyChange(false);
                Swal.fire({ toast:true, position:'top-end', icon:'success', title:'ההגדרות נשמרו', showConfirmButton:false, timer:1800, timerProgressBar:true });
            }

            async function deleteRole(r) {
                const used = data.manpower.employees.some(e => e.team === r);
                if (used) {
                    const res = await Swal.fire({ title:`למחוק תפקיד "${r}"?`, text:'עובדים המשויכים לתפקיד זה יישארו ללא תפקיד', icon:'warning', showCancelButton:true, confirmButtonText:'מחק', cancelButtonText:'ביטול', reverseButtons:true });
                    if (!res.isConfirmed) return;
                }
                dispatch({ type:'DELETE_ROLE', name:r });
            }

            async function deleteType(t) {
                const used = data.tasks.some(task => task.type === t);
                if (used) {
                    const res = await Swal.fire({ title:`למחוק סוג "${t}"?`, text:'משימות עם סוג זה יישארו ללא סוג', icon:'warning', showCancelButton:true, confirmButtonText:'מחק', cancelButtonText:'ביטול', reverseButtons:true });
                    if (!res.isConfirmed) return;
                }
                dispatch({ type:'DELETE_TASK_TYPE', name:t });
            }

            const inp = "w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400/40 focus:border-amber-400 transition shadow-sm";
            const inpSm = "px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-center font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400/40 focus:border-amber-400 transition shadow-sm";
            const sel = "w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400/40 focus:border-sky-400 transition shadow-sm appearance-none cursor-pointer";
            const fieldHint = "text-xs text-slate-400 mt-1.5 leading-relaxed";

            return (
                <div style={{background:'#f4f6fb', minHeight:'100%'}} className="p-6 space-y-5">

                    {/* ── SAVE BAR ── */}
                    <div style={{
                        display:'flex', alignItems:'center', justifyContent:'space-between',
                        padding:'14px 22px',
                        borderRadius:16,
                        background: isDirty ? 'linear-gradient(135deg,#fffbeb,#fef3c7)' : 'linear-gradient(135deg,#f8fafc,#f1f5f9)',
                        border: isDirty ? '1.5px solid #fcd34d' : '1.5px solid #e2e8f0',
                        boxShadow: isDirty ? '0 4px 20px rgba(245,158,11,0.18)' : '0 2px 8px rgba(0,0,0,0.04)',
                        transition:'all 0.25s',
                    }}>
                        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                            <div style={{ width:8, height:8, borderRadius:'50%', background: isDirty ? '#f59e0b' : '#94a3b8', boxShadow: isDirty ? '0 0 0 4px #fcd34d55' : 'none', transition:'all 0.25s' }} />
                            <span style={{ fontSize:13, fontWeight:600, color: isDirty ? '#92400e' : '#94a3b8' }}>
                                {isDirty ? 'יש שינויים שלא נשמרו' : 'כל השינויים מעודכנים'}
                            </span>
                        </div>
                        <button onClick={saveAll} disabled={!isDirty} style={{
                            padding:'9px 26px', borderRadius:10, fontSize:13, fontWeight:700, border:'none', cursor: isDirty ? 'pointer' : 'not-allowed',
                            background: isDirty ? 'linear-gradient(135deg,#f59e0b,#f97316)' : '#e2e8f0',
                            color: isDirty ? '#fff' : '#94a3b8',
                            boxShadow: isDirty ? '0 4px 14px rgba(245,158,11,0.4)' : 'none',
                            transition:'all 0.2s',
                        }}>
                            שמור הגדרות
                        </button>
                    </div>

                    {/* ── ROW 1: כללי + ברירות מחדל ── */}
                    <div className="flex gap-5 flex-wrap">

                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="amber" icon="⚙️" title="כללי" desc="הגדרות בסיסיות של הגאנט">
                            <div className="space-y-4">
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>שם התוכנית</label>
                                    <input value={title} onChange={e => setTitle(e.target.value)} className={inp} placeholder="שם הגאנט..." />
                                    <p className={fieldHint}>מוצג בכותרת הגאנט ובסיידבר.</p>
                                </div>
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>שעות עבודה ליום</label>
                                    <input type="number" step="0.5" min="1" max="24" value={hpd} onChange={e => setHpd(e.target.value)} className={inpSm} style={{width:120}} />
                                    <p className={fieldHint}>בסיס חישוב שעות זמינות לכל עובד.</p>
                                </div>
                            </div>
                        </SectionCard>
                        </div>

                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="sky" icon="✦" title="ברירות מחדל למשימה חדשה" desc="ערכים שיוגדרו אוטומטית בהוספת משימה">
                            <div className="space-y-4">
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>סוג משימה</label>
                                    <div style={{position:'relative'}}>
                                        <select value={localDefaultType} onChange={e => setLocalDefaultType(e.target.value)} className={sel}>
                                            {taskTypes.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                        <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94a3b8',fontSize:11}}>▾</span>
                                    </div>
                                    <p className={fieldHint}>הסוג שייבחר בעמודת "סוג משימה" אוטומטית.</p>
                                </div>
                                <div>
                                    <label style={{fontSize:12,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>סטטוס</label>
                                    <div style={{position:'relative'}}>
                                        <select value={localDefaultStatus} onChange={e => setLocalDefaultStatus(e.target.value)} className={sel}>
                                            {taskStatuses.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
                                        </select>
                                        <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94a3b8',fontSize:11}}>▾</span>
                                    </div>
                                    <p className={fieldHint}>הסטטוס ההתחלתי של כל משימה חדשה.</p>
                                </div>
                            </div>
                        </SectionCard>
                        </div>
                    </div>

                    {/* ── ROW 2: תפקידים + סוגי משימות ── */}
                    <div className="flex gap-5 flex-wrap">

                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="emerald" icon="👤" title="תפקידים" desc="לסיווג עובדים ומעקב ניצול משאבים לפי תפקיד">
                            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14,minHeight:36}}>
                                {roles.map(r => (
                                    <span key={r} style={{ display:'inline-flex',alignItems:'center',gap:4,padding:'5px 12px',borderRadius:999,background:'#f1f5f9',color:'#475569',fontSize:13,fontWeight:500,boxShadow:'0 1px 3px rgba(0,0,0,0.07)' }}>
                                        {r}
                                        <button onClick={() => deleteRole(r)} style={{color:'#94a3b8',background:'none',border:'none',cursor:'pointer',padding:'0 0 0 2px',fontSize:15,lineHeight:1}} onMouseEnter={e=>e.target.style.color='#ef4444'} onMouseLeave={e=>e.target.style.color='#94a3b8'}>×</button>
                                    </span>
                                ))}
                                {roles.length === 0 && <span style={{fontSize:12,color:'#cbd5e1',alignSelf:'center'}}>הוסף תפקיד ראשון...</span>}
                            </div>
                            <div style={{display:'flex',gap:8}}>
                                <input value={newRole} onChange={e => setNewRole(e.target.value)}
                                    onKeyDown={e => { if (e.key==='Enter' && newRole.trim()) { dispatch({ type:'ADD_ROLE', name:newRole.trim() }); setNewRole(''); } }}
                                    placeholder="שם תפקיד חדש..." className={inp} style={{flex:1}} />
                                <button onClick={() => { if (newRole.trim()) { dispatch({ type:'ADD_ROLE', name:newRole.trim() }); setNewRole(''); } }}
                                    style={{padding:'10px 18px',borderRadius:10,background:'linear-gradient(135deg,#10b981,#059669)',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,boxShadow:'0 2px 8px rgba(16,185,129,0.3)',whiteSpace:'nowrap'}}>
                                    + הוסף
                                </button>
                            </div>
                        </SectionCard>
                        </div>

                        <div style={{flex:'1 1 300px'}}>
                        <SectionCard accent="violet" icon="🏷️" title="סוגי משימות" desc="קיטלוג משימות לפי אופי — מוצג בצבע בגאנט">
                            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14,minHeight:36}}>
                                {taskTypes.map(t => (
                                    <span key={t} style={{ display:'inline-flex',alignItems:'center',gap:4,padding:'5px 12px',borderRadius:999,background:getTypeColor(t,taskTypes)+'18',color:getTypeColor(t,taskTypes),fontSize:13,fontWeight:600,boxShadow:'inset 0 0 0 1.5px '+getTypeColor(t,taskTypes)+'33' }}>
                                        {t}
                                        <button onClick={() => deleteType(t)} style={{background:'none',border:'none',cursor:'pointer',padding:'0 0 0 2px',fontSize:15,lineHeight:1,color:getTypeColor(t,taskTypes)+'99'}} onMouseEnter={e=>e.target.style.color='#ef4444'} onMouseLeave={e=>e.target.style.color=getTypeColor(t,taskTypes)+'99'}>×</button>
                                    </span>
                                ))}
                                {taskTypes.length === 0 && <span style={{fontSize:12,color:'#cbd5e1',alignSelf:'center'}}>הוסף סוג ראשון...</span>}
                            </div>
                            <div style={{display:'flex',gap:8}}>
                                <input value={newType} onChange={e => setNewType(e.target.value)}
                                    onKeyDown={e => { if (e.key==='Enter' && newType.trim()) { dispatch({ type:'ADD_TASK_TYPE', name:newType.trim() }); setNewType(''); } }}
                                    placeholder="סוג חדש..." className={inp} style={{flex:1}} />
                                <button onClick={() => { if (newType.trim()) { dispatch({ type:'ADD_TASK_TYPE', name:newType.trim() }); setNewType(''); } }}
                                    style={{padding:'10px 18px',borderRadius:10,background:'linear-gradient(135deg,#8b5cf6,#7c3aed)',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,boxShadow:'0 2px 8px rgba(139,92,246,0.3)',whiteSpace:'nowrap'}}>
                                    + הוסף
                                </button>
                            </div>
                        </SectionCard>
                        </div>
                    </div>

                    {/* ── ROW 3: סטטוסי משימות ── */}
                    <SectionCard accent="rose" icon="◉" title="סטטוסי משימות" desc="הגדר שם, צבע רקע וצבע טקסט לכל סטטוס — יוצג בגאנט ובדשבורד">
                        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:20,minHeight:36}}>
                            {taskStatuses.map(s => {
                                const inUse = data.tasks.some(t => t.status === s.value);
                                return (
                                    <span key={s.value} style={{ display:'inline-flex',alignItems:'center',gap:5,padding:'6px 14px',borderRadius:999,background: s.bg||s.color, color: s.color2||'#fff', fontSize:13, fontWeight:600, boxShadow:`0 2px 8px ${s.bg||s.color}55, inset 0 0 0 1px ${s.bg||s.color}` }}>
                                        {s.label}
                                        {!inUse && <button onClick={() => dispatch({ type:'DELETE_TASK_STATUS', value:s.value })} style={{background:'none',border:'none',cursor:'pointer',fontSize:15,lineHeight:1,color:'rgba(255,255,255,0.6)',padding:'0 0 0 2px'}} onMouseEnter={e=>e.target.style.color='#fff'} onMouseLeave={e=>e.target.style.color='rgba(255,255,255,0.6)'}>×</button>}
                                        {inUse && <span style={{fontSize:10,opacity:0.65,marginRight:2}}>בשימוש</span>}
                                    </span>
                                );
                            })}
                            {taskStatuses.length === 0 && <span style={{fontSize:12,color:'#cbd5e1'}}>הוסף סטטוס ראשון...</span>}
                        </div>

                        <div style={{ background:'#f8fafc', borderRadius:16, border:'1px solid #e2e8f0', padding:'20px 24px', boxShadow:'inset 0 2px 8px rgba(0,0,0,0.03)' }}>
                            <div style={{fontSize:11,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:14}}>הוספת סטטוס חדש</div>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                                <div>
                                    <label style={{fontSize:11,fontWeight:600,color:'#64748b',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>שם</label>
                                    <input value={newStatusLabel} onChange={e => setNewStatusLabel(e.target.value)}
                                        onKeyDown={e => { if (e.key==='Enter' && newStatusLabel.trim()) { const v = newStatusLabel.trim().toLowerCase().replace(/\s+/g,'-'); dispatch({ type:'ADD_TASK_STATUS', value:v, label:newStatusLabel.trim(), color:newStatusText, bg:newStatusBg, color2:newStatusText }); setNewStatusLabel(''); } }}
                                        placeholder="שם הסטטוס..." className={inp} />
                                </div>
                                <div style={{display:'flex',alignItems:'flex-end',gap:10}}>
                                    <div>
                                        <div style={{fontSize:11,fontWeight:600,color:'#64748b',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>תצוגה מקדימה</div>
                                        <span style={{ display:'inline-flex',alignItems:'center',padding:'7px 16px',borderRadius:999,background:newStatusBg,color:newStatusText,fontSize:13,fontWeight:600,boxShadow:`0 2px 8px ${newStatusBg}55`,minWidth:80,justifyContent:'center' }}>
                                            {newStatusLabel || 'סטטוס'}
                                        </span>
                                    </div>
                                    <button onClick={() => { if (newStatusLabel.trim()) { const v = newStatusLabel.trim().toLowerCase().replace(/\s+/g,'-'); dispatch({ type:'ADD_TASK_STATUS', value:v, label:newStatusLabel.trim(), color:newStatusText, bg:newStatusBg, color2:newStatusText }); setNewStatusLabel(''); } }}
                                        style={{padding:'9px 20px',borderRadius:10,background:'linear-gradient(135deg,#f43f5e,#e11d48)',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,boxShadow:'0 2px 8px rgba(244,63,94,0.35)',whiteSpace:'nowrap',marginBottom:1}}>
                                        + הוסף
                                    </button>
                                </div>
                            </div>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginTop:14}}>
                                <div>
                                    <div style={{fontSize:11,fontWeight:600,color:'#64748b',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>צבע רקע</div>
                                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                                        {STATUS_PALETTE.map(c => (
                                            <button key={c} onClick={() => setNewStatusBg(c)}
                                                style={{ background:c, width:24, height:24, borderRadius:6, border: newStatusBg===c ? '3px solid #0ea5e9' : '2px solid rgba(0,0,0,0.1)', cursor:'pointer', flexShrink:0, boxShadow: newStatusBg===c ? '0 0 0 2px #fff, 0 0 0 4px #0ea5e9' : 'none', transition:'box-shadow 0.15s' }} />
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <div style={{fontSize:11,fontWeight:600,color:'#64748b',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>צבע טקסט</div>
                                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                                        {TEXT_PALETTE.map(c => (
                                            <button key={c} onClick={() => setNewStatusText(c)}
                                                style={{ background:c, width:24, height:24, borderRadius:6, border: newStatusText===c ? '3px solid #0ea5e9' : '2px solid rgba(0,0,0,0.1)', cursor:'pointer', flexShrink:0, boxShadow: newStatusText===c ? '0 0 0 2px #fff, 0 0 0 4px #0ea5e9' : 'none', transition:'box-shadow 0.15s' }} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </SectionCard>

                </div>
            );
        }

        // ========== EXPORT / IMPORT ==========
        function exportToExcel(data) {
            const wb = XLSX.utils.book_new();
            const { meta, manpower, tasks, roles } = data;
            const taskStatuses = data.taskStatuses || TASK_STATUSES;
            const rangeDays = getRangeDays(meta);
            const hpd = manpower.hours_per_day;
            const numDays = rangeDays.length;
            const primaryRole = getPrimaryRole(data);
            const roleHours = roleHoursByDay(manpower.employees, hpd, rangeDays, roles);
            const avail = roleHours[primaryRole] || new Array(numDays).fill(0);
            const totals = tasksDailyTotal(tasks, rangeDays);
            const dayHeaders = rangeDays.map(d => {
                const iso = isoDate(d);
                return iso;
            });
            const totalAvail = avail.reduce((a,b)=>a+b,0);
            const totalAssigned = totals.reduce((a,b)=>a+b,0);
            const totalPlanned = tasks.reduce((s,t)=>s+n(t.planned),0);
            const doneTasks = tasks.filter(t=>t.status==='done').length;
            const totalWorkDays = rangeDays.filter(d=>!isWeekendDate(d)).length;
            const today = isoDate(new Date());

            // helper: apply cell styles via sheet['!styles'] (SheetJS pro) fallback via cell.s
            function setCellStyle(ws, addr, style) {
                if (!ws[addr]) ws[addr] = { t:'z', v:'' };
                ws[addr].s = style;
            }

            // ── STYLES ──────────────────────────────────────────────────
            const S = {
                titleFont:   { name:'Arial', sz:14, bold:true, color:{ rgb:'FFFFFF' } },
                headerFont:  { name:'Arial', sz:10, bold:true, color:{ rgb:'FFFFFF' } },
                boldFont:    { name:'Arial', sz:10, bold:true },
                normalFont:  { name:'Arial', sz:10 },
                numFont:     { name:'Arial', sz:10 },

                titleFill:   { fgColor:{ rgb:'1E3A5F' } },
                headerFill:  { fgColor:{ rgb:'2563EB' } },
                subFill:     { fgColor:{ rgb:'DBEAFE' } },
                totalFill:   { fgColor:{ rgb:'1E40AF' } },
                availFill:   { fgColor:{ rgb:'065F46' } },
                diffPosFill: { fgColor:{ rgb:'D1FAE5' } },
                diffNegFill: { fgColor:{ rgb:'FEE2E2' } },
                weekendFill: { fgColor:{ rgb:'F1F5F9' } },
                altFill:     { fgColor:{ rgb:'F8FAFC' } },

                doneFill:     { fgColor:{ rgb:'D1FAE5' } },
                progressFill: { fgColor:{ rgb:'EFF6FF' } },
                reviewFill:   { fgColor:{ rgb:'FFF7ED' } },
                pendingFill:  { fgColor:{ rgb:'F8FAFC' } },

                border: { top:{ style:'thin', color:{rgb:'E2E8F0'} }, bottom:{ style:'thin', color:{rgb:'E2E8F0'} }, left:{ style:'thin', color:{rgb:'E2E8F0'} }, right:{ style:'thin', color:{rgb:'E2E8F0'} } },
                borderMed: { top:{ style:'medium', color:{rgb:'CBD5E1'} }, bottom:{ style:'medium', color:{rgb:'CBD5E1'} }, left:{ style:'medium', color:{rgb:'CBD5E1'} }, right:{ style:'medium', color:{rgb:'CBD5E1'} } },

                center: { horizontal:'center', vertical:'center' },
                right:  { horizontal:'right',  vertical:'center' },
                left:   { horizontal:'left',   vertical:'center' },
            };

            function style(font, fill, align, border, numFmt) {
                const s = {};
                if (font)   s.font      = font;
                if (fill)   s.fill      = { patternType:'solid', ...fill };
                if (align)  s.alignment = { ...align, wrapText:true, readingOrder:2 };
                if (border) s.border    = border;
                if (numFmt) s.numFmt    = numFmt;
                return s;
            }

            function statusFill(status) {
                if (status==='done')        return S.doneFill;
                if (status==='in-progress') return S.progressFill;
                if (status==='review')      return S.reviewFill;
                return S.pendingFill;
            }

            function applyColStyles(ws, rows, startRow) {
                rows.forEach((row, ri) => {
                    row.forEach((_, ci) => {
                        const addr = XLSX.utils.encode_cell({ r: startRow + ri, c: ci });
                        if (!ws[addr]) ws[addr] = { t:'z', v:'' };
                    });
                });
            }

            // ── SHEET 1: תוכנית עבודה ───────────────────────────────────
            const FIXED_COLS = 7; // מס׳, משימה, מס׳ משימה, סטטוס, עובדים, סוג, תכנון
            const TRAIL_COLS = 2; // סה"כ, הערות

            const headerRow1 = [`${meta.title}   ${meta.sprint_start || ''} → ${meta.sprint_end || ''}`];
            const headerRow2 = ['#','משימה','מס׳ משימה','סטטוס','עובדים','סוג','תכנון (ש׳)', ...dayHeaders, 'סה״כ (ש׳)','הערות'];

            const taskDataRows = tasks.map((t, idx) => {
                const assigned = taskRowSum(t, rangeDays);
                const stObj = taskStatuses.find(s=>s.value===t.status) || { label: t.status };
                return [
                    idx+1,
                    t.name,
                    t.task_number||'',
                    stObj.label,
                    (t.owners||[]).join(', '),
                    t.type||'',
                    n(t.planned)||0,
                    ...rangeDays.map((_,i) => { const v=n((t.days||[])[i]); return v||0; }),
                    assigned,
                    t.notes||''
                ];
            });

            const totalRow   = ['','סה״כ שיבוץ','','','','','', ...totals, totalAssigned,''];
            const availRow   = ['',`${primaryRole} זמינים`,'','','','','', ...avail, totalAvail,''];
            const diffRow    = ['','הפרש','','','','','', ...avail.map((a,i)=>a-totals[i]), totalAvail-totalAssigned,''];

            const ws1Data = [headerRow1, headerRow2, ...taskDataRows, totalRow, availRow, diffRow];
            const ws1 = XLSX.utils.aoa_to_sheet(ws1Data);

            // merge title row
            ws1['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:FIXED_COLS+numDays+TRAIL_COLS-1} }];

            // freeze panes: row 2 + col 2 (משימה)
            ws1['!freeze'] = { xSplit:2, ySplit:2, topLeftCell:'C3', activePane:'bottomRight', state:'frozen' };

            // column widths
            const colWidths = [
                { wch:5 },   // #
                { wch:32 },  // משימה
                { wch:14 },  // מס׳ משימה
                { wch:10 },  // סטטוס
                { wch:22 },  // עובדים
                { wch:12 },  // סוג
                { wch:10 },  // תכנון
                ...rangeDays.map(d => ({ wch: isWeekendDate(d) ? 6 : 7 })),
                { wch:10 },  // סה"כ
                { wch:30 },  // הערות
            ];
            ws1['!cols'] = colWidths;
            ws1['!rows'] = [{ hpt:22 }, { hpt:30 }, ...taskDataRows.map(()=>({ hpt:20 })), { hpt:20 }, { hpt:20 }, { hpt:20 }];

            // apply cell styles
            const totalRows = ws1Data.length;
            const totalCols = FIXED_COLS + numDays + TRAIL_COLS;
            for (let r=0; r<totalRows; r++) {
                for (let c=0; c<totalCols; c++) {
                    const addr = XLSX.utils.encode_cell({r,c});
                    if (!ws1[addr]) ws1[addr] = {t:'z',v:''};
                    const isDay = c >= FIXED_COLS && c < FIXED_COLS+numDays;
                    const dayIdx = c - FIXED_COLS;
                    const isWeekend = isDay && isWeekendDate(rangeDays[dayIdx]);
                    const isTotal = c === FIXED_COLS+numDays;
                    const isNotes = c === FIXED_COLS+numDays+1;

                    if (r === 0) {
                        ws1[addr].s = style(S.titleFont, S.titleFill, S.center, S.borderMed);
                    } else if (r === 1) {
                        ws1[addr].s = style(S.headerFont, S.headerFill, S.center, S.borderMed);
                    } else if (r === totalRows-3) {
                        // total assigned row
                        const fill = (isDay||isTotal) ? (ws1Data[r][c]>0?{fgColor:{rgb:'FEF3C7'}}:S.altFill) : S.subFill;
                        ws1[addr].s = style({...S.boldFont,color:{rgb:'92400E'}}, fill, S.center, S.border, isNotes?undefined:'0.0');
                    } else if (r === totalRows-2) {
                        // avail row
                        ws1[addr].s = style({...S.boldFont,color:{rgb:'FFFFFF'}}, S.availFill, S.center, S.border, isNotes?undefined:'0.0');
                    } else if (r === totalRows-1) {
                        // diff row
                        const val = ws1Data[r][c];
                        const fill = (isDay||isTotal) ? (typeof val==='number'&&val<0 ? S.diffNegFill : S.diffPosFill) : {fgColor:{rgb:'E2E8F0'}};
                        ws1[addr].s = style({...S.boldFont, color:{rgb: typeof val==='number'&&val<0?'DC2626':'065F46'}}, fill, S.center, S.border, isNotes?undefined:'0.##');
                    } else {
                        // data rows
                        const task = tasks[r-2];
                        const fill = isWeekend ? S.weekendFill : isTotal ? {fgColor:{rgb:'EFF6FF'}} : (r%2===0 ? S.altFill : {fgColor:{rgb:'FFFFFF'}});
                        const stFill = (c===3 && task) ? statusFill(task.status) : fill;
                        const font = (c===1||c===isTotal) ? S.boldFont : S.normalFont;
                        const align = (isDay||isTotal||c===0||c===6) ? S.center : (c===1||c===4) ? S.right : S.center;
                        ws1[addr].s = style(font, stFill, align, S.border, (isDay||isTotal||c===6)&&!isNotes ? '0.##' : undefined);
                    }
                }
            }

            ws1['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws1, 'תוכנית עבודה');

            // ── SHEET 2: כוח אדם ────────────────────────────────────────
            const empHeader = ['עובד','תפקיד','שעות/יום','סה״כ שעות זמינות','ימי היעדרות', ...dayHeaders];
            const empRows = manpower.employees.map(emp => {
                const hrs = personSprintHours(emp, hpd, rangeDays);
                const total = hrs.reduce((a,b)=>a+b,0);
                const absences = (emp.day_off||[]).filter((v,i)=>(v&&v!==false)&&!isWeekendDate(rangeDays[i])).length;
                return [
                    emp.name, emp.team,
                    emp.hours_per_day_override > 0 ? emp.hours_per_day_override : hpd,
                    total, absences,
                    ...hrs.map(h=>h||0)
                ];
            });
            const ws2Data = [empHeader, ...empRows];
            const ws2 = XLSX.utils.aoa_to_sheet(ws2Data);
            ws2['!cols'] = [{ wch:20 },{ wch:14 },{ wch:10 },{ wch:16 },{ wch:14 },...rangeDays.map(d=>({ wch: isWeekendDate(d)?5:6 }))];
            ws2['!freeze'] = { xSplit:1, ySplit:1, topLeftCell:'B2', activePane:'bottomRight', state:'frozen' };
            ws2Data.forEach((row,ri) => {
                row.forEach((_,ci) => {
                    const addr = XLSX.utils.encode_cell({r:ri,c:ci});
                    if (!ws2[addr]) ws2[addr]={t:'z',v:''};
                    const isDay = ci>=5;
                    const dayIdx = ci-5;
                    const isWeekend = isDay && isWeekendDate(rangeDays[dayIdx]);
                    const isAbsDay = isDay && ri>0 && !!dayOffValue(manpower.employees[ri-1], dayIdx);
                    if (ri===0) {
                        ws2[addr].s = style(S.headerFont, S.headerFill, S.center, S.borderMed);
                    } else {
                        const fill = isAbsDay ? {fgColor:{rgb:'FEE2E2'}} : isWeekend ? S.weekendFill : ri%2===0 ? S.altFill : {fgColor:{rgb:'FFFFFF'}};
                        ws2[addr].s = style(isAbsDay?{...S.normalFont,color:{rgb:'DC2626'}}:S.normalFont, fill, S.center, S.border, (ci>=2&&ci!==4)?'0.##':undefined);
                    }
                });
            });
            ws2['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws2, 'כוח אדם');

            // ── SHEET 3: סיכום ───────────────────────────────────────────
            const hoursGap = totalAvail - totalPlanned;
            const progressPct = tasks.length ? (doneTasks/tasks.length*100) : 0;

            // tasks per employee
            const empTaskMap = {};
            tasks.forEach(t => {
                (t.owners||[]).forEach(name => {
                    if (!empTaskMap[name]) empTaskMap[name] = { total:0, done:0 };
                    empTaskMap[name].total++;
                    if (t.status==='done') empTaskMap[name].done++;
                });
            });

            const summaryData = [
                [`סיכום ספרינט — ${meta.title}`],
                [],
                ['נתון','ערך',''],
                ['תאריך התחלה', meta.sprint_start||'',''],
                ['תאריך סיום',  meta.sprint_end||'',''],
                ['ימי עבודה כולל', totalWorkDays,''],
                [],
                ['משימות','',''],
                ['סה״כ משימות', tasks.length,''],
                ['הושלמו', doneTasks, `${progressPct.toFixed(0)}%`],
                ...taskStatuses.map(st => {
                    const count = tasks.filter(t=>(t.status||'pending')===st.value).length;
                    return [st.label, count, tasks.length ? `${(count/tasks.length*100).toFixed(0)}%` : '0%'];
                }),
                [],
                ['שעות','',''],
                ['שעות זמינות', totalAvail,''],
                ['שעות נדרשות (תכנון)', totalPlanned,''],
                ['הפרש', hoursGap, hoursGap>=0?'✓ עודף':'✗ חסר'],
                ['שעות שובצו בפועל', totalAssigned,''],
                [],
                ['עובד','משימות','הושלמו'],
                ...Object.entries(empTaskMap).sort((a,b)=>b[1].total-a[1].total).map(([name,{total,done}])=>[name,total,done]),
                [],
                ['ימי היעדרות','',''],
                ...manpower.employees.map(emp => {
                    const abs = (emp.day_off||[]).filter((v,i)=>(v&&v!==false)&&!isWeekendDate(rangeDays[i])).length;
                    return [emp.name, abs, abs>0?'יש היעדרויות':''];
                }),
            ];

            const ws3 = XLSX.utils.aoa_to_sheet(summaryData);
            ws3['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:2} }];
            ws3['!cols'] = [{ wch:28 },{ wch:18 },{ wch:14 }];
            summaryData.forEach((row,ri) => {
                row.forEach((_,ci) => {
                    const addr = XLSX.utils.encode_cell({r:ri,c:ci});
                    if (!ws3[addr]) ws3[addr]={t:'z',v:''};
                    const val = summaryData[ri][0];
                    const isSectionHeader = ci===0 && ['משימות','שעות','עובד','ימי היעדרות'].includes(val);
                    const isTitleRow = ri===0;
                    const isEmpty = row.every(v=>v===''||v===undefined);
                    if (isTitleRow) {
                        ws3[addr].s = style(S.titleFont, S.titleFill, S.right, S.borderMed);
                    } else if (isSectionHeader || (ri===2&&row[0]==='נתון')) {
                        ws3[addr].s = style(S.headerFont, S.headerFill, S.right, S.border);
                    } else if (!isEmpty) {
                        const fill = ri%2===0 ? S.altFill : {fgColor:{rgb:'FFFFFF'}};
                        const isGap = val==='הפרש';
                        const gapVal = summaryData[ri][1];
                        const gapFill = isGap ? (gapVal>=0?S.diffPosFill:S.diffNegFill) : fill;
                        ws3[addr].s = style(ci===0?S.boldFont:S.normalFont, gapFill, ci===0?S.right:S.center, S.border);
                    }
                });
            });
            ws3['!views'] = [{ rightToLeft: true }];
            XLSX.utils.book_append_sheet(wb, ws3, 'סיכום');

            const fileName = `${meta.title} – ${meta.sprint_start||''} עד ${meta.sprint_end||''}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        async function importFromExcel(file, dispatch, currentData) {
            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type:'array' });
            const tasksSheet = wb.SheetNames.find(n => n.includes('תוכנית'));
            if (!tasksSheet) { Swal.fire({ title: 'שגיאה', text: 'לא נמצא גיליון תוכנית עבודה', icon: 'error', confirmButtonText: 'סגור' }); return; }
            const s = wb.Sheets[tasksSheet];
            const rows = XLSX.utils.sheet_to_json(s, { header:1, defval:'' });
            const tasks = [];
            const numDays = getRangeDays(currentData.meta).length;
            for (let i = 2; i < rows.length; i++) {
                const r = rows[i];
                if (!r[0] || String(r[0]).startsWith('סה') || String(r[0]).startsWith('הפרש') || String(r[0]).includes('זמינים')) continue;
                const days = [];
                for (let j = 4; j < 4+numDays; j++) days.push(n(r[j]));
                tasks.push({ name:r[0]||'', owners:r[1] ? String(r[1]).split(', ').filter(Boolean) : [], type:r[2]||'', planned:n(r[3]), days, notes:r[4+numDays+1]||'', status:'pending', start_day:null });
            }
            if (tasks.length) {
                dispatch({ type:'LOAD_ALL', payload:{ ...currentData, tasks } });
                Swal.fire({ title: 'ייבוא הצליח', text: `יובאו ${tasks.length} משימות`, icon: 'success', confirmButtonText: 'סגור' });
            } else { Swal.fire({ title: 'לא נמצאו נתונים', icon: 'error', confirmButtonText: 'סגור' }); }
        }

        // ========== API helpers ==========
        function stateToPayload(data) {
            return {
                gantt: {
                    name: data.meta?.title,
                    year: null,
                    month: null,
                    sprint_start: data.meta?.sprint_start || null,
                    sprint_end: data.meta?.sprint_end || null,
                    freeze_date: data.meta?.freeze_date || null,
                    hours_per_day: data.manpower?.hours_per_day || 8.5,
                    workdays_base: { taskTypes: data.taskTypes || DEFAULT_TASK_TYPES, taskStatuses: data.taskStatuses || TASK_STATUSES },
                },
                roles: (data.roles || []).map((name, i) => ({ name, sort_order: i })),
                employees: (data.manpower?.employees || []).map((e, i) => ({
                    name: e.name, team: e.team,
                    vacation_json: null,
                    hours_override_json: e.hours_override && e.hours_override.some(v => v) ? e.hours_override : null,
                    workdays_json: null,
                    day_off_json: e.day_off && e.day_off.some(v => v) ? e.day_off : null,
                    hours_per_day_override: e.hours_per_day_override || 0,
                    sort_order: i,
                })),
                tasks: (data.tasks || []).map((t, i) => ({
                    name: t.name, owner: JSON.stringify(t.owners || []), type: t.type || '',
                    planned: String(t.planned ?? '0'),
                    months_json: null, days_json: t.days || null,
                    notes: t.notes || '', status: t.status || 'pending',
                    start_day: t.start_day ?? null, sort_order: i,
                })),
                sprints: (data.sprints || []).map((s, i) => ({
                    name: s.name, dates: s.dates || '', sort_order: i,
                    items: (s.items || []).map((it, j) => ({
                        task_name: it.task_name || '', type: it.type || '',
                        plan: Number(it.plan || 0), done: Number(it.done || 0), sort_order: j,
                    })),
                })),
            };
        }

        function apiStateToAppState(api) {
            const now = new Date();
            const sprint_start = api.sprint_start || isoDate(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
            const sprint_end = api.sprint_end || isoDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 13));
            const freeze_date = api.freeze_date || null;
            const rangeDays = buildRangeDays(sprint_start, sprint_end);
            const dayCount = rangeDays.length;
            return {
                meta: { title: api.name || 'תוכנית ספרינט', sprint_start, sprint_end, freeze_date },
                manpower: {
                    hours_per_day: api.hours_per_day || 8.5,
                    employees: (api.employees || []).map(e => ({
                        name: e.name, team: e.team,
                        day_off: e.day_off_json || new Array(dayCount).fill(false),
                        hours_override: e.hours_override_json || new Array(dayCount).fill(0),
                        hours_per_day_override: e.hours_per_day_override || 0,
                    })),
                },
                tasks: (api.tasks || []).map(t => ({
                    name: t.name,
                    owners: (() => { try { const v = JSON.parse(t.owner||'[]'); return Array.isArray(v) ? v : []; } catch { return t.owner ? [t.owner] : []; } })(),
                    type: t.type || '', planned: t.planned || '0',
                    days: t.days_json || new Array(dayCount).fill(0), notes: t.notes || '',
                    status: t.status || 'pending', start_day: t.start_day ?? null,
                })),
                roles: (api.roles && api.roles.length > 0) ? api.roles.map(r => r.name === 'QA' ? 'בודק' : r.name) : DEFAULT_ROLES,
                taskTypes: (api.workdays_base && api.workdays_base.taskTypes) ? api.workdays_base.taskTypes : (Array.isArray(api.workdays_base) ? api.workdays_base : DEFAULT_TASK_TYPES),
                taskStatuses: (api.workdays_base && api.workdays_base.taskStatuses) ? api.workdays_base.taskStatuses : TASK_STATUSES,
                sprints: (api.sprints || []).map(s => ({
                    name: s.name, dates: s.dates || '',
                    items: (s.items || []).map(it => ({ task_name: it.task_name || '', type: it.type || '', plan: it.plan || 0, done: it.done || 0 })),
                })),
            };
        }

        // ========== APP ==========
        function App() {
            const [data, dispatch] = useReducer(reducer, EMPTY_STATE);
            const [loaded, setLoaded] = useState(false);
            const isNewGantt = new URLSearchParams(location.search).get('new') === '1';
            const [screen, setScreen] = useState(() => isNewGantt ? 'settings' : (localStorage.getItem('wg_sprint_screen') || 'dashboard'));
            const settingsDirtyRef = useRef(false);
            useEffect(() => { localStorage.setItem('wg_sprint_screen', screen); }, [screen]);

            async function navigateTo(target) {
                if (screen === 'settings' && settingsDirtyRef.current) {
                    const res = await Swal.fire({ title:'יש שינויים שלא נשמרו', text:'האם לצאת מההגדרות מבלי לשמור?', icon:'warning', showCancelButton:true, confirmButtonText:'צא ללא שמירה', cancelButtonText:'הישאר', reverseButtons:true });
                    if (!res.isConfirmed) return;
                }
                setScreen(target);
            }
            const saveTimer = useRef(null);
            const isViewer = (() => { try { const a = getAuth(); const u = a && a.getUser(); return u?.role === 'viewer'; } catch { return false; } })();

            function loadGantt() {
                if (!ganttId) { setLoaded(true); return; }
                apiFetch(`${API_BASE}/gantts/${ganttId}`)
                    .then(r => r.json())
                    .then(api => {
                        if (api && api.id) {
                            dispatch({ type: 'LOAD_ALL', payload: apiStateToAppState(api) });
                            setLoaded(true);
                        }
                    })
                    .catch(() => {});
            }

            useEffect(() => {
                // only register — wgAuth fires __wgOnLogin after successful login
                window.__wgOnLogin = () => { setLoaded(false); loadGantt(); };
                // if already authenticated (token in localStorage), load immediately
                if (localStorage.getItem('wg_access_token')) loadGantt();
                else setLoaded(true); // show empty state until login
                return () => { window.__wgOnLogin = null; };
            }, []);

            useEffect(() => {
                if (!loaded || !ganttId || isViewer) return;
                if (saveTimer.current) clearTimeout(saveTimer.current);
                saveTimer.current = setTimeout(() => {
                    apiFetch(`${API_BASE}/gantts/${ganttId}/state`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(stateToPayload(data)),
                    }).catch(console.error);
                }, 800);
            }, [data, loaded]);

            if (!loaded) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:16,color:'#64748b'}}>טוען תוכנית ספרינט...</div>;

            const titles = {
                dashboard: { title:'דשבורד', sub:'סקירה כללית של הספרינט הנוכחי.' },
                tasks: { title:'תוכנית עבודה', sub:'ניהול משימות לפי ימי הספרינט.' },
                manpower: { title:'כוח אדם', sub:'עובדים, ימי היעדרות ושעות זמינות בספרינט.' },
                resources: { title:'חלוקת משאבים', sub:'שעות זמינות לפי תפקיד ויום ספרינט (מחושב).' },
                sprints: { title:'ספרינטים', sub:'מעקב תכנון מול ביצוע.' },
                help: { title:'עזרה', sub:'מפת נתונים ונוסחאות.' },
                settings: { title:'הגדרות גאנט', sub:'שם, שעות עבודה, תפקידים וסוגי משימות.' },
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    <Sidebar current={screen} onSelect={navigateTo} meta={data.meta} />
                    <main className={`flex-1 min-w-0 overflow-y-auto${isViewer ? ' wg-readonly' : ''}`}>
                        {isViewer && <div style={{background:'linear-gradient(90deg,#f59e0b,#f97316)',color:'#fff',padding:'6px 20px',fontSize:13,fontWeight:700,textAlign:'center',letterSpacing:'.02em'}}>מצב צפייה בלבד — אין לך הרשאות עריכה</div>}
                        {screen !== 'settings' && (
                            <Header
                                title={titles[screen].title}
                                subtitle={titles[screen].sub}
                                meta={data.meta}
                                dispatch={dispatch}
                                onExport={() => exportToExcel(data)}
                                onImport={isViewer ? null : f => importFromExcel(f, dispatch, data)}
                                onReset={isViewer ? null : async () => { const r = await Swal.fire({ title: 'לאפס את כל הנתונים?', text: 'הפעולה תמחק את כל המשימות, העובדים והספרינטים', icon: 'warning', showCancelButton: true, confirmButtonText: 'אפס', cancelButtonText: 'ביטול', reverseButtons: true }); if (r.isConfirmed) dispatch({ type:'LOAD_ALL', payload:EMPTY_STATE }); }}
                            />
                        )}
                        {screen === 'settings' && (
                            <div className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200 no-print px-6 py-3">
                                <h1 className="text-xl font-bold text-slate-900">{titles.settings.title}</h1>
                                <p className="text-sm text-slate-500 mt-0.5">{titles.settings.sub}</p>
                            </div>
                        )}
                        {screen==='dashboard' && <Dashboard data={data} />}
                        {screen==='tasks' && <TasksScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} />}
                        {screen==='manpower' && <ManpowerScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} />}
                        {screen==='resources' && <ResourcesScreen data={data} />}
                        {screen==='sprints' && <SprintsScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} />}
                        {screen==='help' && <HelpScreen />}
                        {screen==='settings' && <SettingsScreen data={data} dispatch={isViewer ? ()=>{} : dispatch} onDirtyChange={v => { settingsDirtyRef.current = v; }} />}
                    </main>
                </div>
            );
        }

        const bootEl = document.getElementById('boot-screen');
        if (bootEl && bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
        if (window.__bootStatus) window.__bootStatus('מרנדר...');
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
<div id="tt-portal"></div>
</body>
</html>
